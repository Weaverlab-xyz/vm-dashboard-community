name: Publish images

# Build and push the multi-arch (linux/amd64 + linux/arm64) Docker images to
# Docker Hub. Fires on a version tag (e.g. v0.1.0) or a manual dispatch.
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME  - Docker Hub account / namespace (chrweav)
#   DOCKERHUB_TOKEN     - a Docker Hub access token. Pushing the images needs
#                         Read/Write, but the description-sync step at the end
#                         of the job needs Read/Write/DELETE: Hub's description
#                         API is an account-management call, and a Read/Write
#                         token is refused there with a 403. Delete is the
#                         narrowest scope Hub offers that includes it -- there
#                         is no description-only or metadata-only scope. If you
#                         would rather not hand the push credential delete
#                         rights, give the sync step a second, R/W/D token of
#                         its own instead and leave this one at Read/Write.
#
# Images built (each from a clean checkout, so corp-ca/ is empty and no
# BUILD_SKIP_DEBIAN_UPDATES is passed -> the public images carry no corp CA
# and retain full Debian security updates):
#   chrweav/infra-dashboard            (context: .)
#   chrweav/dashboard-promote-runner   (context: runners/promote)
#   chrweav/ansible-winrm              (context: runners/ansible-winrm)
#   chrweav/ansible-cloud              (context: runners/ansible-cloud)
#   chrweav/dashboard-agent            (context: runners/agent)
#   chrweav/hypervisor-runner          (context: runners/hypervisor)
#
# The published Hub overview for chrweav/infra-dashboard is generated from
# DOCKERHUB.md in the repo root by the description-sync step at the end of this
# job -- edit that file, tag a release, and Hub follows. Nothing is pasted by
# hand any more. The other five images keep whatever overview their Hub repo
# already has; no one has written one for them.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: chrweav/infra-dashboard
            context: .
            dockerfile: Dockerfile
          - image: chrweav/dashboard-promote-runner
            context: runners/promote
            dockerfile: runners/promote/Dockerfile
          - image: chrweav/ansible-winrm
            context: runners/ansible-winrm
            dockerfile: runners/ansible-winrm/Dockerfile
          # The k8s / cloud-database localhost runner. config.py defaults
          # ansible_cloud_image to chrweav/ansible-cloud:latest, so this must be
          # published alongside the others or that default points at a stale tag.
          - image: chrweav/ansible-cloud
            context: runners/ansible-cloud
            dockerfile: runners/ansible-cloud/Dockerfile
          # The remote on-prem agent. Unlike the runners above, this one is pulled by
          # an operator inside a private network rather than launched by the dashboard,
          # so the published tag IS the distribution channel — the install command the
          # Agents page hands out references it by name.
          - image: chrweav/dashboard-agent
            context: runners/agent
            dockerfile: runners/agent/Dockerfile
          # The agent's one-shot hypervisor runner: Hyper-V (WinRM/NTLM) and bare ESXi
          # (SOAP), the two transports the agent's three-dependency image deliberately
          # cannot carry. Pulled by the operator on the agent host, like the agent
          # itself — the agent never pulls it, because a pull is a network fetch of
          # executable content and that is the operator's decision, not a job's.
          - image: chrweav/hypervisor-runner
            context: runners/hypervisor
            dockerfile: runners/hypervisor/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      # secrets.github_token: consumed by the main Dockerfile's Packer step as
      # PACKER_GITHUB_API_TOKEN. `packer plugins install` resolves plugins via
      # the GitHub API, whose anonymous quota is 60 req/hour per *source IP* —
      # shared NAT on a hosted runner, so it is regularly exhausted by unrelated
      # tenants (this failed release v26.7.3 with a 403). Authenticating raises
      # it to 1000 req/hour/repo. Passed as a build secret, not a --build-arg,
      # so it never lands in the published image history; the other five images
      # don't mount it and are unaffected. contents:read above is all it needs
      # (it only reads public hashicorp/packer-plugin-* release tags).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Publish DOCKERHUB.md as the Hub "Repository overview", so the first page a
      # new user reads is generated from the repo instead of re-pasted by hand.
      #
      # Gated twice, and both gates matter:
      #   * tags only -- a manual dispatch publishes a throwaway sha-... tag and
      #     must not rewrite the overview of whatever release is actually current.
      #   * the dashboard leg only -- the other five images are separate Hub repos
      #     with no overview written for them, and DOCKERHUB.md is the dashboard's
      #     quickstart. Running this for them would publish the wrong page five
      #     times. Widening the gate means writing their overviews first.
      #
      # DOCKERHUB.md opens with an HTML comment of maintainer notes closed by a
      # `---` divider, and only what follows that divider is the published text.
      # `0,/^---$/` deletes up to and including the FIRST such line -- the body
      # uses `---` as a horizontal rule as well, so an unanchored delete would eat
      # the opening section too.
      - name: Render the Hub overview from DOCKERHUB.md
        if: github.ref_type == 'tag' && matrix.image == 'chrweav/infra-dashboard'
        run: sed '0,/^---$/d' DOCKERHUB.md > hub-overview.md

      # Reuses DOCKERHUB_TOKEN, but that token must carry Read/Write/DELETE --
      # Hub's description API refuses a plain Read/Write token with a 403, and
      # delete is the narrowest scope that covers the call (see the header). A
      # Hub account password also works here; a token is preferred because it is
      # revocable on its own. Left at the end of the job on purpose: a scope
      # problem here then costs only the overview, never the image push.
      - name: Sync the Hub repository overview
        if: github.ref_type == 'tag' && matrix.image == 'chrweav/infra-dashboard'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: chrweav/infra-dashboard
          readme-filepath: hub-overview.md
