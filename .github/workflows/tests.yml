name: Tests

# Runs the tests/ suite on every pull request and on pushes to main.
#
# Each test file is executed as its own process (via its `if __name__ ==
# "__main__"` runner) rather than through a single `pytest tests/` invocation.
# That's deliberate: several test files install fakes into sys.modules (to stub
# the cloud SDKs / pydantic config / database) with no teardown, so running them
# in one shared process could let one file's stubs leak into another. Per-file
# subprocesses keep them isolated — and every file already ships a standalone
# runner for exactly this reason. Each runner prints `ok`/`FAIL` per test and
# exits non-zero on failure.
#
# The full app requirements are installed so nothing silently skips (a few tests
# import the real FastAPI app / boto3 rather than stubbing them).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches the Dockerfile base image
          cache: pip
          cache-dependency-path: web_dashboard/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web_dashboard/requirements.txt

      - name: Run test suite
        run: |
          fail=0
          for f in tests/test_*.py; do
            echo "::group::$f"
            python "$f" || fail=1
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more test files failed"
          fi
          exit $fail

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  #
  # Production runs PostgreSQL; the job above runs SQLite. That is the right trade for
  # almost everything — the application code is dialect-neutral by design, and a service
  # container for 400+ files would buy little — but it leaves one real gap, and the gap
  # is SILENT in the direction that matters.
  #
  # `init_db`'s migration list runs each statement in its own savepoint and swallows the
  # failure, because "column already exists" is the expected outcome on every boot after
  # the first. A statement that is malformed *for PostgreSQL* is swallowed identically:
  # nothing raises, nothing logs, the column never appears, and SQLite — more permissive
  # about literals and types — keeps the suite green. Adding this job immediately found
  # one (`ALTER TABLE users ADD COLUMN is_admin BOOLEAN DEFAULT 0`, which PostgreSQL
  # rejects and SQLite accepts).
  #
  # DELIBERATELY NOT the whole suite. Pointing every file at one shared database would
  # not be a drop-in: 12 files use `os.environ.setdefault("DATABASE_URL", ...)` and so
  # would silently move onto PostgreSQL, ~90 touch the database, and several call
  # `init_db()` or seed the same usernames — 400+ sequential processes sharing one
  # database produces cross-file interference, not signal. Isolating them properly is a
  # separate piece of work. This job runs the files written FOR PostgreSQL, and the
  # `tests/test_postgres_*.py` glob is the extension point for the next one.
  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned to the major version the deployment targets. A major bump belongs in
        # its own change, next to whatever else it breaks.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        # Without this the steps below can start before the server accepts connections,
        # which fails as a confusing driver error rather than as "not ready yet".
        options: >-
          --health-cmd "pg_isready -U test -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches the Dockerfile base image
          cache: pip
          cache-dependency-path: web_dashboard/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web_dashboard/requirements.txt

      - name: Run PostgreSQL schema tests
        env:
          # psycopg2-binary is already in requirements.txt, so the default driver works.
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          JWT_SECRET_KEY: ci-postgres-schema-tests
        run: |
          shopt -s nullglob
          files=(tests/test_postgres_*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no tests/test_postgres_*.py files found — this job would"\
                 "pass without testing anything"
            exit 1
          fi
          fail=0
          for f in "${files[@]}"; do
            echo "::group::$f"
            python "$f" || fail=1
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more PostgreSQL test files failed"
          fi
          exit $fail

  # ── Open Policy Agent ───────────────────────────────────────────────────────
  #
  # The image bundles an `opa` binary that `services/_opa.py` shells for the admission
  # guardrails; CI did not have one, so nothing had ever executed the shipped Rego. The
  # admission tests all stub `_opa` — correct for testing the decision logic, which
  # needs no subprocess, but it means the `.rego` files under terraform/policy/admission
  # reached production unexecuted.
  #
  # That is a bad gap specifically because `admission_service.enforce` is FAIL-CLOSED:
  # any OPA error denies. A syntax error, a package renamed out of step with its
  # filename, or a field Python stopped sending does not degrade into a permissive
  # rule — it 403s every gated action, and the first report comes from an operator
  # whose estate has stopped deploying. No amount of Python-side unit testing can see
  # it, because the failure lives between two languages and a subprocess.
  #
  # Its own job rather than a step in `tests` so the version pin, the install, and the
  # "did it actually run" guard stay in one readable place, and so a download blip
  # fails this job rather than the whole suite.
  opa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches the Dockerfile base image
          cache: pip
          cache-dependency-path: web_dashboard/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web_dashboard/requirements.txt

      # Read the version out of the Dockerfile rather than repeating it. A second copy
      # of the pin would drift, and the drift would be the quiet kind: CI proving the
      # policies work under a version the image does not ship.
      - name: Install OPA (version pinned by the Dockerfile)
        run: |
          OPA_VERSION=$(sed -n 's/^ARG OPA_VERSION=//p' Dockerfile)
          if [ -z "$OPA_VERSION" ]; then
            echo "::error::could not read ARG OPA_VERSION from the Dockerfile — the"\
                 "line moved or changed shape. Fix this rather than hardcoding a"\
                 "version here; a second pin is how CI and the image drift apart."
            exit 1
          fi
          echo "Installing OPA $OPA_VERSION (from Dockerfile)"
          # --retry-all-errors for the same reason the Dockerfile uses it: this
          # endpoint drops connections mid-transfer, which curl will not otherwise
          # retry. See the Dockerfile's OPA block.
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static" \
            -o /usr/local/bin/opa
          chmod +x /usr/local/bin/opa
          opa version   # proof the binary arrived intact, as in the Dockerfile

      - name: Run policy tests against the real engine
        env:
          JWT_SECRET_KEY: ci-opa-policy-tests
          # Turns the file's skip-when-absent into a hard failure. Without it a
          # half-failed install would make the tests skip and this job pass green,
          # reopening exactly the blind spot it exists to close.
          OPA_REQUIRED: "1"
        run: |
          shopt -s nullglob
          files=(tests/test_opa_*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no tests/test_opa_*.py files found — this job would"\
                 "pass without testing anything"
            exit 1
          fi
          fail=0
          for f in "${files[@]}"; do
            echo "::group::$f"
            python "$f" || fail=1
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more OPA policy test files failed"
          fi
          exit $fail
