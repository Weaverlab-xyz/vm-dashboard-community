name: Release notes

# Creates the GitHub Release for a pushed version tag, with notes generated from the pull
# requests merged since the previous tag, grouped by .github/release.yml.
#
# A SEPARATE workflow from publish-images.yml on purpose. Creating a release needs
# `contents: write`, and that workflow holds `contents: read` plus the OIDC token that
# keyless-signs the images; widening it for a notes step would hand write access to the job
# that builds and signs. Separately, a failure here cannot fail or delay an image publish.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)create the release for"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Idempotent: a re-run, or a release made by hand, is left alone.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --generate-notes
