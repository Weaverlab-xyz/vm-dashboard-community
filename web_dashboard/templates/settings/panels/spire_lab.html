{# Settings slide-over panel "spire_lab". Included by settings.html inside settingsPage(); the state it binds (panelCfg, panelOpen, …) lives in that page's script. #}
      <template x-if="panel?.key === 'spire_lab' && !panelLoading">
        <div class="space-y-4">
          <p class="text-sm text-gray-500">
            A SPIRE <strong>trust domain</strong> on a VM this dashboard already deployed, so
            the Password Safe <strong>SPIFFE SVID</strong> plugin has something to govern.
            Nothing here is a secret: the administrative credential is minted
            <em>on the VM</em> and written straight into Secrets Safe under
            <code>no_log</code> &mdash; it never passes through the dashboard, the run form or
            your shell history. Enable/disable the feature with the Preview toggle.
            <a href="/docs/preview/workload-lab/spiffe" target="_blank"
               class="text-blue-600 hover:text-blue-800 underline">Feature guide</a>.
          </p>

          <div>
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Reachability</p>
            <label class="block text-sm font-medium text-gray-700 mb-1">Allowed source CIDRs</label>
            <input type="text" x-model="panelCfg.spire_lab_source_cidrs"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                   placeholder="104.28.182.70/32, 104.28.182.71/32">
            <p class="text-[11px] text-gray-400 mt-1">
              Who may reach <code>tcp/8081</code>, the SPIRE server API. Blank makes
              <strong>no cloud ACL change at all</strong> &mdash; not &ldquo;open to the
              world&rdquo;: 8081 mints identities, so an unstated source set can only mean
              &ldquo;nobody new&rdquo;. A lab whose Resource Broker is already in-subnet needs
              nothing here.
            </p>
            <p class="text-[11px] text-gray-400 mt-1">
              <strong>Pin every address you actually egress from.</strong> Corporate egress
              commonly rotates between two, and a rule holding one of them fails on about half
              the connections &mdash; which presents as an intermittent <em>credential</em>
              fault, not a network one.
            </p>
          </div>

          <div>
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Server</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">SPIRE version</label>
                <input type="text" x-model="panelCfg.spire_lab_version"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="1.15.5">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">CA TTL</label>
                <input type="text" x-model="panelCfg.spire_lab_ca_ttl"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="168h">
                <p class="text-[11px] text-gray-400 mt-1">
                  Caps <em>every</em> SVID the server issues, the administrative credential
                  included. A 720h mint against 168h yields ~7 days and SPIRE says so rather
                  than failing. Raise it for a lab that has to outlive a week.
                </p>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Admin SVID TTL</label>
                <input type="text" x-model="panelCfg.spire_lab_admin_ttl"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="720h">
                <p class="text-[11px] text-gray-400 mt-1">
                  What the mint <em>asks</em> for. CA TTL above decides what it gets.
                </p>
              </div>
            </div>
          </div>

          <div>
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Where the credential lands</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Secrets Safe safe</label>
                <input type="text" x-model="panelCfg.spire_lab_ps_safe"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="Automation">
                <p class="text-[11px] text-gray-400 mt-1">
                  Must already exist, with create rights &mdash; the playbook creates no safe.
                </p>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Folder root</label>
                <input type="text" x-model="panelCfg.spire_lab_secret_root"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="spire">
                <p class="text-[11px] text-gray-400 mt-1">
                  Four titles land under <code>&lt;root&gt;/&lt;lab&gt;</code>: the PKCS#12, its
                  passphrase, and &mdash; public, so the page can read them back as values
                  instead of parsing a log &mdash; the trust bundle and the granted expiry.
                </p>
              </div>
              <div class="col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Playbook storage backend</label>
                <input type="text" x-model="panelCfg.spire_lab_asset_backend"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="(blank uses the active backend)">
                <p class="text-[11px] text-gray-400 mt-1">
                  A run fetches assets <em>by filename from storage</em>, never from the repo, so
                  the <code>spire-*.yml</code> playbooks (and, per mode,
                  <code>install-docker.yml</code> or <code>k3s-server-init.yml</code>) have to be
                  uploaded on the <strong>Storage</strong> page first &mdash; Config Management only <em>runs</em>
                  them. The build form tells you which are missing.
                </p>
              </div>
            </div>
          </div>

          <div>
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Kubernetes mode</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">SPIRE chart version</label>
                <input type="text" x-model="panelCfg.spire_lab_helm_chart_version"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="0.30.2 (pinned)">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">SPIRE CRDs chart version</label>
                <input type="text" x-model="panelCfg.spire_lab_helm_crds_chart_version"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="0.6.1 (pinned)">
              </div>
              <p class="col-span-2 text-[11px] text-gray-400 -mt-1">
                Blank uses the pins, never &ldquo;latest&rdquo;. The chart runs the SPIRE version
                above, by digest, as the VM and Docker modes do &mdash; move the chart and the
                SPIRE version together, because the value keys the playbook sets are exactly
                what a chart release renames.
              </p>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">k3s version</label>
                <input type="text" x-model="panelCfg.spire_lab_k3s_version"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="(blank: get.k3s.io's current)">
                <p class="text-[11px] text-gray-400 mt-1">
                  At least 1.34: structured authentication is GA there, and the playbook
                  refuses anything older.
                </p>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Helm tarball SHA-256</label>
                <input type="text" x-model="panelCfg.spire_lab_helm_sha256"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="(blank: TLS only, with a warning)">
                <p class="text-[11px] text-gray-400 mt-1">
                  From <code>get.helm.sh/helm-v&lt;ver&gt;-linux-&lt;arch&gt;.tar.gz.sha256sum</code>.
                  Helm publishes checksums only there, so none is shipped.
                </p>
              </div>
              <div class="col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Extra chart values (YAML)</label>
                <textarea x-model="panelCfg.spire_lab_helm_values_extra" rows="4"
                          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                          placeholder="spire-server:&#10;  logLevel: debug"></textarea>
                <p class="text-[11px] text-gray-400 mt-1">
                  Merged <em>over</em> the playbook's values, so it can undo them &mdash;
                  including the upstream hardening the lab turns on.
                </p>
              </div>
            </div>
          </div>

          <div>
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Supply chain</p>
            <label class="flex items-start gap-2 text-sm text-gray-700">
              <input type="checkbox" x-model="panelCfg.spire_lab_allow_unpinned" class="mt-1">
              <span>
                <strong>Allow unpinned downloads</strong>
                <span class="block text-[11px] text-gray-400 mt-0.5">
                  Every SPIRE tarball, image and the Kubernetes exec plugin is pinned by SHA-256
                  or digest for the versions the playbooks know, and any other version is
                  <strong>refused</strong>. Ticking this takes an unpinned version on TLS alone.
                  Prefer adding the new version's checksums to the playbooks; leave this off.
                </span>
              </span>
            </label>
          </div>
        </div>
      </template>
