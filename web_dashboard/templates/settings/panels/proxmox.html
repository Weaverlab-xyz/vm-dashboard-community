{# Settings slide-over panel "proxmox". Included by settings.html inside settingsPage(); the state it binds (panelCfg, panelOpen, …) lives in that page's script. #}
      <template x-if="panel?.key === 'proxmox' && !panelLoading">
        <div class="space-y-4">
        <div class="mb-4 text-sm text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
          <span class="font-medium">These fields are the initial values only.</span>
          Hypervisor credentials now live on the <a href="/connections" class="underline font-medium">Connections</a>
          tab of the Remote Agents page, which supports more than one of each kind. The values here were copied
          across on first start; editing them afterwards has no effect on what the
          dashboard connects to. They are kept so rolling back to an older build still
          works.
        </div>

          <p class="text-sm text-gray-500">
            Connects to a Proxmox VE node or cluster via the REST API. Supports
            API token auth (recommended) or username/password.
          </p>

          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide pt-1">Connection</p>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-1">Proxmox Host</label>
              <input type="text" x-model="panelCfg.proxmox_host"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="proxmox.local or 192.168.1.100">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Port</label>
              <input type="text" x-model="panelCfg.proxmox_port"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="8006">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" x-model="panelCfg.proxmox_user"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="root@pam">
          </div>
          <div class="flex items-center gap-2 pt-1">
            <button @click="panelCfg.proxmox_verify_ssl = !panelCfg.proxmox_verify_ssl"
                    class="relative inline-flex h-6 w-11 flex-shrink-0 items-center rounded-full transition-colors"
                    :class="panelCfg.proxmox_verify_ssl ? 'bg-blue-600' : 'bg-gray-300'">
              <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                    :class="panelCfg.proxmox_verify_ssl ? 'translate-x-6' : 'translate-x-1'"></span>
            </button>
            <span class="text-sm text-gray-700">Verify SSL certificate <span class="text-gray-400">(disable for self-signed)</span></span>
          </div>

          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide pt-1">API Token Auth <span class="text-gray-300 font-normal normal-case">(recommended)</span></p>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Token ID <span class="text-gray-400 font-normal">e.g. mytoken</span></label>
            <input type="text" x-model="panelCfg.proxmox_token_id"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="dashboard">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Token Secret</label>
            <input type="password" x-model="panelCfg.proxmox_token_secret"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="••••••••">
          </div>

          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide pt-1">Password Auth <span class="text-gray-300 font-normal normal-case">(fallback)</span></p>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" x-model="panelCfg.proxmox_password"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="••••••••">
          </div>
        </div>
      </template>
