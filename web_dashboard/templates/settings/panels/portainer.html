{# Settings slide-over panel "portainer". Included by settings.html inside settingsPage(); the state it binds (panelCfg, panelOpen, …) lives in that page's script. #}
      <template x-if="panel?.key === 'portainer' && !panelLoading">
        <div class="space-y-4">
          <p class="text-sm text-gray-500">
            Containers are shown for every configured cloud provider (AWS ECS, Azure ACI,
            GCP Cloud Run) automatically. To also manage on-prem Docker hosts, either
            <strong>deploy a managed Portainer CE server</strong> from
            <a href="/containers#portainer" class="underline font-medium">Containers → Portainer</a>
            (which fills in the URL and token below for you), or connect one you already run.
          </p>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Portainer URL</label>
            <input type="text" x-model="panelCfg.portainer_url"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="http://portainer.local:9000">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">API Token (PAT)</label>
            <input type="password" x-model="panelCfg.portainer_pat"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="••••••••">
            <p class="text-xs text-gray-400 mt-1">
              Personal Access Token from Portainer (My account → Access tokens), or a vault
              reference like <code class="bg-gray-100 px-1 rounded">bt_safe://Portainer_PAT</code>,
              <code class="bg-gray-100 px-1 rounded">aws_sm://…</code>,
              <code class="bg-gray-100 px-1 rounded">azure_kv://…</code>,
              <code class="bg-gray-100 px-1 rounded">gcp_sm://…</code>. Stored encrypted.
            </p>
          </div>
          <div class="flex items-center gap-3">
            <button @click="panelCfg.portainer_verify_ssl = !panelCfg.portainer_verify_ssl"
                    class="relative inline-flex h-6 w-11 flex-shrink-0 items-center rounded-full transition-colors"
                    :class="panelCfg.portainer_verify_ssl ? 'bg-blue-600' : 'bg-gray-300'">
              <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                    :class="panelCfg.portainer_verify_ssl ? 'translate-x-6' : 'translate-x-1'"></span>
            </button>
            <span class="text-sm text-gray-700">Verify SSL certificate</span>
          </div>
          <p class="text-xs text-gray-400 -mt-2">
            A dashboard-deployed node serves a self-signed certificate, so deploying one
            turns this off automatically.
          </p>

          <!-- ── Managed node (deploy knobs) ── -->
          <div class="pt-4 border-t border-gray-200">
            <h4 class="text-sm font-semibold text-gray-800 mb-1">Managed Portainer server</h4>
            <p class="text-xs text-gray-500 mb-3">
              Settings for a Portainer CE container the dashboard runs on a GCE
              Container-Optimized-OS VM. The node is <strong>ephemeral</strong> — a teardown
              wipes its users, environments and settings.
            </p>

            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Allowed source CIDRs</label>
                <input type="text" x-model="panelCfg.portainer_allowed_source_cidrs"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="203.0.113.0/24, 198.51.100.7/32">
                <p class="text-xs text-gray-400 mt-1">
                  Comma-separated. Opens tcp <code class="bg-gray-100 px-1 rounded">9443</code> (UI/API) and
                  <code class="bg-gray-100 px-1 rounded">8000</code> (Edge agent) to these sources only.
                  Empty is <strong>fail-closed</strong> unless "Allow open" below is on — the dashboard's own
                  egress IP is added automatically so a deploy can reach its node.
                </p>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Dashboard egress CIDR</label>
                <input type="text" x-model="panelCfg.portainer_dashboard_egress_cidr"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="auto-detected on deploy">
                <p class="text-xs text-gray-400 mt-1">
                  The dashboard's own public egress range. Auto-detected and saved on each deploy;
                  set it by hand if you egress from a proxy <em>pool</em> (detection won't clobber a
                  broader range that already contains the detected IP).
                </p>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Admin password</label>
                <input type="password" x-model="panelCfg.portainer_admin_password"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="••••••••">
                <p class="text-xs text-gray-400 mt-1">
                  First-run password for the <code class="bg-gray-100 px-1 rounded">admin</code> user.
                  Leave blank to auto-generate one (it is shown once on the Containers page).
                  Stored encrypted.
                </p>
              </div>

              <div class="w-40">
                <label class="block text-sm font-medium text-gray-700 mb-1">Ready timeout (s)</label>
                <input type="number" x-model.number="panelCfg.portainer_ready_timeout_s"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
              </div>

              <!-- Per-cloud node settings. The selector below is a VIEW control, not a
                   setting: which cloud the node actually runs on is chosen on the
                   Containers page at deploy time (and recorded there), so binding it
                   here would create a second source of truth that the next deploy
                   silently overwrites. Each cloud keeps its own image / size / name so
                   switching clouds does not mean re-entering all of them. -->
              <div class="pt-3 border-t border-gray-100 space-y-3"
                   x-data="{ nodeCloud: 'gcp' }">
                <div class="flex items-center gap-3">
                  <label class="text-sm font-medium text-gray-700">Settings for cloud</label>
                  <select x-model="nodeCloud"
                          class="border border-gray-300 rounded-lg px-2 py-1.5 text-sm">
                    <option value="aws">AWS</option>
                    <option value="azure">Azure</option>
                    <option value="gcp">GCP</option>
                  </select>
                  <span class="text-xs text-gray-400">
                    Where the node runs is picked on <a href="/containers#portainer" class="underline">Containers &rarr; Portainer</a> when you deploy.
                  </span>
                </div>

                <!-- GCP -->
                <div x-show="nodeCloud === 'gcp'" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Container image</label>
                    <input type="text" x-model="panelCfg.gcp_portainer_image"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Machine type</label>
                    <input type="text" x-model="panelCfg.gcp_portainer_machine_type"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">VM name</label>
                    <input type="text" x-model="panelCfg.gcp_portainer_name"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Zone</label>
                    <input type="text" x-model="panelCfg.gcp_portainer_zone"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                           placeholder="(auto-picked in the region)">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Boot disk (GB)</label>
                    <input type="number" x-model.number="panelCfg.gcp_portainer_boot_disk_gb"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Network tag</label>
                    <input type="text" x-model="panelCfg.gcp_portainer_network_tag"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
                  </div>
                </div>

                <!-- AWS. No zone field: an EC2 subnet already pins the availability
                     zone, so one here could only contradict it. No network tag either
                     — a dedicated security group replaces GCE's target-tag model. -->
                <div x-show="nodeCloud === 'aws'" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Container image</label>
                    <input type="text" x-model="panelCfg.aws_portainer_image"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Instance type</label>
                    <input type="text" x-model="panelCfg.aws_portainer_instance_type"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Instance name</label>
                    <input type="text" x-model="panelCfg.aws_portainer_name"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Root volume (GB)</label>
                    <input type="number" x-model.number="panelCfg.aws_portainer_boot_disk_gb"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
                  </div>
                </div>

                <!-- Azure. Same omissions as AWS, plus: the Standard public IP is
                     Static, so this node KEEPS its address across a recreate. -->
                <div x-show="nodeCloud === 'azure'" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Container image</label>
                    <input type="text" x-model="panelCfg.azure_portainer_image"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">VM size</label>
                    <input type="text" x-model="panelCfg.azure_portainer_vm_size"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">VM name</label>
                    <input type="text" x-model="panelCfg.azure_portainer_name"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">OS disk (GB)</label>
                    <input type="number" x-model.number="panelCfg.azure_portainer_boot_disk_gb"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
                  </div>
                </div>

                <!-- Fail-open is per cloud, because each one closes differently: GCP
                     deletes its firewall rule, AWS revokes every ingress permission,
                     Azure deletes its NSG rule. Three explicit toggles rather than one
                     dynamically-keyed one: a computed key cannot be checked against the
                     panel model, and an unmodelled key is DISCARDED on save -- which is
                     why tests/test_setup_feature_roundtrip.py refuses bracket-style
                     access outright. -->
                <div x-show="nodeCloud === 'gcp'" class="flex items-center gap-3">
                  <button @click="panelCfg.gcp_portainer_allow_open = !panelCfg.gcp_portainer_allow_open"
                          class="relative inline-flex h-6 w-11 flex-shrink-0 items-center rounded-full transition-colors"
                          :class="panelCfg.gcp_portainer_allow_open ? 'bg-red-600' : 'bg-gray-300'">
                    <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                          :class="panelCfg.gcp_portainer_allow_open ? 'translate-x-6' : 'translate-x-1'"></span>
                  </button>
                  <span class="text-sm text-gray-700">
                    Allow open (<code class="bg-gray-100 px-1 rounded">0.0.0.0/0</code>) when no CIDRs are set
                    <span class="text-gray-400">&mdash; GCP</span>
                  </span>
                </div>
                <div x-show="nodeCloud === 'aws'" class="flex items-center gap-3">
                  <button @click="panelCfg.aws_portainer_allow_open = !panelCfg.aws_portainer_allow_open"
                          class="relative inline-flex h-6 w-11 flex-shrink-0 items-center rounded-full transition-colors"
                          :class="panelCfg.aws_portainer_allow_open ? 'bg-red-600' : 'bg-gray-300'">
                    <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                          :class="panelCfg.aws_portainer_allow_open ? 'translate-x-6' : 'translate-x-1'"></span>
                  </button>
                  <span class="text-sm text-gray-700">
                    Allow open (<code class="bg-gray-100 px-1 rounded">0.0.0.0/0</code>) when no CIDRs are set
                    <span class="text-gray-400">&mdash; AWS</span>
                  </span>
                </div>
                <div x-show="nodeCloud === 'azure'" class="flex items-center gap-3">
                  <button @click="panelCfg.azure_portainer_allow_open = !panelCfg.azure_portainer_allow_open"
                          class="relative inline-flex h-6 w-11 flex-shrink-0 items-center rounded-full transition-colors"
                          :class="panelCfg.azure_portainer_allow_open ? 'bg-red-600' : 'bg-gray-300'">
                    <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                          :class="panelCfg.azure_portainer_allow_open ? 'translate-x-6' : 'translate-x-1'"></span>
                  </button>
                  <span class="text-sm text-gray-700">
                    Allow open (<code class="bg-gray-100 px-1 rounded">0.0.0.0/0</code>) when no CIDRs are set
                    <span class="text-gray-400">&mdash; AZURE</span>
                  </span>
                </div>
              </div>

              <!-- Durable state: /data on a persistent disk that survives a teardown -->
              <div class="pt-3 border-t border-gray-100 space-y-3">
                <div class="flex items-center gap-3">
                  <button @click="panelCfg.portainer_data_disk_enabled = !panelCfg.portainer_data_disk_enabled"
                          class="relative inline-flex h-6 w-11 flex-shrink-0 items-center rounded-full transition-colors"
                          :class="panelCfg.portainer_data_disk_enabled ? 'bg-blue-600' : 'bg-gray-300'">
                    <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                          :class="panelCfg.portainer_data_disk_enabled ? 'translate-x-6' : 'translate-x-1'"></span>
                  </button>
                  <span class="text-sm text-gray-700">
                    Keep Portainer's data on a persistent disk (survives teardown)
                  </span>
                </div>
                <div x-show="panelCfg.portainer_data_disk_enabled" class="pl-14 space-y-2">
                  <div class="flex gap-3">
                    <div class="w-32">
                      <label class="block text-sm font-medium text-gray-700 mb-1">GCP (GB)</label>
                      <input type="number" x-model.number="panelCfg.gcp_portainer_data_disk_gb"
                             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
                    </div>
                    <div class="w-32">
                      <label class="block text-sm font-medium text-gray-700 mb-1">AWS (GB)</label>
                      <input type="number" x-model.number="panelCfg.aws_portainer_data_disk_gb"
                             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
                    </div>
                    <div class="w-32">
                      <label class="block text-sm font-medium text-gray-700 mb-1">Azure (GB)</label>
                      <input type="number" x-model.number="panelCfg.azure_portainer_data_disk_gb"
                             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
                    </div>
                  </div>
                  <p class="text-xs text-gray-500">
                    Users, environments and settings survive a teardown and come back on the
                    next deploy. On GCP and AWS the disk is <strong>zonal</strong>, so it pins
                    the node's zone — moving region needs a snapshot, not a redeploy. It keeps
                    billing on every cloud until you tear the node down with
                    <em>Delete the data disk</em> ticked.
                  </p>
                </div>
              </div>

              <!-- PRA Web Jump (optional broker for the node's UI) -->
              <div class="pt-3 border-t border-gray-100">
                <div class="flex items-center gap-3">
                  <button @click="panelCfg.portainer_ui_web_jump_enabled = !panelCfg.portainer_ui_web_jump_enabled"
                          class="relative inline-flex h-6 w-11 flex-shrink-0 items-center rounded-full transition-colors"
                          :class="panelCfg.portainer_ui_web_jump_enabled ? 'bg-blue-600' : 'bg-gray-300'">
                    <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                          :class="panelCfg.portainer_ui_web_jump_enabled ? 'translate-x-6' : 'translate-x-1'"></span>
                  </button>
                  <span class="text-sm text-gray-700">Broker the UI via a PRA Web Jump</span>
                </div>
                <p class="text-xs text-gray-400 mt-1">
                  Opt-in. Reach the node from the PRA representative console — brokered and recorded —
                  without adding your IP to the CIDR list. The Gateway's egress IP is auto-allowed, and
                  with a Vault account group the admin password is injected instead of shown. Can also be
                  chosen per-deploy on the Containers page.
                </p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Asset Group</label>
                    <input type="text" x-model="panelCfg.portainer_ui_jump_group"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"
                           placeholder="(bt_jump_group_name)">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Gateway</label>
                    <input type="text" x-model="panelCfg.portainer_ui_jumpoint_name"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"
                           placeholder="(bt_jumpoint_name)">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Vault account group id</label>
                    <input type="text" x-model="panelCfg.portainer_ui_vault_account_group_id"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                           placeholder="(bt_vault_account_group_id)">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Gateway cloud</label>
                    <select x-model="panelCfg.portainer_ui_jumpoint_cloud"
                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                      <option value="gcp">gcp</option>
                      <option value="aws">aws</option>
                      <option value="azure">azure</option>
                    </select>
                  </div>
                </div>
                <div class="mt-3 flex items-center gap-2">
                  <input type="checkbox" id="portainer_ui_verify_certificate" x-model="panelCfg.portainer_ui_verify_certificate"
                         class="rounded border-gray-300">
                  <label for="portainer_ui_verify_certificate" class="text-sm text-gray-700">Web Jump verifies the node's certificate <span class="text-gray-400">(separate from Verify SSL above, which covers dashboard → Portainer API calls — leave off for the self-signed cert on :9443)</span></label>
                </div>
              </div>

              <!-- Live firewall breakdown, and the one action that changes it -->
              <template x-if="portainerFirewall">
                <div class="bg-gray-50 border border-gray-200 rounded-lg p-3 text-xs">
                  <div class="flex items-center justify-between mb-2">
                    <p class="font-semibold text-gray-700">
                      Effective firewall sources
                      <span x-show="!portainerFirewall.opened" class="ml-1 text-red-600">(closed — node unreachable)</span>
                    </p>
                    <!-- The deploy applies this set ONCE and never revisits it, so the
                         rule ages out from under a node that is running perfectly well
                         when the dashboard's outbound address moves, a gateway is
                         rebuilt, or someone deletes the rule in the cloud console. This
                         readout is where that gets diagnosed, so the repair belongs
                         beside it. Same route as the Containers page button. -->
                    <button type="button" @click="reapplyPortainerFirewall()" :disabled="portainerFirewallBusy"
                            title="Re-detect the dashboard's egress address and re-apply the node's ingress rule"
                            class="text-xs px-2 py-1 rounded border border-gray-300 bg-white hover:bg-gray-50 font-medium disabled:opacity-50">
                      <span x-text="portainerFirewallBusy ? 'Re-applying…' : 'Re-apply'"></span>
                    </button>
                  </div>
                  <div class="space-y-1 text-gray-600">
                    <p>
                      <span class="text-gray-500">Dashboard egress:</span>
                      <code class="bg-white px-1 rounded" x-text="portainerFirewall.dashboard_egress_ip || '(not detected)'"></code>
                    </p>
                    <!-- The hosting platform's published outbound pool (Azure Container
                         Apps with no NAT gateway: ~400 addresses). COUNTED, never listed,
                         and the merged chips below leave it out for the same reason. The
                         error is nearly always a missing Reader grant and names the fix. -->
                    <p x-show="(portainerFirewall.dashboard_egress_pool || {}).count">
                      <span class="text-gray-500">Hosting platform outbound pool:</span>
                      <span x-text="(portainerFirewall.dashboard_egress_pool || {}).count + ' addresses, read from the platform'"></span>
                    </p>
                    <p x-show="(portainerFirewall.dashboard_egress_pool || {}).error" class="text-amber-700">
                      <span class="text-gray-500">Outbound pool:</span>
                      <span x-text="(portainerFirewall.dashboard_egress_pool || {}).error"></span>
                    </p>
                    <p x-show="(portainerFirewall.gateway_cidrs || []).length">
                      <span class="text-gray-500">Web-Jump Gateways:</span>
                      <template x-for="c in portainerFirewall.gateway_cidrs || []" :key="c">
                        <code class="bg-white px-1 rounded mr-1" x-text="c"></code>
                      </template>
                    </p>
                    <!-- The portainer_access Entitle adapter's own subnet. Named, so the
                         range does not read as an unexplained entry in the merged list. -->
                    <p x-show="(portainerFirewall.adapter_cidrs || []).length">
                      <span class="text-gray-500">Entitle adapter:</span>
                      <template x-for="c in portainerFirewall.adapter_cidrs || []" :key="c">
                        <code class="bg-white px-1 rounded mr-1" x-text="c"></code>
                      </template>
                    </p>
                    <p>
                      <span class="text-gray-500">Merged allow-list:</span>
                      <span x-show="!(portainerFirewall.merged || []).length" class="text-red-600">none</span>
                      <template x-for="c in (portainerFirewall.merged || []).filter(c => !((portainerFirewall.dashboard_egress_pool || {}).cidrs || []).includes(c))" :key="c">
                        <code class="bg-white px-1 rounded mr-1" x-text="c"></code>
                      </template>
                      <span x-show="(portainerFirewall.dashboard_egress_pool || {}).count"
                            x-text="'+ the ' + (portainerFirewall.dashboard_egress_pool || {}).count + '-address outbound pool'"></span>
                    </p>
                    <p>
                      <span class="text-gray-500">Ports:</span>
                      <template x-for="p in portainerFirewall.ports || []" :key="p">
                        <code class="bg-white px-1 rounded mr-1" x-text="p"></code>
                      </template>
                    </p>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>
