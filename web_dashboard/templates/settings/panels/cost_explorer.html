{# Settings slide-over panel "cost_explorer". Included by settings.html inside settingsPage(); the state it binds (panelCfg, panelOpen, …) lives in that page's script. #}
      <template x-if="panel?.key === 'cost_explorer' && !panelLoading">
        <div class="space-y-4">
          <p class="text-sm text-gray-500">
            Month-to-date cloud spend (AWS Cost Explorer + Azure Cost Management) shown on the
            dashboard tile and the <code>/costs</code> page. Set a monthly budget to get an alert
            when spend exceeds it — or is on pace to by month-end.
          </p>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Monthly budget</label>
            <input type="number" min="0" step="0.01" x-model.number="panelCfg.cost_monthly_budget"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                   placeholder="0 = no budget alert">
            <p class="text-[11px] text-gray-400 mt-1">
              In your account currency. The dashboard's “Needs attention” panel flags
              <strong>over</strong> (spend ≥ budget) and <strong>approaching</strong> (projected to
              exceed by month-end). Needs <code>ce:GetCostAndUsage</code> (AWS) /
              Cost Management reader (Azure).
            </p>
          </div>
          <div class="border-t border-gray-100 pt-4">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Per-cloud budgets <span class="normal-case text-gray-400">(optional)</span></p>
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">AWS</label>
                <input type="number" min="0" step="0.01" x-model.number="panelCfg.cost_budget_aws"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono" placeholder="0">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Azure</label>
                <input type="number" min="0" step="0.01" x-model.number="panelCfg.cost_budget_azure"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono" placeholder="0">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">GCP</label>
                <input type="number" min="0" step="0.01" x-model.number="panelCfg.cost_budget_gcp"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono" placeholder="0">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">OCI</label>
                <input type="number" min="0" step="0.01" x-model.number="panelCfg.cost_budget_oci"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono" placeholder="0">
              </div>
            </div>
            <p class="text-[11px] text-gray-400 mt-1">Each cloud's MTD spend is flagged against its own budget, in addition to the overall budget above. 0 = no per-cloud alert.</p>
          </div>
          <div class="border-t border-gray-100 pt-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">GCP BigQuery billing-export table</label>
            <input type="text" x-model="panelCfg.gcp_billing_export_table"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                   placeholder="project.dataset.gcp_billing_export_v1_XXXXXX">
            <p class="text-[11px] text-gray-400 mt-1">
              GCP has no cost API — enable <strong>Cloud Billing export to BigQuery</strong>, then paste
              the export table here. Grant the dashboard service account <strong>BigQuery Data Viewer</strong>
              + <strong>Job User</strong> on that dataset. Blank → GCP cost stays unavailable. (Export data
              can lag ~24h; queries scan billed data, so results are cached for hours.)
            </p>
          </div>
        </div>
      </template>
