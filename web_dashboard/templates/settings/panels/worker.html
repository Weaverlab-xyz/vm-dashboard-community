{# Settings slide-over panel "worker". Included by settings.html inside settingsPage(); the state it binds (panelCfg, panelOpen, …) lives in that page's script. #}
      <template x-if="panel?.key === 'worker' && !panelLoading">
        <div class="space-y-4">
          <p class="text-sm text-gray-500">
            Long jobs — provisions, image builds, exports, deploys — run in a separate
            worker process, not in the web app. These limits say how many run
            <strong>at the same time</strong>, and are read fresh every couple of seconds,
            so a change here applies without restarting anything.
            See <a href="/docs/operations/job-worker" class="text-blue-600 underline">the job worker doc</a>.
          </p>

          <div class="rounded-lg border border-gray-200 bg-gray-50 p-3 text-[11px] text-gray-600">
            The limits are split by what a job actually costs, because they aren't alike. A
            job waiting on a cloud API is nearly free; one streaming a Terraform apply
            writes a line to the database for every line of output. Raising the wrong one
            makes everything slower rather than faster — so start with
            <strong>poll-only</strong>.
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Poll-only jobs</label>
              <input type="number" min="1" x-model.number="panelCfg.worker_light_concurrency"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
              <p class="text-[11px] text-gray-400 mt-1">
                Image exports, promotes and copies, gateways, auto-delete sweeps. They start
                something in the cloud and then just wait — an export can poll for two hours.
                Cheap; raise this first. Max 12.
              </p>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Heavy jobs</label>
              <input type="number" min="1" x-model.number="panelCfg.worker_heavy_concurrency"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
              <p class="text-[11px] text-gray-400 mt-1">
                Cluster and database provisions, Packer builds. Each streams its output to
                the database line by line, so two is usually enough to saturate a small
                Postgres. Max 4.
              </p>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Mixed jobs</label>
              <input type="number" min="1" x-model.number="panelCfg.worker_medium_concurrency"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
              <p class="text-[11px] text-gray-400 mt-1">
                VM deploys, tunnels, Kubernetes add-ons. Mostly cloud API calls plus a short
                <span class="font-mono">terraform</span> or <span class="font-mono">helm</span>.
                Max 4.
              </p>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Total at once</label>
            <input type="number" min="1" x-model.number="panelCfg.worker_max_concurrency"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
            <p class="text-[11px] text-gray-400 mt-1">
              The overall ceiling, and the one that actually binds — the three limits above
              are allowed to add up to more than this, because they cap the <em>mix</em>
              while this caps the <em>total</em>. Lower this to shrink the worker's
              footprint. Max 16, but see the note below: it is also capped by how many
              database connections the worker has.
            </p>
          </div>

          <div class="rounded-lg border border-amber-200 bg-amber-50 p-3 text-[11px] text-amber-800">
            <strong>The database connection pool is the real limit.</strong> Every running
            job holds connections, so the worker reduces the total above to what its pool
            can serve and reports it below. That pool is sized by the
            <span class="font-mono">DB_POOL_SIZE</span> and
            <span class="font-mono">DB_MAX_OVERFLOW</span> environment variables, not here —
            it is built before the app can read any setting out of the database. If the
            readout below says your total was reduced, raise those and redeploy the worker.
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Shutdown grace</label>
              <input type="number" min="0" x-model.number="panelCfg.worker_drain_timeout_s"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
              <p class="text-[11px] text-gray-400 mt-1">
                Seconds to let running jobs finish when the worker is asked to stop (a
                redeploy). Keep it under your platform's termination grace period — 30s by
                default on Azure Container Apps — or the process is killed before it
                finishes waiting. Jobs longer than this are failed promptly by the next
                worker instead of looking alive for ten minutes. 0 = don't wait.
              </p>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Worker threads</label>
              <input type="number" min="0" x-model.number="panelCfg.worker_executor_threads"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
              <p class="text-[11px] text-gray-400 mt-1">
                <code>0</code> derives it from the limits above, which is almost always
                right. Set it only if the log shows jobs stuck at 0% — that means cloud
                calls are queueing for a thread. Applied at worker start, so this one needs
                a restart. Max 128.
              </p>
            </div>
          </div>

          <div class="rounded-lg border border-gray-200 bg-gray-50 p-3">
            <div class="flex items-center justify-between mb-2">
              <span class="text-sm font-medium text-gray-700">What the worker is using</span>
              <button type="button" @click="loadWorkerStatus()" :disabled="workerStatusLoading"
                      class="text-xs px-2 py-1 rounded border border-gray-300 bg-white hover:bg-gray-50 font-medium disabled:opacity-50">
                <span x-text="workerStatusLoading ? 'Checking…' : 'Refresh'"></span>
              </button>
            </div>
            <p class="text-[11px] text-gray-500 font-mono whitespace-pre-wrap"
               x-text="workerStatusSummary()"></p>
          </div>

          <p class="text-[11px] text-gray-400">
            Running more than one worker multiplies these limits — two workers with a total
            of 3 each run up to 6 jobs. Jobs are claimed atomically, so no job ever runs
            twice however many workers there are. Note that each worker needs its own
            database connections, which is why raising the limits inside one worker is
            usually cheaper than adding another.
          </p>
        </div>
      </template>
