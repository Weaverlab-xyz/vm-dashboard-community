{# Settings slide-over panel "skytap". Included by settings.html inside settingsPage(); the state it binds (panelCfg, panelOpen, …) lives in that page's script. #}
      <template x-if="panel?.key === 'skytap' && !panelLoading">
        <div class="space-y-4">
          <p class="text-sm text-gray-500">
            Skytap hosts the multi-VM, multi-OS templates a customer POV runs on. The
            dashboard creates an environment from a template, then wires its VMs into that
            POV's PRA and Password Safe tenant.
          </p>

          <div class="text-sm text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
            <span class="font-medium">This is a POV-instance integration.</span>
            On a demo instance it stays unavailable whatever this toggle says — the two
            profiles are deliberately exclusive. See
            <a href="/docs/profiles#the-gate" class="underline font-medium">POV Instance</a>.
          </div>

          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide pt-1">Connection</p>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">API URL</label>
            <input type="text" x-model="panelCfg.skytap_base_url"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="https://cloud.skytap.com">
            <p class="text-xs text-gray-400 mt-1">Leave as the default unless your account is on another region's endpoint.</p>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
              <input type="text" x-model="panelCfg.skytap_username"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="you@example.com">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">API security token</label>
              <input type="password" x-model="panelCfg.skytap_api_token" autocomplete="new-password"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                     :placeholder="(panelCfg._secrets_set || []).includes('skytap_api_token')
                                   ? '•••••••• stored — leave blank to keep'
                                   : 'Paste the API security token'">
              <p class="text-xs text-gray-400 mt-1">
                From your Skytap <span class="font-medium">account page</span> — not your account password.
              </p>
            </div>
          </div>

          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide pt-1">Optional</p>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Project ID</label>
            <input type="text" x-model="panelCfg.skytap_project_id"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="e.g. 123456">
            <p class="text-xs text-gray-400 mt-1">
              Templates and environments are listed from this project, and new environments
              are created inside it. <strong>Blank lists everything the token can see</strong> —
              which is also the fix if the lists come back empty.
            </p>
          </div>

          <div class="mt-3 flex items-center gap-2">
            <button type="button" @click="testSkytapConnection()" :disabled="skytapTest.running"
                    class="text-xs px-2 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50">
              <span x-text="skytapTest.running ? 'Testing…' : 'Test connection'"></span>
            </button>
            <span x-show="skytapTest.ok === true" x-cloak
                  class="text-xs text-green-700" x-text="skytapTest.message"></span>
          </div>
          <p x-show="skytapTest.ok === false" x-cloak
             class="text-xs text-red-600 mt-2" x-text="skytapTest.error"></p>
          <p class="text-[11px] text-gray-400 mt-1">
            Reads one page of <code>GET /v2/templates</code> — the same read the POV page
            makes — so it proves the token <strong>and</strong> what this account can
            actually see, scoped to the Project ID above when one is set. An account that
            authenticates but exposes no templates is reported as a failure, because there
            would be nothing to build a POV from. Tests the <strong>saved</strong> values,
            so save first.
          </p>
        </div>
      </template>
