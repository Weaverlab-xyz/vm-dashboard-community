{# Settings slide-over panel "epml". Included by settings.html inside settingsPage(); the state it binds (panelCfg, panelOpen, …) lives in that page's script. #}
      <template x-if="panel?.key === 'epml' && !panelLoading">
        <div class="space-y-4">
          <p class="text-sm text-gray-500">
            Site ID + Personal Access Token for the BeyondTrust Endpoint Privilege Management
            for Linux API, on the Pathfinder gateway at
            <code class="bg-gray-100 px-1 rounded">api.beyondtrust.io</code>. Used to build and
            download EPM-L client packages, sync them to asset storage, and mint activation tokens.
          </p>
          <p class="text-sm text-gray-500">
            Find your Site ID by opening
            <code class="bg-gray-100 px-1 rounded">app.beyondtrust.io/api/platform/currentSite</code>
            while signed in and copying the <code class="bg-gray-100 px-1 rounded">site_id</code>
            field. The PAT must be created while that site is the active one — PATs are bound to
            the site, not the user.
          </p>
          <div class="space-y-3">
            <div class="space-y-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">EPM-L Site ID</label>
                <input type="text" x-model="panelCfg.epml_site_id"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
              </div>
              <div x-show="panelCfg.epml_auth_mode !== 'workload'">
                <label class="block text-sm font-medium text-gray-700 mb-1">EPM-L Personal Access Token</label>
                <input type="password" x-model="panelCfg.epml_pat"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="••••••••">
              </div>
            </div>
          </div>
          <div class="border-t border-gray-100 pt-4">
            <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Authentication</p>
            <div class="space-y-3">
              <div>
                <select x-model="panelCfg.epml_auth_mode"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                  <option value="pat">Personal Access Token (a stored secret)</option>
                  <option value="workload">Workload identity — recommended (BeyondTrust platform identity)</option>
                </select>
                <p class="text-[11px] text-gray-400 mt-1">
                  <strong>Workload identity</strong> presents this dashboard's own identity token instead of
                  a stored credential — set it up once on the
                  <button type="button" class="text-blue-600 hover:underline"
                          @click="openPanel(integrations.find(i => i.key === 'bt_platform_identity'))">BeyondTrust
                    platform identity</button> panel, and add this product to its registration's
                  <strong>Product Scopes</strong> in Pathfinder. Not yet verified live for this product.
                </p>
              </div>
              <div x-show="panelCfg.epml_auth_mode === 'workload'" x-cloak class="space-y-3">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">
                    Service name <span class="text-gray-400 font-normal">(optional override)</span>
                  </label>
                  <input type="text" x-model="panelCfg.epml_workload_service_name"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="(blank = the platform identity's service name)">
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>
