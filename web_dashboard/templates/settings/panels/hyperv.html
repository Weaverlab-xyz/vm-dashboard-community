{# Settings slide-over panel "hyperv". Included by settings.html inside settingsPage(); the state it binds (panelCfg, panelOpen, …) lives in that page's script. #}
      <template x-if="panel?.key === 'hyperv' && !panelLoading">
        <div class="space-y-4">
        <div class="mb-4 text-sm text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
          <span class="font-medium">These fields are the initial values only.</span>
          Hypervisor credentials now live on the <a href="/connections" class="underline font-medium">Connections</a>
          tab of the Remote Agents page, which supports more than one of each kind. The values here were copied
          across on first start; editing them afterwards has no effect on what the
          dashboard connects to. They are kept so rolling back to an older build still
          works.
        </div>

          <p class="text-sm text-gray-500">
            Connects to a Windows host running Hyper-V via <strong>WinRM</strong> (Windows Remote
            Management). Runs PowerShell Hyper-V cmdlets remotely — no agent required on the host.
            Works with Windows Server 2016–2025 and Windows 10/11 Pro / Enterprise with Hyper-V enabled.
          </p>

          <!-- Connection -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-1">Hyper-V Host</label>
              <input type="text" x-model="panelCfg.hyperv_host"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="hyperv.corp.local or 192.168.1.20">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Port
                <span class="text-gray-400 font-normal text-xs">(5985 HTTP / 5986 HTTPS)</span>
              </label>
              <input type="text" x-model="panelCfg.hyperv_port"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="5985">
            </div>
          </div>

          <!-- Credentials -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Username
                <span class="text-gray-400 font-normal text-xs">e.g. DOMAIN\user or user@domain</span>
              </label>
              <input type="text" x-model="panelCfg.hyperv_username"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="CORP\svc-dashboard">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
              <input type="password" x-model="panelCfg.hyperv_password"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="••••••••">
            </div>
          </div>

          <!-- Transport -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Auth Transport
              <span class="text-gray-400 font-normal text-xs">(NTLM works for domain and local accounts)</span>
            </label>
            <select x-model="panelCfg.hyperv_transport"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="ntlm">NTLM (recommended)</option>
              <option value="basic">Basic (requires HTTPS)</option>
              <option value="kerberos">Kerberos (domain-joined container)</option>
            </select>
          </div>

          <!-- SSL options -->
          <div class="flex flex-col gap-3 pt-1">
            <div class="flex items-center gap-2">
              <button @click="panelCfg.hyperv_use_ssl = !panelCfg.hyperv_use_ssl"
                      class="relative inline-flex h-6 w-11 flex-shrink-0 items-center rounded-full transition-colors"
                      :class="panelCfg.hyperv_use_ssl ? 'bg-blue-600' : 'bg-gray-300'">
                <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                      :class="panelCfg.hyperv_use_ssl ? 'translate-x-6' : 'translate-x-1'"></span>
              </button>
              <span class="text-sm text-gray-700">Use HTTPS <span class="text-gray-400">(WinRM port 5986 — requires a certificate on the host)</span></span>
            </div>
            <div class="flex items-center gap-2" x-show="panelCfg.hyperv_use_ssl">
              <button @click="panelCfg.hyperv_verify_ssl = !panelCfg.hyperv_verify_ssl"
                      class="relative inline-flex h-6 w-11 flex-shrink-0 items-center rounded-full transition-colors"
                      :class="panelCfg.hyperv_verify_ssl ? 'bg-blue-600' : 'bg-gray-300'">
                <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                      :class="panelCfg.hyperv_verify_ssl ? 'translate-x-6' : 'translate-x-1'"></span>
              </button>
              <span class="text-sm text-gray-700">Verify SSL certificate <span class="text-gray-400">(disable for self-signed)</span></span>
            </div>
          </div>

          <p class="text-xs text-gray-400 pt-1">
            WinRM must be enabled on the host:
            <code class="bg-gray-100 px-1 rounded">Enable-PSRemoting -Force</code>
            See <a href="/docs/hypervisors/hyperv" class="underline" target="_blank">integration guide</a> for full setup.
          </p>
        </div>
      </template>
