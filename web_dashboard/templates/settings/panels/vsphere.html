{# Settings slide-over panel "vsphere". Included by settings.html inside settingsPage(); the state it binds (panelCfg, panelOpen, …) lives in that page's script. #}
      <template x-if="panel?.key === 'vsphere' && !panelLoading">
        <div class="space-y-4">
        <div class="mb-4 text-sm text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
          <span class="font-medium">These fields are the initial values only.</span>
          Hypervisor credentials now live on the <a href="/connections" class="underline font-medium">Connections</a>
          tab of the Remote Agents page, which supports more than one of each kind. The values here were copied
          across on first start; editing them afterwards has no effect on what the
          dashboard connects to. They are kept so rolling back to an older build still
          works.
        </div>

          <p class="text-sm text-gray-500">
            Connects to a vCenter Server or standalone ESXi host via the vSphere Web Services API.
            Works with vCenter 6.7+ and ESXi 6.7+. Requires <code class="bg-gray-100 px-1 rounded">pyVmomi</code> (installed by default).
          </p>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-1">vCenter / ESXi Host</label>
              <input type="text" x-model="panelCfg.vsphere_host"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="vcenter.corp.local or 192.168.1.10">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Port</label>
              <input type="text" x-model="panelCfg.vsphere_port"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="443">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" x-model="panelCfg.vsphere_user"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="administrator@vsphere.local">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" x-model="panelCfg.vsphere_password"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="••••••••">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Default Datacenter <span class="text-gray-400 font-normal">(optional — leave blank to show all)</span></label>
            <input type="text" x-model="panelCfg.vsphere_datacenter"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="ha-datacenter">
          </div>
          <div class="flex items-center gap-2 pt-1">
            <button @click="panelCfg.vsphere_verify_ssl = !panelCfg.vsphere_verify_ssl"
                    class="relative inline-flex h-6 w-11 flex-shrink-0 items-center rounded-full transition-colors"
                    :class="panelCfg.vsphere_verify_ssl ? 'bg-blue-600' : 'bg-gray-300'">
              <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                    :class="panelCfg.vsphere_verify_ssl ? 'translate-x-6' : 'translate-x-1'"></span>
            </button>
            <span class="text-sm text-gray-700">Verify SSL certificate <span class="text-gray-400">(disable for self-signed / lab)</span></span>
          </div>
          <p class="text-xs text-gray-400 pt-1">
            Standalone ESXi returns <code class="bg-gray-100 px-1 rounded">ha-datacenter</code> as the datacenter name.
            vCenter exposes the full inventory — use the datacenter filter to scope the VM list.
          </p>
        </div>
      </template>
