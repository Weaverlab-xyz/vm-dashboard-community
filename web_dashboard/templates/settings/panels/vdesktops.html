{# Settings slide-over panel "vdesktops". Included by settings.html inside settingsPage(); the state it binds (panelCfg, panelOpen, …) lives in that page's script. #}
      <template x-if="panel?.key === 'vdesktops' && !panelLoading">
        <div class="space-y-4">
          <p class="text-sm text-gray-500">
            Defaults for <strong>desktop pools</strong> on all three clouds. Each pool can
            still override them at create time. Enable/disable the feature with the Preview
            toggle. See <a href="/docs/preview/virtual-desktops" class="text-blue-600 hover:underline">Virtual Desktops</a>.
          </p>
          <p class="text-xs text-gray-500 bg-gray-50 border border-gray-200 rounded-lg p-3">
            <strong>AWS and GCP pools are Linux-only.</strong> EC2 returns Windows credentials
            as password data encrypted to the launch key pair and GCE delivers them through
            <code>windows-keys</code> metadata; neither is wired, so those backends refuse a
            Windows pool rather than ship a seat nobody can sign into. Their Linux seats are
            brokered as PRA Shell Jumps <strong>with no credential injection</strong> — the rep
            supplies the SSH key. Only Azure Windows seats get a vaulted, injected password.
          </p>

          <!-- Azure VDI — pool networking -->
          <div>
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Azure — desktop pool networking</p>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Desktops subnet ID</label>
              <input type="text" x-model="panelCfg.azure_desktops_subnet_id"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                     placeholder="/subscriptions/…/subnets/desktops-subnet">
              <p class="text-[11px] text-gray-400 mt-1">
                Must be a <strong>non-delegated</strong> subnet whose NSG allows <strong>outbound 443</strong> —
                the RS jump client registers with the appliance at first boot. The sandbox creates
                <code>desktops-subnet</code> for exactly this. Do <strong>not</strong> use <code>aci-subnet</code>:
                ACI-delegated subnets can't host VM NICs.
              </p>
            </div>
          </div>

          <!-- Azure VDI — defaults (optional) -->
          <div class="border-t border-gray-100 pt-4">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Azure — defaults <span class="normal-case text-gray-400">(optional)</span></p>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Default pool VM size</label>
              <input type="text" x-model="panelCfg.azure_desktops_vm_size"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                     placeholder="(pool default — Standard_D2s_v3)">
              <p class="text-[11px] text-gray-400 mt-1">Win 11 / Trusted Launch needs a Gen2 size (e.g. <code>Standard_D2s_v3</code>) — not a B-series.</p>
            </div>
            <div class="mt-3">
              <label class="block text-sm font-medium text-gray-700 mb-1">PRA Vault account-group id</label>
              <input type="text" x-model="panelCfg.azure_desktops_vault_account_group_id"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                     placeholder="(blank → PRA Default group)">
              <p class="text-[11px] text-gray-400 mt-1">Numeric PRA Vault account-group id — the per-seat Windows admin credential is stored there and injected at RDP launch. Windows seats are Azure-only. Blank → the account lands in PRA's Default group.</p>
            </div>
          </div>

          <!-- Azure VDI — adopting existing desktops -->
          <div class="border-t border-gray-100 pt-4">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Azure — adopt existing desktops <span class="normal-case text-gray-400">(optional)</span></p>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Discovery resource groups</label>
              <input type="text" x-model="panelCfg.azure_desktops_discovery_resource_groups"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                     placeholder="avd-hosts-rg, persistent-vdi-rg">
              <p class="text-[11px] text-gray-400 mt-1">
                Comma-separated. <strong>Adopt existing</strong> on the Desktops page lists the VMs in these
                resource groups so you can bring a VDI you built elsewhere (an AVD session host, say) under
                dashboard power control. The dashboard's Azure identity needs <strong>Reader</strong> and
                <strong>Virtual Machine Contributor</strong> on each one. Adopted VMs are never tagged and
                never deleted — deleting an adopted pool only stops managing them.
              </p>
            </div>
          </div>


          <!-- AWS desktop pool defaults -->
          <div class="border-t border-gray-100 pt-4">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">AWS — desktop pool defaults <span class="normal-case text-gray-400">(optional)</span></p>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Desktops subnet ID</label>
              <input type="text" x-model="panelCfg.aws_desktops_subnet_id"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                     placeholder="subnet-0123456789abcdef0">
              <p class="text-[11px] text-gray-400 mt-1">
                Blank falls back to this region's <code>desktops_subnet_id</code>, then to
                <code>aws_default_subnet_id</code>. Safe to leave blank: unlike Azure's
                <code>aci-subnet</code>, no AWS subnet is delegated away from hosting a VM NIC,
                so inheriting the ordinary VM subnet cannot produce a pool that fails to deploy.
              </p>
            </div>
            <div class="mt-3">
              <label class="block text-sm font-medium text-gray-700 mb-1">Default instance type</label>
              <input type="text" x-model="panelCfg.aws_desktops_instance_type"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                     placeholder="(pool default — t3.medium)">
              <p class="text-[11px] text-gray-400 mt-1">Offered in the pool form even if it isn't in the curated list.</p>
            </div>
          </div>

          <!-- GCP desktop pool defaults -->
          <div class="border-t border-gray-100 pt-4">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">GCP — desktop pool defaults <span class="normal-case text-gray-400">(optional)</span></p>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Desktops subnetwork</label>
              <input type="text" x-model="panelCfg.gcp_desktops_subnetwork"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                     placeholder="projects/…/regions/us-central1/subnetworks/…">
              <p class="text-[11px] text-gray-400 mt-1">
                Full self-link, matching what the pool form's picker returns. Blank falls back to
                this region's <code>desktops_subnetwork</code>, then <code>gcp_subnetwork</code>.
                A subnetwork is <strong>regional</strong> — one from another region fails at launch.
              </p>
            </div>
            <div class="mt-3">
              <label class="block text-sm font-medium text-gray-700 mb-1">Default machine type</label>
              <input type="text" x-model="panelCfg.gcp_desktops_machine_type"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                     placeholder="(pool default — e2-medium)">
            </div>
          </div>

          <!-- Azure per-region config sets moved to the Multi-region panel. -->
          <div class="border-t border-gray-100 pt-4">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Per-region config sets</p>
            <p class="text-[11px] text-gray-400">
              Run several regions in one account? Each region's resource group, subnets, DNS zone,
              gallery, and default VM size now live in the
              <button type="button" @click="openPanel(integrations.find(i => i.key === 'multi_region'))"
                      class="text-blue-600 hover:text-blue-800 underline">Multi-region</button>
              panel (alongside AWS and GCP), which now carries each cloud's desktops subnet and
              default size too. Blank fields fall back to the flat keys above, so single-region
              setups are unchanged.
            </p>
          </div>
        </div>
      </template>
