{# Settings slide-over panel "cloud_database". Included by settings.html inside settingsPage(); the state it binds (panelCfg, panelOpen, …) lives in that page's script. #}
      <template x-if="panel?.key === 'cloud_database' && !panelLoading">
        <div class="space-y-4">
          <p class="text-sm text-gray-500">
            Per-cloud Managed-DB network placement. Normally populated by
            <code>setup-&lt;cloud&gt;.sh</code> + the sandbox <code>--push-only</code> import;
            set or override the values by hand here. Enable or disable the feature with its
            toggle in the integrations list above.
          </p>

          <!-- AWS RDS -->
          <div>
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">AWS RDS</p>
            <div class="space-y-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">DB subnet group</label>
                <input type="text" x-model="panelCfg.aws_db_subnet_group_name"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="dashboard-sandbox-db">
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Parameter group <span class="text-gray-400">(force_ssl=0)</span></label>
                  <input type="text" x-model="panelCfg.aws_db_parameter_group_name"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                         placeholder="clouddb-nossl-pg16">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">DB security group</label>
                  <input type="text" x-model="panelCfg.aws_db_security_group_id"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                         placeholder="sg-…">
                </div>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">MySQL parameter group <span class="text-gray-400">(require_secure_transport=0)</span></label>
                <input type="text" x-model="panelCfg.aws_db_mysql_parameter_group_name"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="clouddb-nossl-mysql84">
              </div>
            </div>
          </div>

          <!-- Azure Flexible Server -->
          <div class="border-t border-gray-100 pt-4">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Azure Flexible Server</p>
            <div class="space-y-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Delegated subnet ID</label>
                <input type="text" x-model="panelCfg.azure_db_subnet_id"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="/subscriptions/…/subnets/dashboard-sandbox-db">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Private DNS zone ID</label>
                <input type="text" x-model="panelCfg.azure_db_private_dns_zone_id"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="/subscriptions/…/privateDnsZones/…postgres.database.azure.com">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">MySQL delegated subnet ID</label>
                <input type="text" x-model="panelCfg.azure_db_mysql_subnet_id"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="/subscriptions/…/subnets/db-mysql-subnet">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">MySQL private DNS zone ID</label>
                <input type="text" x-model="panelCfg.azure_db_mysql_private_dns_zone_id"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="/subscriptions/…/privateDnsZones/…mysql.database.azure.com">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">SQL Server PE subnet ID</label>
                <input type="text" x-model="panelCfg.azure_db_sqlserver_subnet_id"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="/subscriptions/…/subnets/db-sqlserver-subnet">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">SQL Server private DNS zone ID</label>
                <input type="text" x-model="panelCfg.azure_db_sqlserver_private_dns_zone_id"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="/subscriptions/…/privateDnsZones/privatelink.database.windows.net">
              </div>
            </div>
          </div>

          <!-- GCP Cloud SQL -->
          <div class="border-t border-gray-100 pt-4">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">GCP Cloud SQL</p>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">VPC network (self-link)</label>
              <input type="text" x-model="panelCfg.gcp_db_network"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                     placeholder="projects/<project>/global/networks/dashboard-sandbox-vpc">
            </div>
          </div>

          <!-- MongoDB Atlas -->
          <div class="border-t border-gray-100 pt-4">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">MongoDB Atlas</p>
            <p class="text-xs text-gray-500 mb-2">
              Each MongoDB cluster gets its own Atlas project in this organization, created by an Atlas
              <strong>service account</strong> with Organization Project Creator. The cluster runs in the
              same cloud and region as the PRA gateway, and its public endpoint is locked to the
              gateway's egress IP.
            </p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Organization ID</label>
                <input type="text" x-model="panelCfg.atlas_org_id"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="24-hex org id">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Default tier <span class="text-gray-400 font-normal">(blank → FLEX)</span></label>
                <input type="text" x-model="panelCfg.atlas_default_tier"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="FLEX">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Service account client ID</label>
                <input type="text" x-model="panelCfg.atlas_client_id"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Service account client secret</label>
                <input type="password" x-model="panelCfg.atlas_client_secret" autocomplete="new-password"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="••••••••">
              </div>
            </div>
            <div class="mt-2">
              <label class="block text-sm font-medium text-gray-700 mb-1">Extra access CIDRs <span class="text-gray-400 font-normal">(comma-separated, optional)</span></label>
              <input type="text" x-model="panelCfg.atlas_extra_access_cidrs"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                     placeholder="52.45.229.219/32, 54.88.235.213/32, 3.224.15.134/32">
              <p class="text-xs text-gray-400 mt-1">Added to every cluster's access list beside the gateway's /32 — e.g. Entitle's egress IPs, which its Atlas connector needs to reach clusters.</p>
            </div>
          </div>
        </div>
      </template>
