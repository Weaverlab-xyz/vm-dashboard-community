{# Settings slide-over panel "pra". Included by settings.html inside settingsPage(); the state it binds (panelCfg, panelOpen, …) lives in that page's script. #}
      <template x-if="panel?.key === 'pra' && !panelLoading">
        <div class="space-y-4">
          <p class="text-sm text-gray-500">
            BeyondTrust Privileged Remote Access brokers access to everything the dashboard
            builds — Shell Jump, Web Jump, Remote RDP and Protocol Tunnel jump items, plus PRA
            Vault accounts. Provisioned via the <strong>BeyondTrust SRA Terraform provider</strong>
            (ARM64-native, no binary dependency).
          </p>
          <p class="text-sm text-gray-500">
            The Asset Group and Gateway named below must already exist in PRA — the dashboard
            looks them up by name, it does not create them. Gateway <em>hosts</em> are deployed
            from the Containers page.
          </p>
          <!-- Privileged Remote Access — Terraform provider -->
          <div class="border-t border-gray-100 pt-4">
            <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">API connection</p>
            <p class="text-xs text-gray-400 mb-3">
              Shell Jump provisioning via the BeyondTrust SRA Terraform provider.
              Runs natively on ARM64 — no binary dependency.
            </p>
            <div class="space-y-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">PRA API Host</label>
                <input type="text" x-model="panelCfg.bt_api_host"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="pra.company.com">
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">OAuth Client ID</label>
                  <input type="text" x-model="panelCfg.bt_client_id"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">OAuth Client Secret</label>
                  <input type="password" x-model="panelCfg.bt_client_secret"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="••••••••">
                </div>
              </div>
            </div>
          </div>
          <div class="border-t border-gray-100 pt-4">
            <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Authentication</p>
            <div class="space-y-3">
              <div>
                <select x-model="panelCfg.pra_auth_mode"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                  <option value="oauth">OAuth client credentials (above, a stored secret)</option>
                  <option value="workload">Workload identity — recommended (BeyondTrust platform identity)</option>
                </select>
                <p class="text-[11px] text-gray-400 mt-1">
                  <strong>Workload identity</strong> presents this dashboard's own identity token instead of
                  a stored credential — set it up once on the
                  <button type="button" class="text-blue-600 hover:underline"
                          @click="openPanel(integrations.find(i => i.key === 'bt_platform_identity'))">BeyondTrust
                    platform identity</button> panel, and add this product to its registration's
                  <strong>Product Scopes</strong> in Pathfinder. Not yet verified live for this product.
                </p>
              </div>
              <div x-show="panelCfg.pra_auth_mode === 'workload'" x-cloak class="space-y-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Workload API URL</label>
                <input type="text" x-model="panelCfg.pra_workload_api_url"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="https://api.beyondtrust.io/site/{site}/...">
                <p class="text-[11px] text-gray-400 mt-1">
                  Where calls go on workload identity auth; <code>{site}</code> is the site ID from
                  the platform identity panel. The default is a <strong>best guess</strong> at the
                  Pathfinder gateway path — if calls answer 404 or 421, this is the field to fix
                  (it may be the product's own host instead).
                </p>
              </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">
                    Service name <span class="text-gray-400 font-normal">(optional override)</span>
                  </label>
                  <input type="text" x-model="panelCfg.pra_workload_service_name"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="(blank = the platform identity's service name)">
                </div>
                <p class="text-[11px] text-amber-700">
                  Covers the dashboard's own REST calls (pickers, k8s tunnel jumps). The sra Terraform provider — Shell Jump, Web Jump, RDP and tunnel provisioning — still uses the client credentials above — keep them set.
                </p>
              </div>
            </div>
          </div>
          <div class="border-t border-gray-100 pt-4">
            <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Configuration API account</p>
            <p class="text-xs text-gray-400 mb-3">
              For the few calls the SRA Terraform provider cannot make — the PRA Vault accounts used by
              cloud-database onboarding. Optional: leave blank to reuse the credentials above.
            </p>
            <div class="space-y-3">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">PRA Config API Client ID</label>
                  <input type="text" x-model="panelCfg.pra_config_api_client_id"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="(blank = reuse PRA client id)">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">PRA Config API Client Secret</label>
                  <input type="password" x-model="panelCfg.pra_config_api_client_secret"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="••••••••">
                </div>
              </div>
            </div>
          </div>
          <!-- Shell Jump provisioning -->
          <div class="border-t border-gray-100 pt-4">
            <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Shell Jump provisioning</p>
            <p class="text-xs text-gray-400 mb-3">
              The Asset Group and Gateway must already exist in PRA — the dashboard looks them up by name and creates Shell Jumps inside them.
            </p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Asset Group Name <span class="text-gray-400 font-normal">(AWS)</span></label>
                <input type="text" x-model="panelCfg.bt_jump_group_name"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="us-east-2">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Gateway Name <span class="text-gray-400 font-normal">(AWS)</span></label>
                <input type="text" x-model="panelCfg.bt_jumpoint_name"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="AWS ECS">
              </div>
            </div>
            <div class="mb-3">
              <label class="block text-sm font-medium text-gray-700 mb-1">Gateway host instance type <span class="text-gray-400 font-normal">(AWS)</span></label>
              <input type="text" x-model="panelCfg.bt_ecs_host_instance_type"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="t3.small (default)">
              <p class="text-xs text-gray-400 mt-1">
                Size of the shared ECS Gateway host. A Web Jump renders headless Chromium on the
                Gateway and needs ≥2 GB — <span class="font-mono">t3.small</span> minimum,
                <span class="font-mono">t3.medium</span> preferred. Changing this never resizes a
                live host: terminate the Gateway host instance and the next deploy recreates it
                at the new size. Blank keeps the default (t3.small).
              </p>
            </div>
            <div class="mb-3">
              <label class="block text-sm font-medium text-gray-700 mb-1">Network-tunnel address pool <span class="text-gray-400 font-normal">(AWS)</span></label>
              <input type="text" x-model="panelCfg.bt_ecs_jumpoint_tunnel_pool"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="derived from the gateway subnet">
              <p class="text-xs text-gray-400 mt-1">
                A PRA <strong>Network Tunnel</strong> leases the operator a real address on the
                target network, and the VPC only answers ARP for addresses registered as
                secondary private IPs on the gateway host's ENI — so the dashboard registers
                them, and clears the instance's <span class="font-mono">SourceDestCheck</span>.
                Blank <strong>derives</strong> the pool from the gateway subnet (last 8 usable
                addresses, from the top because AWS allocates from the bottom). Set an explicit
                pool as <span class="font-mono">10.99.5.200-10.99.5.207</span>, a CIDR, or a
                single address; <span class="font-mono">off</span> disables it. This
                <strong>must match</strong> “Managed IP Addresses for Protocol Tunnel” on the
                Gateway in the Pathfinder console — the dashboard cannot read that, and a
                mismatch shows up only as the Gateway failing its ARP check. A per-region entry
                wins over this key.
              </p>
            </div>
            <p class="text-xs text-gray-400 mb-2">Azure overrides — leave blank to reuse the AWS values above.</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Asset Group Name <span class="text-gray-400 font-normal">(Azure)</span></label>
                <input type="text" x-model="panelCfg.azure_bt_jump_group_name"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="same as AWS">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Gateway Name <span class="text-gray-400 font-normal">(Azure)</span></label>
                <input type="text" x-model="panelCfg.azure_jumpoint_name"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="ACI">
              </div>
            </div>
            <div class="mb-3">
              <label class="block text-sm font-medium text-gray-700 mb-1">VM Gateway mode <span class="text-gray-400 font-normal">(Azure)</span></label>
              <!-- x-init default is load-bearing: an unset string config key reads back
                   as "" from /api/setup/feature, not as the model default. -->
              <select x-model="panelCfg.azure_vm_jumpoint_mode"
                      x-init="panelCfg.azure_vm_jumpoint_mode = panelCfg.azure_vm_jumpoint_mode || 'shared'"
                      class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="shared">Shared host (default) — one Gateway VM for all VMs, databases and clusters</option>
                <option value="aci">ACI — a dedicated container group per VM</option>
              </select>
              <p class="text-xs text-gray-400 mt-1">
                Applies to single deploys; a batch always shares one ACI group. ACI is
                Shell-Jump only — it cannot do protocol tunnels — and every group mounts
                the same <span class="font-mono">/jpt</span> share, so they contend over one
                Gateway identity. A deploy that supplies its own Gateway deploy key always
                gets ACI, since the shared host uses the configured key.
              </p>
            </div>
            <div class="mb-3">
              <label class="block text-sm font-medium text-gray-700 mb-1">Vault account group — Windows server jumps</label>
              <input type="text" x-model="panelCfg.pra_windows_vault_account_group_id"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="numeric id (optional)">
              <p class="text-xs text-gray-400 mt-1">
                Where a Windows server build's administrator credential is vaulted for
                injection into its Shell Jump and RDP jump (Azure, AWS, GCP). Not used when
                Password Safe manages the account — PRA then injects it through its Password
                Safe integration.
              </p>
            </div>
            <div class="mb-3">
              <label class="flex items-center gap-2 text-sm text-gray-700">
                <input type="checkbox" x-model="panelCfg.windows_ssh_enabled" class="rounded text-blue-600">
                Windows servers: reach them over SSH (Shell Jump)
              </label>
              <p class="text-xs text-gray-400 mt-1">
                A Windows build switches on OpenSSH Server at first boot and gets a Shell Jump
                on port 22 that opens in PowerShell. Server 2019 and 2022 download OpenSSH from
                Windows Update, so the VM needs outbound access. If OpenSSH does not come up,
                the build gets an RDP jump instead, with a warning on the job. Unchecked, every
                Windows build gets an RDP jump.
              </p>
            </div>
            <div class="mb-3">
              <label class="flex items-center gap-2 text-sm text-gray-700">
                <input type="checkbox" x-model="panelCfg.windows_rdp_default" class="rounded text-blue-600">
                Windows servers: also create an RDP jump by default
              </label>
              <p class="text-xs text-gray-400 mt-1">
                The default for the deploy form's <em>Also enable RDP</em> checkbox. Each deploy
                can still change it.
              </p>
            </div>
            <div class="mb-3">
              <label class="block text-sm font-medium text-gray-700 mb-1">Gateway VM size <span class="text-gray-400 font-normal">(Azure)</span></label>
              <input type="text" x-model="panelCfg.azure_jumpoint_vm_size"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="Standard_B2s (default)">
              <p class="text-xs text-gray-400 mt-1">
                Size of the shared Gateway VM. A Web Jump renders headless Chromium on the
                Gateway and needs ≥2 GB — <span class="font-mono">Standard_B1ms</span> minimum,
                <span class="font-mono">Standard_B2s</span> preferred. Changing this never
                resizes a live Gateway: delete the Gateway VM and the next deploy recreates it
                at the new size. Blank keeps the default (Standard_B2s).
              </p>
            </div>
            <div class="mb-3">
              <label class="block text-sm font-medium text-gray-700 mb-1">Network-tunnel address pool <span class="text-gray-400 font-normal">(Azure)</span></label>
              <input type="text" x-model="panelCfg.azure_jumpoint_tunnel_pool"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="derived from the gateway subnet">
              <p class="text-xs text-gray-400 mt-1">
                A PRA <strong>Network Tunnel</strong> leases the operator a real address on the
                target network, and Azure only honours addresses registered as secondary
                ipconfigs on the Gateway's NIC — so the dashboard registers them. Blank
                <strong>derives</strong> the pool from the gateway subnet (the last 8 usable
                addresses, taken from the top because Azure allocates from the bottom). Set an
                explicit pool as <span class="font-mono">10.99.5.200-10.99.5.207</span>, a CIDR,
                or a single address. This <strong>must match</strong> “Managed IP Addresses for
                Protocol Tunnel” on the Gateway in the Pathfinder console — the dashboard cannot
                read that, and a mismatch shows up only as the Gateway failing its ARP check.
                A per-region entry wins over this key.
              </p>
            </div>
            <div class="mb-3 pt-3 border-t border-gray-100">
              <label class="flex items-center gap-2 text-sm text-gray-700">
                <input type="checkbox" x-model="panelCfg.ot_aws_require_private_subnet" class="rounded text-blue-600">
                OT demo cell (AWS): refuse a subnet that auto-assigns public IPs
              </label>
              <p class="text-xs text-gray-400 mt-1">
                EC2 has no per-instance external-IP switch — the subnet's
                <span class="font-mono">MapPublicIpOnLaunch</span> decides — so a cell deployed
                into a public subnet comes up addressable from the internet and the air-gapped
                "plant network" the demo rests on is gone. Checked, the deploy refuses before
                launching anything. GCP and Azure cells pin the external IP off in the form and
                are unaffected.
              </p>
            </div>
            <div class="mb-3">
              <label class="flex items-center gap-2 text-sm text-gray-700">
                <input type="checkbox" x-model="panelCfg.ot_purdue_firewall_enabled" class="rounded text-blue-600">
                OT demo cell: fence each cell into its own Purdue zone
              </label>
              <p class="text-xs text-gray-400 mt-1">
                Adds three firewall rules per cell, on its
                <span class="font-mono">ot-sim</span> network tag: no route out at all, and
                inbound only from the PRA Gateway's <span class="font-mono">bt-jumpoint</span>
                tag. They outrank the on-demand egress rule, so a cell stays air-gapped even
                with <span class="font-mono">gcp_vm_nat_enabled</span> on — without them, turning
                on egress for one ordinary VM quietly gives every plant cell a route to the
                internet. Removed with the cell; existing cells pick them up on
                <em>Re-wire</em>. On AWS the same zone is a security group that
                <em>replaces</em> the instance's, and on Azure an NSG whose outbound Deny
                is what actually closes the cell — Azure's default outbound access gives
                a VM with no public IP a route out otherwise. Those two apply only to a
                cell that also has a DMZ broker, so an existing cell's posture never
                changes underneath it.
              </p>
            </div>
            <div class="mb-3">
              <label class="block text-sm font-medium text-gray-700 mb-1">OT demo cell: Entitle egress ranges</label>
              <input type="text" x-model="panelCfg.ot_entitle_egress_cidrs"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="203.0.113.10/32, 203.0.113.11/32">
              <p class="text-xs text-gray-400 mt-1">
                The only way out of the plant. The cell's industrial-DMZ broker runs the
                Entitle agent, and this is the comma-separated set of addresses it may reach
                on 443 and 8080 — everything else, from both the broker and the cell, is
                denied. A firewall rule takes addresses, not names, so an address list from
                BeyondTrust is the supported answer, and it is the same firewall ticket a real
                plant raises. Left blank the deploy resolves
                <span class="font-mono">agent.&lt;region&gt;.entitle.io</span> itself and labels
                the result <em>resolved, not published</em> on the cell card; if that fails it
                refuses rather than widening to <span class="font-mono">0.0.0.0/0</span>.
              </p>
            </div>
            <div class="mb-3">
              <label class="flex items-center gap-2 text-sm text-gray-700">
                <input type="checkbox" x-model="panelCfg.ot_dmz_egress_open_ports" class="rounded text-blue-600">
                OT demo cell: let the DMZ broker reach 443/8080 anywhere
              </label>
              <p class="text-xs text-gray-400 mt-1">
                The escape hatch for a site that cannot pin BeyondTrust's addresses. Allows tcp
                443 and 8080 to <span class="font-mono">0.0.0.0/0</span> <em>from the broker
                only</em> (the <span class="font-mono">ot-dmz</span> tag on GCP, the broker's
                security group on AWS, its NSG on Azure) — the PLC cell keeps its
                true air gap and the broker still gets no other port. It is a weaker claim than
                an address list, so the job summary and the cell card name which of the two drew
                the rule; the demo owns the difference out loud rather than implying a pinned
                path it does not have.
              </p>
            </div>
            <div class="mb-3">
              <label class="block text-sm font-medium text-gray-700 mb-1">OT demo cell: Config-Management runner range</label>
              <input type="text" x-model="panelCfg.ot_config_runner_source_cidr"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="10.10.0.0/28">
              <p class="text-xs text-gray-400 mt-1">
                The broker has no public address, so the agent is installed over SSH by the
                in-cloud Ansible runner — and the broker admits :22 from the PRA Gateway and
                this range alone. Set it to the CIDR of the subnet the runner sources from:
                on GCP the direct VPC egress subnet (<span class="font-mono">gcp_run_subnetwork</span>)
                or the Serverless VPC connector (<span class="font-mono">gcp_ansible_vpc_connector</span>),
                on AWS the Fargate task's subnet (<span class="font-mono">ansible_ecs_subnet_id</span>),
                on Azure the ACI subnet (<span class="font-mono">ansible_aci_subnet_id</span>).
                Unset, the deploy refuses — an agent that cannot be installed also cannot be
                repaired on a <em>Re-wire</em>.
              </p>
            </div>
            <p class="text-xs text-gray-400 mb-2">GCP overrides — leave blank to reuse the AWS values above.</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Asset Group Name <span class="text-gray-400 font-normal">(GCP)</span></label>
                <input type="text" x-model="panelCfg.gcp_bt_jump_group_name"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="same as AWS">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Gateway Name <span class="text-gray-400 font-normal">(GCP)</span></label>
                <input type="text" x-model="panelCfg.gcp_jumpoint_name"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="same as AWS">
              </div>
            </div>
            <div class="mt-3">
              <label class="block text-sm font-medium text-gray-700 mb-1">VM Gateway mode <span class="text-gray-400 font-normal">(GCP)</span></label>
              <!-- x-init default is load-bearing: an unset string config key reads back
                   as "" from /api/setup/feature, not as the model default. -->
              <select x-model="panelCfg.gcp_vm_jumpoint_mode"
                      x-init="panelCfg.gcp_vm_jumpoint_mode = panelCfg.gcp_vm_jumpoint_mode || 'shared'"
                      class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="shared">Shared host (default) — one Gateway for all VMs, databases and clusters</option>
                <option value="paired">Paired — a dedicated bt-jumpoint-&lt;vm&gt; per VM</option>
              </select>
              <p class="text-xs text-gray-400 mt-1">
                Applies to single deploys; a batch always shares one Gateway. Paired
                costs an extra e2-micro per VM. A deploy that supplies its own Gateway
                deploy key is always paired, since the shared host uses the configured key.
              </p>
            </div>
            <div class="mt-3">
              <label class="block text-sm font-medium text-gray-700 mb-1">Gateway machine type <span class="text-gray-400 font-normal">(GCP)</span></label>
              <input type="text" x-model="panelCfg.gcp_jumpoint_machine_type"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="e2-medium (default)">
              <p class="text-xs text-gray-400 mt-1">
                Size of the shared Gateway host. A Web Jump renders headless Chromium on the
                Gateway and needs ≥2 GB — <span class="font-mono">e2-small</span> minimum,
                <span class="font-mono">e2-medium</span> preferred; below that the session is
                OOM-killed and the failure looks identical to a blocked firewall. Changing this
                never resizes a live Gateway: delete the Gateway VM and the next deploy
                recreates it at the new size. Blank keeps the default (e2-medium).
              </p>
            </div>
            <div class="mt-3">
              <label class="block text-sm font-medium text-gray-700 mb-1">Network-tunnel alias range <span class="text-gray-400 font-normal">(GCP)</span></label>
              <input type="text" x-model="panelCfg.gcp_jumpoint_tunnel_pool"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="derived from the gateway subnetwork">
              <p class="text-xs text-gray-400 mt-1">
                A PRA <strong>Network Tunnel</strong> leases the operator a real address on the
                target network. GCE only routes addresses declared as an <strong>alias IP
                range</strong> on the NIC, so the dashboard declares one and sets
                <span class="font-mono">canIpForward</span>. Blank <strong>derives</strong> it
                from the gateway subnetwork — for a <span class="font-mono">/24</span>, the
                highest aligned block of 8 clear of GCE's reserved addresses
                (<span class="font-mono">x.x.x.240/29</span>). Must be a
                <strong>CIDR</strong>, not a range, because an alias range is a prefix;
                <span class="font-mono">off</span> disables it. Both halves are
                <strong>create-only</strong> on GCE — an existing Gateway VM has to be recreated
                to carry network tunnels. Must match “Managed IP Addresses for Protocol Tunnel”
                in the Pathfinder console. A per-region entry wins over this key.
              </p>
            </div>
          </div>
          <div class="border-t border-gray-100 pt-4">
            <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Kubernetes tunnel identity</p>
            <p class="text-xs text-gray-400 mb-3">
              The ServiceAccount PRA injects into a managed cluster for API-server tunnels, and the PRA
              Vault account group injected Kubernetes, database and Web Jump credentials land in. Password
              Safe can rotate this token on a schedule — see the
              <button type="button" @click="openPanelByKey('password_safe', 'kubernetes')" class="underline text-blue-600">Password
              Safe</button> panel's Kubernetes tab.
            </p>
            <div class="space-y-3">
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">PRA SA Namespace</label>
                  <input type="text" x-model="panelCfg.pra_k8s_namespace"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="pra-access">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">PRA SA Name</label>
                  <input type="text" x-model="panelCfg.pra_k8s_sa_name"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="pra-access">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">PRA Vault Account Group ID <span class="text-gray-400 font-normal">(optional)</span></label>
                  <input type="text" x-model="panelCfg.bt_vault_account_group_id"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="(numeric id)">
                </div>
              </div>
            </div>
