{# Settings slide-over panel "workload_credentials". Included by settings.html inside settingsPage(); the state it binds (panelCfg, panelOpen, …) lives in that page's script. #}
      <template x-if="panel?.key === 'workload_credentials' && !panelLoading">
        <div class="space-y-5">
          <p class="text-sm text-gray-500">
            Requires a <strong>US-region</strong> Pathfinder site with the feature enabled.
          </p>
          <p class="text-sm text-gray-500">
            Mint <strong>short-lived</strong> AWS and Azure credentials on demand instead of
            storing static keys. This is additive: each cloud is opted in separately, and any
            cloud left off keeps using the credentials it uses today. GCP is absent because
            Workload Credentials mints AWS and Azure only — a mixed install is normal.
            Enable/disable the feature with its toggle under Integrations → BeyondTrust.
            <a href="/docs/workload-lab/workload-credentials" target="_blank"
               class="text-blue-600 hover:text-blue-800 underline">Integration guide</a>.
          </p>

          <div>
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Connection</p>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">API base URL</label>
              <input type="text" x-model="panelCfg.wlc_api_base_url"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                     placeholder="https://api.beyondtrust.io">
            </div>
            <div class="mt-3">
              <label class="block text-sm font-medium text-gray-700 mb-1">Site ID</label>
              <input type="text" x-model="panelCfg.wlc_site_id"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                     placeholder="00000000-0000-0000-0000-000000000000">
              <p class="text-[11px] text-gray-400 mt-1">
                Your site (tenant) GUID — the <code>tenant_id</code> claim in the access token
                your browser holds after signing in to Pathfinder.
              </p>
            </div>
            <div class="mt-3">
              <label class="block text-sm font-medium text-gray-700 mb-1">Authentication</label>
              <select x-model="panelCfg.wlc_auth_mode"
                      class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                <option value="pat">Personal Access Token (a stored secret)</option>
                <option value="workload">Workload identity — recommended (nothing stored)</option>
              </select>
              <p class="text-[11px] text-gray-400 mt-1">
                <strong>Workload identity</strong> is available when the platform hands this
                container its own identity token. The token is presented to Pathfinder, which
                trusts it because you registered a <strong>Workload Identity</strong> there — so
                this install holds <strong>no BeyondTrust credential at all</strong>. Registering
                the trust is a one-time action in the Pathfinder GUI under
                <strong>Administration → Workload Identities</strong>; there is no API for it.
                See <a href="/docs/operations/cloud-hosting" target="_blank"
                       class="text-blue-600 hover:text-blue-800 underline">Cloud hosting</a>.
              </p>
            </div>
            <div class="mt-3" x-show="(panelCfg.wlc_auth_mode || 'pat') !== 'workload'" x-cloak>
              <label class="block text-sm font-medium text-gray-700 mb-1">Personal Access Token</label>
              <input type="password" x-model="panelCfg.wlc_pat" autocomplete="new-password"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                     :placeholder="(panelCfg._secrets_set || []).includes('wlc_pat')
                                   ? '•••••••• stored — leave blank to keep'
                                   : 'Paste the token'">
              <p class="text-[11px] text-gray-400 mt-1">
                Created under <strong>Manage Profile → Personal Access Tokens</strong>. Stored
                encrypted; the box is always empty — leave it blank to keep the stored token,
                type to replace it, or clear it to remove it. A PAT is scoped to a single
                site. <strong>This is the one long-lived credential this mode still needs</strong>
                — it replaces the per-cloud static keys rather than eliminating secrets entirely.
                The workload-identity mode above removes it.
              </p>
            </div>
            <div class="mt-3 rounded-lg bg-blue-50 border border-blue-200 px-3 py-2"
                 x-show="panelCfg.wlc_auth_mode === 'workload'" x-cloak>
              <p class="text-xs text-blue-900">
                Workload identity uses the <strong>BeyondTrust platform identity</strong> — the
                platform, service name and audience are set once there and shared with PRA,
                Password Safe, EPM-L and Entitle.
                <button type="button" class="underline"
                        @click="openPanel(integrations.find(i => i.key === 'bt_platform_identity'))">Open
                  BeyondTrust platform identity</button>.
                Its registration's <strong>Product Scopes</strong> must include
                <strong>Secrets</strong>.
              </p>
            </div>
            <div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">API version</label>
                <input type="text" x-model="panelCfg.wlc_api_version"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="2026-04-28">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">API path version <span class="text-gray-400 font-normal">(optional)</span></label>
                <input type="text" x-model="panelCfg.wlc_api_path_version"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="(none)">
              </div>
            </div>
            <p class="text-[11px] text-gray-400 mt-1">
              The version is sent as the mandatory <code>bt-secrets-api-version</code> header.
              A wrong value fails in a way that looks like an authentication error, so change it
              only when BeyondTrust says to.
            </p>

            <div class="mt-3 flex items-center gap-2">
              <button type="button" @click="testWlcConnection()" :disabled="wlcTest.running"
                      class="text-xs px-2 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50">
                <span x-text="wlcTest.running ? 'Testing…' : 'Test connection'"></span>
              </button>
              <span x-show="wlcTest.ok === true" x-cloak
                    class="text-xs text-green-700" x-text="wlcTest.message"></span>
            </div>
            <p x-show="wlcTest.ok === false" x-cloak
               class="text-xs text-red-600 mt-2" x-text="wlcTest.error"></p>
            <p class="text-[11px] text-gray-400 mt-1">
              Authenticates with <code>GET /session</code> — it proves the site ID, the API
              version and whatever this panel authenticates with (the stored token, or this
              container's identity) together without issuing a credential, so it is <strong>free</strong>
              and safe to repeat. Tests the <strong>saved</strong> values, so save first. Unlike
              Active credential source below, this asks BeyondTrust rather than replaying the last
              stored result.
            </p>
          </div>

          <div class="border-t border-gray-100 pt-4">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">
              Static secrets <span class="normal-case text-gray-400">(free, unmetered)</span>
            </p>
            <label class="block text-sm font-medium text-gray-700 mb-1">Folder</label>
            <input type="text" x-model="panelCfg.secrets_wlc_folder"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                   placeholder="dashboard">
            <p class="text-[11px] text-gray-400 mt-1">
              Where the <a href="/secrets" class="text-blue-600 hover:text-blue-800 underline">Secrets</a>
              page writes when Workload Credentials is the selected backend. Static secrets are
              not metered — only dynamic credential issuances are.
            </p>
          </div>

          <div class="border-t border-gray-100 pt-4">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">
              Dynamic credentials <span class="normal-case text-gray-400">(billed per issuance)</span>
            </p>
            <div class="rounded-lg bg-gray-50 border border-gray-200 px-3 py-2 mb-3">
              <p class="text-[11px] text-gray-500">
                Each cloud below is opted in <strong>separately</strong>, and each stays off until
                you have created the matching dynamic secret in Workload Credentials. Turning one on
                reroutes that cloud's credentials on the next refresh; the other clouds are untouched.
                Prefer a TTL of an hour or more on the dynamic secret — issuances are metered, and
                AWS credentials cannot be revoked early anyway, so a short TTL buys nothing.
              </p>
            </div>

            <label class="flex items-start gap-2 mb-2">
              <input type="checkbox" x-model="panelCfg.wlc_aws_enabled"
                     class="mt-0.5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
              <span class="text-sm text-gray-700">
                <span class="font-medium">Use dynamic credentials for AWS</span>
                <span class="block text-[11px] text-gray-400">
                  Assumed-role credentials via STS. The target role's
                  <code>MaxSessionDuration</code> caps the TTL — it defaults to one hour, so raise
                  it if the dynamic secret asks for longer.
                </span>
              </span>
            </label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">AWS — folder</label>
                <input type="text" x-model="panelCfg.wlc_aws_folder"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="production/aws">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">AWS — dynamic secret</label>
                <input type="text" x-model="panelCfg.wlc_aws_secret_name"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="dashboard-provision">
              </div>
            </div>
            <div class="mt-3">
              <label class="block text-sm font-medium text-gray-700 mb-1">AWS — everyday dynamic secret <span class="text-gray-400 font-normal">(optional)</span></label>
              <input type="text" x-model="panelCfg.wlc_aws_readonly_secret_name"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                     placeholder="dashboard-everyday">
              <p class="text-[11px] text-gray-400 mt-1">
                Set this to split the credential by lifecycle. Everything outside a job uses this
                lease; the provisioning lease is minted only while a job runs and is never
                pre-warmed, so <strong><code>iam:PassRole</code> and <code>iam:CreateRole</code>
                are absent from the stored credential between jobs</strong> — which is the point
                of the split.
              </p>
              <p class="text-[11px] text-amber-700 mt-1">
                <strong>Not literally read-only</strong>, despite the setting name. The dashboard
                writes on the request path too — editing a secret, uploading to storage,
                re-tagging a VM, starting a container task. Its session policy needs those, and
                only needs to <em>exclude</em> IAM. A strictly read-only policy here breaks the
                Secrets and Storage pages.
              </p>
              <p class="text-[11px] text-gray-400 mt-1">
                It can point at the <strong>same role</strong> as the provisioning secret with a
                narrower session policy. Leave blank to use one lease for everything, which is
                the default and changes nothing.
              </p>
            </div>
            <div class="mt-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">AWS — everyday credential</label>
              <select x-model="panelCfg.wlc_aws_everyday_source"
                      class="w-full sm:w-2/3 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                <option value="lease">A Workload Credentials lease (the everyday secret above, or the provisioning one)</option>
                <option value="federation">The dashboard's SPIFFE identity (lease only in jobs)</option>
              </select>
              <p class="text-[11px] text-gray-400 mt-1">
                With the SPIFFE identity, pages and API calls assume the role in
                <code>aws_federation_role_arn</code> (Remote Agents → the dashboard's own SPIFFE
                identity), and the provisioning lease is minted only when a job needs it. No
                everyday dynamic secret is needed. If federation is not usable, AWS calls outside
                jobs fail rather than fall back to the lease.
              </p>
            </div>

            <label class="flex items-start gap-2 mt-4 mb-2">
              <input type="checkbox" x-model="panelCfg.wlc_azure_enabled"
                     class="mt-0.5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
              <span class="text-sm text-gray-700">
                <span class="font-medium">Use dynamic credentials for Azure</span>
                <span class="block text-[11px] text-gray-400">
                  A temporary password on a pre-existing app registration. TTL is 1–24 hours, and
                  unlike AWS these <em>can</em> be revoked, so each refresh releases the previous
                  lease to stop credentials accumulating on the app registration.
                </span>
              </span>
            </label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Azure — folder</label>
                <input type="text" x-model="panelCfg.wlc_azure_folder"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="production/azure">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Azure — dynamic secret</label>
                <input type="text" x-model="panelCfg.wlc_azure_secret_name"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="dashboard-azure">
              </div>
            </div>

            <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Azure — everyday credential</label>
                <select x-model="panelCfg.wlc_azure_everyday_source"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                  <option value="lease">The Workload Credentials lease (everything)</option>
                  <option value="federation">The dashboard's SPIFFE identity (lease only in jobs)</option>
                </select>
                <p class="text-[11px] text-gray-400 mt-1">
                  With the SPIFFE identity, pages and API calls use the app in
                  <code>azure_client_id</code> through its federated credential, and the
                  Workload Credentials password, which carries role-assignment rights, is
                  minted only when a job needs it. If federation is not usable, Azure calls
                  outside jobs fail rather than fall back to the lease.
                </p>
              </div>
              <div x-show="panelCfg.wlc_azure_everyday_source === 'federation'" x-cloak>
                <label class="block text-sm font-medium text-gray-700 mb-1">Everyday identity's object id</label>
                <input type="text" x-model="panelCfg.azure_everyday_principal_id"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                       placeholder="az ad sp show --id &lt;azure_client_id&gt; --query id">
                <p class="text-[11px] text-gray-400 mt-1">
                  Granted cluster admin on AKS clusters a job builds, so the Kubernetes pages
                  can still reach them.
                </p>
              </div>
            </div>

            <div class="mt-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Refresh margin (%)</label>
              <input type="number" min="1" max="99" x-model.number="panelCfg.wlc_refresh_margin_pct"
                     class="w-32 border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
              <p class="text-[11px] text-gray-400 mt-1">
                Regenerate once less than this share of a lease's lifetime remains. Lower means
                fewer issuances but a smaller safety window; the value is clamped to 1–99 because
                0 would pin a dead lease and 100 would bill an issuance on every check.
              </p>
            </div>
            <div class="mt-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Life left for Terraform and Packer (%)</label>
              <input type="number" min="1" max="95" x-model.number="panelCfg.wlc_subprocess_min_remaining_pct"
                     class="w-32 border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono">
              <p class="text-[11px] text-gray-400 mt-1">
                Terraform and Packer read their credential once, at start, so they are given a
                lease only while at least this share of its lifetime remains; otherwise a fresh
                one is issued. Keeps a short provisioning lease from expiring mid-apply.
                Clamped to 1–95.
              </p>
            </div>
            <label class="flex items-start gap-2 mt-4">
              <input type="checkbox" x-model="panelCfg.wlc_subprocess_credential_process"
                     class="mt-0.5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
              <span class="text-sm text-gray-700">
                <span class="font-medium">Let Terraform and Packer renew their AWS credential</span>
                <span class="block text-[11px] text-gray-400">
                  Gives them an AWS profile whose <code>credential_process</code> asks the
                  dashboard for the lease, so a run longer than the lease keeps working.
                  Off hands them fixed keys that last as long as the lease they started with.
                </span>
              </span>
            </label>
            <div class="mt-5 border-t border-gray-100 pt-4">
              <div class="flex items-center justify-between">
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide">Active credential source</p>
                <button @click="checkWlcSources()" :disabled="wlcSources.running"
                        class="text-xs px-2 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50">
                  <span x-text="wlcSources.running ? 'Checking…' : 'Check'"></span>
                </button>
              </div>
              <p class="text-[11px] text-gray-400 mt-1">
                What each cloud is <strong>actually</strong> using right now. Worth checking after
                changing anything above — a broken lease and a cloud still on its static key look
                the same from the outside otherwise.
              </p>
              <p x-show="wlcSources.error" x-cloak class="text-xs text-red-600 mt-2"
                 x-text="wlcSources.error"></p>
              <table x-show="wlcSources.clouds.length" x-cloak class="w-full text-xs mt-2">
                <tbody>
                  <template x-for="c in wlcSources.clouds" :key="c.cloud">
                    <tr class="border-t border-gray-100">
                      <td class="py-1.5 pr-2 font-mono uppercase text-gray-500" x-text="c.cloud"></td>
                      <td class="py-1.5 pr-2">
                        <span class="px-1.5 py-0.5 rounded text-[11px]"
                              :class="c.source === 'dynamic' ? 'bg-green-100 text-green-800'
                                      : (c.source === 'static' ? 'bg-gray-100 text-gray-700'
                                                               : 'bg-amber-100 text-amber-800')"
                              x-text="c.source === 'dynamic' ? 'dynamic (WC)' : c.source"></span>
                      </td>
                      <td class="py-1.5 text-gray-500">
                        <template x-if="c.problem">
                          <span class="text-amber-700" x-text="c.problem"></span>
                        </template>
                        <!-- One line per purpose. Reporting only `provision` is what let a
                             failing everyday lease read as "no usable lease yet" here
                             while every AWS call on the site was 401ing. -->
                        <template x-if="c.everyday">
                          <div class="flex items-baseline gap-1.5">
                            <span class="font-mono text-[10px] text-gray-600 font-semibold">everyday</span>
                            <span x-show="!c.everyday.problem" x-text="c.everyday.source"></span>
                            <span x-show="c.everyday.problem" class="text-red-600"
                                  x-text="c.everyday.source + ' not usable: ' + c.everyday.problem"></span>
                          </div>
                        </template>
                        <template x-for="l in (c.leases || [])" :key="l.purpose">
                          <div class="flex items-baseline gap-1.5">
                            <span class="font-mono text-[10px]"
                                  :class="l.serving_requests ? 'text-gray-600 font-semibold'
                                                             : 'text-gray-400'"
                                  x-text="l.purpose"></span>
                            <template x-if="l.usable">
                              <span>expires <span x-text="l.expires_at"></span></span>
                            </template>
                            <template x-if="!l.usable && l.last_error">
                              <span class="text-red-600" x-text="l.last_error"></span>
                            </template>
                            <template x-if="!l.usable && !l.last_error && l.on_demand">
                              <span class="text-gray-400">minted when a job runs</span>
                            </template>
                            <template x-if="!l.usable && !l.last_error && !l.on_demand">
                              <span class="text-red-600">no lease yet</span>
                            </template>
                          </div>
                        </template>
                        <template x-if="!(c.leases || []).length && !c.problem && c.source === 'static'">
                          <span class="text-gray-400">static key in the encrypted config</span>
                        </template>
                        <template x-if="!(c.leases || []).length && !c.problem && c.source === 'unconfigured'">
                          <span class="text-gray-400">no credential configured</span>
                        </template>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <p x-show="wlcSources.clouds.some(c => (c.leases || []).length > 1)" x-cloak
                 class="text-[11px] text-gray-400 mt-2">
                <code>readonly</code> is the lease every page and API call uses.
                <code>provision</code> carries write privilege and is minted only while a
                job is running, so no lease between jobs is normal — that is the point of
                the split.
              </p>
            </div>
          </div>
        </div>
      </template>
