{# Settings slide-over panel "admission_control". Included by settings.html inside settingsPage(); the state it binds (panelCfg, panelOpen, …) lives in that page's script. #}
      <template x-if="panel?.key === 'admission_control' && !panelLoading">
        <div class="space-y-4">
          <p class="text-sm text-gray-500">
            Evaluate every deploy against OPA policies <strong>before</strong> the job starts.
            A blocked deploy returns 403 with the reason and is recorded in the
            tamper-evident audit log — nothing is created. See the
            <a href="/docs/operations/scheduling/policy-guardrails" class="underline" target="_blank">guardrails guide</a>.
          </p>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Gated actions</label>
            <input type="text" x-model="panelCfg.admission_gated_actions"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                   placeholder="aws:ec2:deploy, azure:vm:deploy, gcp:gce:deploy, clouddb:provision, k8s:provision">
            <p class="text-[11px] text-gray-400 mt-1">
              Comma-separated. Only these actions are gated; everything else is unaffected.
              Leave blank and the gate is inert even while enabled.
            </p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Allowed regions</label>
            <!-- Chips + catalog picker over the same comma-separated value the
                 gate reads, so a region typed by hand (gov cloud, a region the
                 catalog doesn't know) is preserved rather than dropped. -->
            <div class="flex flex-wrap gap-1.5 mb-2" x-show="allowedRegionList().length">
              <template x-for="r in allowedRegionList()" :key="r">
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-blue-50 text-blue-700 text-xs font-mono">
                  <span x-text="r"></span>
                  <button type="button" @click="removeAllowedRegion(r)"
                          class="text-blue-400 hover:text-blue-700 leading-none">&times;</button>
                </span>
              </template>
            </div>
            <select @change="addAllowedRegion($event.target.value); $event.target.value = ''"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mb-2">
              <option value="">+ Add a region from the catalog…</option>
              <template x-for="g in regionCatalogGroups()" :key="g.cloud">
                <optgroup :label="g.cloud.toUpperCase()">
                  <template x-for="r in g.regions" :key="g.cloud + ':' + r.id">
                    <option :value="r.id" x-text="r.label ? (r.id + ' — ' + r.label) : r.id"></option>
                  </template>
                </optgroup>
              </template>
            </select>
            <input type="text" x-model="panelCfg.admission_allowed_regions"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                   placeholder="us-east-1, us-west-2, eastus">
            <p class="text-[11px] text-gray-400 mt-1">Allow-list of regions/locations/zones. Blank = no region restriction. Edit directly or use the picker above.</p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Blocked instance types</label>
            <input type="text" x-model="panelCfg.admission_denied_instance_types"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                   placeholder="p4d.24xlarge, Standard_NV48s_v3">
            <p class="text-[11px] text-gray-400 mt-1">Block-list of sizes/classes (EC2 type, Azure vm_size, GCE machine type, DB class/sku, node type).</p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Change-freeze days</label>
            <input type="text" x-model="panelCfg.admission_prod_window"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono"
                   placeholder="sat, sun">
            <p class="text-[11px] text-gray-400 mt-1">
              Weekdays (UTC) on which deploys are frozen (<code>mon</code>…<code>sun</code>). Blank = no freeze.
              Custom rules: drop a <code>.rego</code> into <code>terraform/policy/admission/</code>.
            </p>
          </div>

          <label class="flex items-start gap-2 pt-1">
            <input type="checkbox" x-model="panelCfg.admission_enforce_needs_approval"
                   class="mt-0.5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
            <span class="text-sm text-gray-700">
              Act on a policy's <span class="font-mono">needs_approval</span> verdict
              <span class="block text-[11px] text-gray-500">
                Off, a rule that returns <span class="font-mono">needs_approval</span> is
                logged and the action proceeds — the long-standing behaviour. On, the
                action is either created as a job <strong>awaiting approval</strong>
                (on a surface that can express that, such as the cloud deploy forms) or
                <strong>refused</strong>. See
                <a href="/docs/operations/scheduling/change-windows" class="text-blue-600 underline">Change
                Windows</a> for who may approve.
              </span>
              <span class="block text-[11px] text-amber-700 mt-1">
                Turning this on changes the outcome of actions that run today. If you
                have a custom rule using <span class="font-mono">needs_approval</span>
                as a soft signal, it becomes a hard gate.
              </span>
            </span>
          </label>

          <p class="text-[11px] text-amber-600">
            Requires the bundled OPA binary (in the image). With the gate on but OPA missing,
            gated deploys <strong>fail closed</strong> (403) rather than slipping through.
          </p>
        </div>
      </template>
