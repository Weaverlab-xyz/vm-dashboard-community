{# Settings slide-over panel "password_safe". Included by settings.html inside settingsPage(); the state it binds (panelCfg, panelOpen, …) lives in that page's script. #}
{%- from "partials/collapsible.html" import collapsible %}
      <template x-if="panel?.key === 'password_safe' && !panelLoading">
        <div class="space-y-4">
          <p class="text-sm text-gray-500">
            BeyondTrust Password Safe / Secrets Safe — on-demand checkout of secrets and
            managed-account credentials via the <code class="bg-gray-100 px-1 rounded">ps-cli</code>
            binary, plus onboarding of the VMs, cloud databases and Kubernetes ServiceAccount
            tokens this dashboard builds as managed systems and accounts.
          </p>
          <p class="text-sm text-gray-500">
            Shell Jump, Gateway and PRA Vault configuration lives on the
            <button type="button" @click="openPanelByKey('pra')" class="underline text-blue-600">Privileged
            Remote Access</button> panel.
          </p>
          <!-- Four tabs over what was ~1,400 lines of one scroll. Inputs in hidden tabs stay
               bound (x-show, not x-if), so Save still sends every field, and the load-bearing
               x-init defaults below still run on open. -->
          <div class="flex flex-wrap gap-x-1 border-b border-gray-200" role="tablist" x-init="panelTab = panelTab || 'connection'">
            <template x-for="t in [['connection', 'Connection'], ['vms', 'VMs'], ['databases', 'Databases'], ['kubernetes', 'Kubernetes']]" :key="t[0]">
              <button type="button" role="tab" @click="panelTab = t[0]"
                      :aria-selected="panelTab === t[0] ? 'true' : 'false'"
                      class="-mb-px px-2.5 py-2 text-sm font-medium border-b-2 transition-colors"
                      :class="panelTab === t[0]
                        ? 'border-blue-600 text-blue-700'
                        : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
                      x-text="t[1]"></button>
            </template>
          </div>
          <div x-show="panelTab === 'connection'" role="tabpanel" class="space-y-4">
          <!-- Password Safe -->
          <div>
            <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">API connection</p>
            <p class="text-xs text-gray-400 mb-3">
              Secret retrieval and managed-account credential checkout via the
              <code class="bg-gray-100 px-1 rounded">ps-cli</code> binary.
            </p>
            <div class="space-y-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password Safe URL</label>
                <input type="text" x-model="panelCfg.pscli_api_url"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="https://ps.company.com">
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">OAuth Client ID</label>
                  <input type="text" x-model="panelCfg.pscli_client_id"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">OAuth Client Secret</label>
                  <input type="password" x-model="panelCfg.pscli_client_secret"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="••••••••">
                </div>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">API run-as account <span class="text-gray-400 font-normal">(api_account_name)</span></label>
                <input type="text" x-model="panelCfg.pscli_api_account_name"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="BeyondInsight user the OAuth client runs as">
                <p class="text-xs text-gray-400 mt-1">Required for the Password Safe Terraform provider (VM managed-system onboarding).</p>
              </div>
            </div>
          </div>
          <div class="border-t border-gray-100 pt-4">
            <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Authentication</p>
            <div class="space-y-3">
              <div>
                <select x-model="panelCfg.ps_auth_mode"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                  <option value="oauth">OAuth client credentials (above, a stored secret)</option>
                  <option value="workload">Workload identity — recommended (BeyondTrust platform identity)</option>
                </select>
                <p class="text-[11px] text-gray-400 mt-1">
                  <strong>Workload identity</strong> presents this dashboard's own identity token instead of
                  a stored credential — set it up once on the
                  <button type="button" class="text-blue-600 hover:underline"
                          @click="openPanel(integrations.find(i => i.key === 'bt_platform_identity'))">BeyondTrust
                    platform identity</button> panel, and add this product to its registration's
                  <strong>Product Scopes</strong> in Pathfinder. Not yet verified live for this product.
                </p>
              </div>
              <div x-show="panelCfg.ps_auth_mode === 'workload'" x-cloak class="space-y-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Workload API URL</label>
                <input type="text" x-model="panelCfg.ps_workload_api_url"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="https://api.beyondtrust.io/site/{site}/...">
                <p class="text-[11px] text-gray-400 mt-1">
                  Where calls go on workload identity auth; <code>{site}</code> is the site ID from
                  the platform identity panel. The default is a <strong>best guess</strong> at the
                  Pathfinder gateway path — if calls answer 404 or 421, this is the field to fix
                  (it may be the product's own host instead).
                </p>
              </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">
                    Service name <span class="text-gray-400 font-normal">(optional override)</span>
                  </label>
                  <input type="text" x-model="panelCfg.ps_workload_service_name"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="(blank = the platform identity's service name)">
                </div>
                <p class="text-[11px] text-amber-700">
                  Covers the dashboard's own REST calls. ps-cli, the Secrets Safe backend, the Ansible runner and the passwordsafe Terraform provider still use the client credentials above — keep them set.
                </p>
              </div>
            </div>
          </div>
          </div>
          <div x-show="panelTab === 'vms'" role="tabpanel" class="space-y-4">
          <!-- Password Safe resource registration (optional, per-VM-deploy) -->
          <div>
            <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Resource registration (VMs)</p>
            <p class="text-xs text-gray-400 mb-3">
              Optionally onboard each built Linux VM into Password Safe as a managed system + its baked-in
              <code class="bg-gray-100 px-1 rounded">adminuser</code> account, via a per-deploy opt-in on the
              cloud deploy forms. Each cloud defaults to its cloud-native plugin (no per-VPC Resource Broker):
              <strong>AWS</strong> → <em>AWS Systems Manager</em> (over SSM), <strong>Azure</strong> →
              <em>Azure VM SSH Rotation</em> (over Run Command), <strong>GCP</strong> → <em>GCP VM SSH
              Rotation</em> (over GCE instance metadata). The functional account per cloud decides the
              management method; each cloud can be switched to the traditional SSH flow below.
            </p>
            <label class="flex items-center gap-2 text-sm text-gray-700 mb-3">
              <input type="checkbox" x-model="panelCfg.passwordsafe_registration_enabled" class="rounded text-blue-600">
              Enable Password Safe VM registration
            </label>
            <div class="space-y-3" x-show="panelCfg.passwordsafe_registration_enabled" x-cloak>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">AWS onboarding method</label>
                <select x-model="panelCfg.passwordsafe_aws_registration_method"
                        x-init="panelCfg.passwordsafe_aws_registration_method = panelCfg.passwordsafe_aws_registration_method || 'ssm'"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="ssm">AWS Systems Manager (cloud-native, recommended)</option>
                  <option value="ssh">Direct SSH (managed system / Resource Broker)</option>
                </select>
                <p class="text-xs text-gray-400 mt-1" x-show="(panelCfg.passwordsafe_aws_registration_method || 'ssm') === 'ssm'">
                  Manages Linux EC2 over AWS SSM <code class="bg-gray-100 px-1 rounded">SendCommand</code> — no SSH
                  line-of-sight needed. The AWS functional account must be the <em>AWS Systems Manager Custom Plugin</em>
                  account (password <code class="bg-gray-100 px-1 rounded">{AccessKeyID}:{AccessKeySecret}</code>), the
                  plugin must be admin-uploaded in BeyondInsight, and each instance must already be SSM-managed.
                </p>
                <p class="text-xs text-gray-400 mt-1" x-show="(panelCfg.passwordsafe_aws_registration_method || 'ssm') === 'ssh'">
                  Traditional managed system keyed by hostname/IP; pushes the VM's own SSH key and needs SSH
                  line-of-sight (Resource Broker / Gateway). GCP always uses this method (Azure has its own below).
                </p>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Azure onboarding method</label>
                <select x-model="panelCfg.passwordsafe_azure_registration_method"
                        x-init="panelCfg.passwordsafe_azure_registration_method = panelCfg.passwordsafe_azure_registration_method || 'azurevm'"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="azurevm">Azure VM SSH Rotation (cloud-native, recommended)</option>
                  <option value="ssh">Direct SSH (managed system / Resource Broker)</option>
                </select>
                <p class="text-xs text-gray-400 mt-1" x-show="(panelCfg.passwordsafe_azure_registration_method || 'azurevm') === 'azurevm'">
                  Rotates the <code class="bg-gray-100 px-1 rounded">adminuser</code> key over Azure VM
                  <code class="bg-gray-100 px-1 rounded">Run Command</code> — no SSH line-of-sight needed. The Azure
                  functional account must be the <em>Azure VM SSH Rotation Custom Plugin</em> account (username = Azure
                  app/client ID, password = client secret), the plugin must be admin-uploaded in BeyondInsight, and the
                  service principal needs <em>Virtual Machine Contributor</em> on the resource group. Managed system
                  address = <code class="bg-gray-100 px-1 rounded">tenantId/subscriptionId/resourceGroup/vmName</code>.
                </p>
                <p class="text-xs text-gray-400 mt-1" x-show="(panelCfg.passwordsafe_azure_registration_method || 'azurevm') === 'ssh'">
                  Traditional managed system keyed by hostname/IP; pushes the VM's own SSH key and needs SSH
                  line-of-sight (Resource Broker / Gateway).
                </p>
                <label class="flex items-center gap-2 text-sm text-gray-700 mt-2"
                       x-show="(panelCfg.passwordsafe_azure_registration_method || 'azurevm') === 'azurevm'">
                  <input type="checkbox" x-model="panelCfg.passwordsafe_azure_change_password_on_register" class="rounded text-blue-600">
                  Mint the first key on onboard (the baked-in <code class="bg-gray-100 px-1 rounded">adminuser</code> has no credential yet)
                </label>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">GCP onboarding method</label>
                <select x-model="panelCfg.passwordsafe_gcp_registration_method"
                        x-init="panelCfg.passwordsafe_gcp_registration_method = panelCfg.passwordsafe_gcp_registration_method || 'gcpvm'"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="gcpvm">GCP VM SSH Rotation (cloud-native, recommended)</option>
                  <option value="ssh">Direct SSH (managed system / Resource Broker)</option>
                </select>
                <p class="text-xs text-gray-400 mt-1" x-show="(panelCfg.passwordsafe_gcp_registration_method || 'gcpvm') === 'gcpvm'">
                  Rotates the <code class="bg-gray-100 px-1 rounded">adminuser</code> key by writing it into the GCE
                  instance's <code class="bg-gray-100 px-1 rounded">ssh-keys</code> metadata — no SSH line-of-sight
                  needed. The GCP functional account must be the <em>GCP VM SSH Rotation Custom Plugin</em> account
                  (username = service-account email, password = the service-account JSON key), the plugin must be
                  admin-uploaded in BeyondInsight, and the service account needs
                  <code class="bg-gray-100 px-1 rounded">roles/compute.instanceAdmin.v1</code>. <strong>OS Login must
                  be disabled</strong> on the instance (metadata <code class="bg-gray-100 px-1 rounded">ssh-keys</code>
                  is ignored when OS Login is on). Managed system address =
                  <code class="bg-gray-100 px-1 rounded">projectId/zone/instanceName</code>.
                </p>
                <p class="text-xs text-gray-400 mt-1" x-show="(panelCfg.passwordsafe_gcp_registration_method || 'gcpvm') === 'ssh'">
                  Traditional managed system keyed by hostname/IP; pushes the VM's own SSH key and needs SSH
                  line-of-sight (Resource Broker / Gateway).
                </p>
                <label class="flex items-center gap-2 text-sm text-gray-700 mt-2"
                       x-show="(panelCfg.passwordsafe_gcp_registration_method || 'gcpvm') === 'gcpvm'">
                  <input type="checkbox" x-model="panelCfg.passwordsafe_gcp_change_password_on_register" class="rounded text-blue-600">
                  Mint the first key on onboard (the baked-in <code class="bg-gray-100 px-1 rounded">adminuser</code> has no credential yet)
                </label>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Workgroup</label>
                <input type="text" x-model="panelCfg.passwordsafe_workgroup"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="workgroup name or id">
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Functional account — AWS</label>
                  <input type="text" x-model="panelCfg.passwordsafe_vm_functional_account_aws"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="name or id">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Functional account — Azure</label>
                  <input type="text" x-model="panelCfg.passwordsafe_vm_functional_account_azure"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="name or id">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Functional account — GCP</label>
                  <input type="text" x-model="panelCfg.passwordsafe_vm_functional_account_gcp"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="name or id">
                </div>
              </div>
              <div class="border border-gray-200 rounded-lg p-3 space-y-2">
                <p class="text-sm font-medium text-gray-700">Windows VMs <span class="text-gray-400 font-normal">(Azure + AWS)</span></p>
                <p class="text-xs text-gray-400">
                  The local administrator is onboarded as a <strong>password-managed</strong> account,
                  seeded with the generated password. Needs a functional account on a Windows
                  platform — not the SSH-rotation accounts above. Password Safe rotates over
                  SMB/WinRM, so private VMs need a Resource Broker.
                </p>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Functional account — Windows</label>
                    <input type="text" x-model="panelCfg.passwordsafe_vm_functional_account_windows"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="name or id">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Override — Azure</label>
                    <input type="text" x-model="panelCfg.passwordsafe_vm_functional_account_windows_azure"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="blank → Windows account">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Override — AWS</label>
                    <input type="text" x-model="panelCfg.passwordsafe_vm_functional_account_windows_aws"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="blank → Windows account">
                  </div>
                </div>
                <label class="flex items-center gap-2 text-sm text-gray-700">
                  <input type="checkbox" x-model="panelCfg.passwordsafe_windows_change_password_on_register" class="rounded text-blue-600">
                  Rotate the password on onboard, so only Password Safe knows it
                </label>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Managed account name</label>
                  <input type="text" x-model="panelCfg.passwordsafe_managed_account_name"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="adminuser">
                </div>
                <div x-show="(panelCfg.passwordsafe_aws_registration_method || 'ssm') === 'ssh' || (panelCfg.passwordsafe_azure_registration_method || 'azurevm') === 'ssh' || (panelCfg.passwordsafe_gcp_registration_method || 'gcpvm') === 'ssh'">
                  <label class="block text-sm font-medium text-gray-700 mb-1">SSH key enforcement <span class="text-gray-400 font-normal">(SSH method)</span></label>
                  <select x-model="panelCfg.passwordsafe_ssh_key_enforcement_mode"
                          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="0">0 — None</option>
                    <option value="1">1 — Auto</option>
                    <option value="2">2 — Strict</option>
                  </select>
                </div>
                <div x-show="(panelCfg.passwordsafe_aws_registration_method || 'ssm') === 'ssm'">
                  <label class="block text-sm font-medium text-gray-700 mb-1">SSM account suffix <span class="text-gray-400 font-normal">(AWS Systems Manager)</span></label>
                  <input type="text" x-model="panelCfg.passwordsafe_ssm_account_suffix"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="local">
                  <p class="text-xs text-gray-400 mt-1"><code class="bg-gray-100 px-1 rounded">local</code> for IAM-user mode; an AssumeRole ARN for EC2 cross-account mode.</p>
                </div>
              </div>
              <label class="flex items-center gap-2 text-sm text-gray-700"
                     x-show="(panelCfg.passwordsafe_aws_registration_method || 'ssm') === 'ssm'">
                <input type="checkbox" x-model="panelCfg.passwordsafe_ssm_change_password_on_register" class="rounded text-blue-600">
                Trigger an initial Change Password after onboarding (mints the first SSH key over SSM)
              </label>
              <p class="text-xs text-gray-400">
                The functional account + workgroup must already exist in Password Safe. The per-deploy opt-in
                appears as “Onboard into Password Safe” on the AWS/Azure/GCP deploy forms. For AWS Systems Manager,
                the managed system DNS name is <code class="bg-gray-100 px-1 rounded">{instance-id}:{region}</code>
                and the account name is <code class="bg-gray-100 px-1 rounded">{name};{suffix}</code>.
              </p>
              <!-- Cloud VM → PRA Vault key sync (docs/beyondtrust/password-safe.md) -->
              <div class="pt-2 border-t border-gray-100 space-y-3">
                <label class="flex items-center gap-2 text-sm text-gray-700">
                  <input type="checkbox" x-model="panelCfg.passwordsafe_vault_sync_enabled" class="rounded text-blue-600">
                  Also sync each VM's managed SSH key into a PRA Vault Private Key account
                </label>
                <label class="flex items-center gap-2 text-sm text-gray-700" x-show="panelCfg.passwordsafe_vault_sync_enabled">
                  <input type="checkbox" x-model="panelCfg.passwordsafe_vault_sync_converge" class="rounded text-blue-600">
                  Rotate once right after linking, so PRA holds a real key immediately
                </label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" x-show="panelCfg.passwordsafe_vault_sync_enabled">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">PRA Vault key platform</label>
                    <input type="text" x-model="panelCfg.passwordsafe_vault_sync_platform"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="PRA Vault Private Key">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Functional account on it</label>
                    <input type="text" x-model="panelCfg.passwordsafe_vault_sync_functional_account"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="(required — no fallback)">
                  </div>
                </div>
                <p class="text-xs text-gray-400" x-show="panelCfg.passwordsafe_vault_sync_enabled">
                  A PRA Vault SSH account named <code class="bg-gray-100 px-1 rounded">&lt;vm&gt;-&lt;account&gt;</code>
                  is associated to the VM's Asset Group and kept current by a Password Safe
                  <em>SyncedAccounts</em> link through the <em>PRA Vault Private Key</em> plugin — so the key
                  Password Safe rotates can be checked out and injected in PRA. Applies to the cloud-native
                  plugins only (AWS Systems Manager, Azure/GCP VM SSH Rotation). The functional account must be
                  on that plugin's platform; the OT and cloud-database PRA Vault accounts are a different
                  platform and are <strong>not</strong> used as a fallback.
                </p>
              </div>
              <!-- Power-state attributes (services/ps_power_attrs.py). Its own small x-data so the
                   vocabulary loader is not a settingsPage method another panel could shadow. -->
              <div class="pt-2 border-t border-gray-100 space-y-3"
                   x-data="{ vocab: [], vocabState: '', vocabError: '',
                             async loadVocab() {
                               this.vocabState = 'loading'; this.vocabError = '';
                               try {
                                 const r = await API.get('/api/password-safe/attribute-vocabulary');
                                 this.vocab = (r.types || []).filter(t => !t.read_only);
                                 this.vocabState = 'ok';
                               } catch (e) { this.vocabState = 'error'; this.vocabError = e.message || String(e); }
                             } }"
                   x-init="$watch('panelCfg.passwordsafe_power_attributes_enabled', on => { if (on && !vocabState) loadVocab(); });
                           if (panelCfg.passwordsafe_power_attributes_enabled) loadVocab();">
                <label class="flex items-center gap-2 text-sm text-gray-700">
                  <input type="checkbox" x-model="panelCfg.passwordsafe_power_attributes_enabled" class="rounded text-blue-600">
                  Set a power-state attribute when a VM is started or stopped
                </label>
                <!-- Two literal x-model bindings, not one looped select: tests/test_beyondtrust_split.py
                     finds a panel's keys by `x-model="panelCfg.<key>"`. The saved id is kept as an
                     option before the list loads, so an unloaded vocabulary cannot blank it on save. -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" x-show="panelCfg.passwordsafe_power_attributes_enabled">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">On start, apply</label>
                    <select x-model="panelCfg.passwordsafe_power_attr_online"
                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                      <option value="">(nothing)</option>
                      <template x-if="panelCfg.passwordsafe_power_attr_online && !vocab.some(t => t.values.some(v => v.attribute_id === panelCfg.passwordsafe_power_attr_online))">
                        <option :value="panelCfg.passwordsafe_power_attr_online" x-text="'Attribute id ' + panelCfg.passwordsafe_power_attr_online"></option>
                      </template>
                      <template x-for="t in vocab" :key="t.type_id">
                        <optgroup :label="t.name">
                          <template x-for="v in t.values" :key="v.attribute_id">

              <p class="text-xs text-gray-400">
                An <strong>engine</strong> override beats a <strong>cloud</strong> override, which beats the source
                above. On <strong>Azure and AWS</strong> the functional account carries <em>that database's</em> admin
                password, so <code class="bg-gray-100 px-1 rounded">reference</code> there means creating the
                account's database login on every server by hand — with a password Password Safe never hands back.
                Prefer <code class="bg-gray-100 px-1 rounded">create</code> on those two clouds; the cloud override
                is how you do that without changing GCP.
              </p>
              <p class="text-xs text-gray-400">
                The source is not really a preference — it follows whether the functional account has to carry a
                <strong>per-database</strong> secret. On GCP, <code class="bg-gray-100 px-1 rounded">data-api</code>
                (PostgreSQL, MySQL) authenticates with a short-lived IAM token and its composite is
                <code class="bg-gray-100 px-1 rounded">-:-:-</code>, so one account you own serves every database.
                <strong>SQL Server has no IAM database authentication</strong>, so it runs on
                <code class="bg-gray-100 px-1 rounded">cloud-run</code> with a real login <em>for that database</em> —
                which one shared account cannot hold. Set <code class="bg-gray-100 px-1 rounded">sqlserver</code> to
                <em>Create one per database</em> and leave the others on the source above.

              <label class="flex items-center gap-2 text-sm text-gray-700">

              </label>
              <p class="text-xs text-gray-400">
                Sets <code class="bg-gray-100 px-1 rounded">Change Password Using Own Credentials</code> on the managed
                account, so the DB plugin rotates it in place instead of calling the via-functional-account action —
                which needs a privileged DB login (<code class="bg-gray-100 px-1 rounded">CREATEROLE</code> /
                <code class="bg-gray-100 px-1 rounded">CREATE USER</code> /
                <code class="bg-gray-100 px-1 rounded">ALTER ANY LOGIN</code>) that a provisioned server does not have.
                <strong>Required</strong> with an operator-created functional account — that account is unprivileged on
                the database, so only the self-rotate action can change a credential. Keep the functional account names in
                <code class="bg-gray-100 px-1 rounded">SP:</code> form and the Azure credential comes from the account
                itself, so an off-Azure Resource Broker needs no extra setup. Their DB password segment must still be
                valid: it is unused by a self-rotate change but <em>Verify Functional Account</em> logs in with it.
              </p>

                this on and a database that has been onboarded here instead connects as its <em>own</em> Password Safe

                <strong>Grant that account first.</strong> The managed user the dashboard creates

                <strong>no privileges at all</strong> — it exists to be rotated, not to read anything — so until you
                grant it what your playbooks need, every run fails on permissions. Leave this off if you are unsure.
              </p>

                One account per engine per cloud, because a functional account belongs to a platform.

                  Oracle on RDS onboards on Password Safe's own <strong>Oracle</strong> platform, with

              Makes a cluster's PRA-injected ServiceAccount token a Password Safe managed account on the
              <code class="bg-gray-100 px-1 rounded">Kubernetes Service Account Token</code> plugin so it rotates on schedule,

              <code class="bg-gray-100 px-1 rounded">PRA Vault Token</code> plugin. Registration then <em>syncs</em> the two in
              Password Safe, so every rotation reaches PRA with nothing running on the dashboard's side.
              Importing the two plugins, creating the functional accounts, and granting the API identity Requestor + an
              auto-release access policy on the new managed accounts are one-time manual setup — see the
              <a href="/docs/beyondtrust/password-safe/kubernetes-tokens#kubernetes-serviceaccount-token-rotation" class="underline" target="_blank">token rotation guide</a>.
              <span class="text-amber-600">Neither account's access policy may enable "Change Password After
              Release"</span> — a credential change on <em>either</em> member of a synced pair re-rotates both, so a
              release-triggered change on the PRA copy would rotate the real cluster token.
            </p>
            <label class="flex items-center gap-2 mb-3 text-sm text-gray-700">
              <input type="checkbox" x-model="panelCfg.k8s_ps_token_rotation_enabled"
                     class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">

                         placeholder="PRA Vault Token">
                </div>
              </div>
              <p class="text-xs text-gray-400">Functional accounts (name or id). Per cloud: an AWS access key, an Entra service principal (<code class="bg-gray-100 px-1 rounded">SP:&lt;tenantId&gt;:&lt;clientId&gt;</code>), a GCP service-account key, or a bootstrap ServiceAccount credential for on-prem/OKE. The PRA Vault mirror's is a PRA Config-API OAuth client.</p>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">AWS Functional Account</label>

                  Register the PRA Vault Token mirror

              </div>
              <p class="text-xs text-gray-400">In-cluster rotator RBAC. The binding subject differs per cloud: AKS needs the service principal's <em>object id</em> (the plugin logs it on every run — not the client id), EKS the access-entry username + the IAM principal ARN behind the functional account's key. GKE derives the subject from the functional account's name when blank.</p>
              <p class="text-xs text-gray-400">On AKS and EKS the binding alone does not authorise anything: an AKS cluster with Azure RBAC (every cluster built here) decides from an <em>Azure role assignment</em>, and EKS from an access entry. Both are created for you when the identity below is set, and both fail only at the first rotation when they are missing — on AKS with <span class="font-mono">&quot;User does not have access to the resource in Azure&quot;</span>.</p>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <label class="flex items-center gap-2 text-sm text-gray-700 col-span-3">
                  <input type="checkbox" x-model="panelCfg.k8s_ps_rotator_apply_rbac"
                         class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                  Apply the rotator ClusterRole + binding on register
                </label>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">GKE SA Email <span class="text-gray-400 font-normal">(blank = derive)</span></label>
                  <input type="text" x-model="panelCfg.k8s_ps_rotator_gke_sa_email"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="psafe-rotator@project.iam.gserviceaccount.com">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">AKS SP Object ID</label>
                  <input type="text" x-model="panelCfg.k8s_ps_rotator_aks_sp_object_id"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="00000000-1111-2222-3333-444444444444">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">AKS Data-Plane Role <span class="text-gray-400 font-normal">(Azure RBAC)</span></label>
                  <select x-model="panelCfg.k8s_ps_rotator_aks_role"
                          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="writer">RBAC Writer (namespace-scoped)</option>
                    <option value="reader">RBAC Reader (namespace-scoped)</option>
                    <option value="admin">RBAC Admin (cluster)</option>
                    <option value="clusteradmin">RBAC Cluster Admin (cluster)</option>
                  </select>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">AKS Grant Propagation Wait <span class="text-gray-400 font-normal">(seconds)</span></label>
                  <input type="number" min="0" step="20" x-model.number="panelCfg.k8s_ps_rotator_aks_propagation_seconds"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="240">
                  <p class="text-xs text-gray-500 mt-1">A rotation refused for want of a data-plane role grants it and retries for this long. Azure can take up to five minutes to apply a new assignment.</p>
                </div>
                <label class="flex items-center gap-2 text-sm text-gray-700 col-span-3">
                  <input type="checkbox" x-model="panelCfg.k8s_ps_rotator_aks_assign_role"
                         class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                  Grant the AKS object id that role (Writer carries secrets + serviceaccounts, which covers both token modes)
                </label>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">EKS Access-Entry Username</label>
                  <input type="text" x-model="panelCfg.k8s_ps_rotator_eks_username"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="passwordsafe-rotator">
                </div>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">EKS Principal ARN <span class="text-gray-400 font-normal">(behind the FA's access key)</span></label>
                  <input type="text" x-model="panelCfg.k8s_ps_rotator_eks_principal_arn"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="arn:aws:iam::123456789012:role/PasswordSafeRotator">
                </div>
                <label class="flex items-center gap-2 text-sm text-gray-700 mt-6">
                  <input type="checkbox" x-model="panelCfg.k8s_ps_rotator_eks_create_access_entry"
                         class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                  Create the EKS access entry when the ARN is set
                </label>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Bootstrap SA Namespace <span class="text-gray-400 font-normal">(generic/on-prem)</span></label>
                  <input type="text" x-model="panelCfg.k8s_ps_rotator_bootstrap_namespace"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="beyondtrust">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Bootstrap SA Name</label>
                  <input type="text" x-model="panelCfg.k8s_ps_rotator_bootstrap_sa"
                         class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                         placeholder="password-safe-rotator">
                </div>
              </div>
              <p class="text-xs text-gray-400">
                There is nothing to tune for PS&nbsp;&rarr;&nbsp;PRA delivery: registration syncs the PRA Vault account to the
                token account in Password Safe, and a managed account and its subscribers always share a credential, so
                rotations reach PRA as part of the change itself. In LongLived mode the old token is revoked at rotation,
                so use Bound mode on clusters whose tunnel must not break — Bound never revokes, and the old token stays
                valid until its TTL.
              </p>
              <p class="text-xs text-gray-400">
                The managed account name is <code class="bg-gray-100 px-1 rounded">&lt;namespace&gt;/&lt;serviceaccount&gt;</code>,
                taken from the Kubernetes tunnel identity on the
                <button type="button" @click="openPanelByKey('pra')" class="underline text-blue-600">Privileged
                Remote Access</button> panel. Unsaved edits here are discarded when the panel switches.
              </p>
            </div>
          </div>
          </div>
        </div>
      </template>
