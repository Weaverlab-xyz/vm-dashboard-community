# Create the Portainer TEAMS that just-in-time access is granted through.
#
# Portainer grants access by putting a user IN A TEAM, so a team is both the asset and
# the role name the `portainer_access` adapter publishes to Entitle. A Portainer with
# no teams resolves no assets at all, and registering the adapter against one is
# refused — a freshly deployed node has none, which is where that refusal comes from.
#
# Idempotent: a team that already exists is matched case-insensitively (the same way
# the dashboard matches one) and left alone, never duplicated.
#
# A team on its own still grants nothing. Give it access to an environment with
# portainer-env-access.yml, or run portainer-jit-prereqs.yml, which does both.
#
# Target: Portainer — a `hosts: localhost` play that reaches OUT to the Portainer REST
# API. Nothing is installed on any host.
#
# OPTIONAL — fetch the PAT from BeyondTrust Password Safe instead of the injected one
# by setting a SECRET path (folder/title):
#   portainer_pat_secret: app-secrets/portainer-pat
#
# Connection is auto-injected when Portainer is configured (PORTAINER_URL /
# PORTAINER_PAT / PORTAINER_VERIFY_SSL); override with extra vars to use another server.
#
# extra_vars:
#   team_name:  Platform                 # one team…
#   team_names: ["Platform", "DBAs"]     # …or several (either, or both)
- name: Ensure Portainer teams exist
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    portainer_url: "{{ lookup('ansible.builtin.env', 'PORTAINER_URL') }}"
    portainer_pat: "{{ lookup('ansible.builtin.env', 'PORTAINER_PAT') }}"
    # Optional: fetch the PAT from BeyondTrust Password Safe instead of using the
    # injected one — set a SECRET path (folder/title). Blank = use PORTAINER_PAT.
    portainer_pat_secret: ""
    ps_api_url: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_API_URL') }}"
    ps_client_id: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_CLIENT_ID') }}"
    ps_client_secret: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_CLIENT_SECRET') }}"
    ps_verify_ca: true          # set false only for a self-signed Password Safe
    # A dashboard-deployed node serves a self-signed cert on :9443, so the deploy
    # turns verification off. Honour that rather than hard-coding `true`.
    portainer_verify_ssl: "{{ lookup('ansible.builtin.env', 'PORTAINER_VERIFY_SSL') | default('1', true) }}"
    team_name: ""
    team_names: []
  tasks:
    # Fetched into its OWN fact, never onto portainer_pat: extra vars outrank set_fact,
    # so writing back to that name would be silently ignored when the PAT was also
    # supplied as an extra var.
    - name: Fetch the Portainer API token from Password Safe
      ansible.builtin.set_fact:
        _ps_portainer_pat: "{{ lookup('beyondtrust.secrets_safe.secrets_safe_lookup',
          api_url=ps_api_url,
          api_version='3.1',
          retrieval_type='SECRET',
          client_id=ps_client_id,
          client_secret=ps_client_secret,
          secret_list=portainer_pat_secret,
          decrypt=True,
          verify_ca=ps_verify_ca,
          wantlist=False) }}"
      no_log: true
      when: portainer_pat_secret | length > 0

    - name: Resolve the effective token (Password Safe wins when a path was given)
      ansible.builtin.set_fact:
        _pat: "{{ _ps_portainer_pat | default(portainer_pat, true) }}"
      no_log: true

    - name: Collect the wanted team names
      ansible.builtin.set_fact:
        wanted_teams: "{{ (team_names | default([], true)) + ([team_name] if team_name | length > 0 else []) }}"

    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - portainer_url | length > 0
          - _pat | length > 0
          - wanted_teams | length > 0
        fail_msg: >-
          Set team_name (or team_names), and make sure a Portainer connection is
          configured in Settings → Containers or passed as portainer_url /
          portainer_pat extra vars.

    - name: List existing teams
      ansible.builtin.uri:
        url: "{{ portainer_url | regex_replace('/$', '') }}/api/teams"
        method: GET
        headers:
          X-API-Key: "{{ _pat }}"
        validate_certs: "{{ portainer_verify_ssl | bool }}"
        status_code: 200
      register: teams_before
      no_log: true              # the API token rides the request headers

    # Case-insensitively, because that is how the dashboard's own matcher reads the
    # list: creating "platform" beside an existing "Platform" would publish two Entitle
    # assets that look like one, and a grant would land in whichever Portainer picked.
    - name: Work out which teams are missing
      ansible.builtin.set_fact:
        missing_teams: >-
          {{ (missing_teams | default([])) + ([item] if (item | lower) not in _have_lower else []) }}
      vars:
        _have_lower: "{{ teams_before.json | map(attribute='Name') | map('lower') | list }}"
      loop: "{{ wanted_teams }}"
      loop_control:
        label: "{{ item }}"

    - name: Create the missing teams
      ansible.builtin.uri:
        url: "{{ portainer_url | regex_replace('/$', '') }}/api/teams"
        method: POST
        headers:
          X-API-Key: "{{ _pat }}"
        body_format: json
        body:
          Name: "{{ item }}"
        validate_certs: "{{ portainer_verify_ssl | bool }}"
        status_code: [200, 201]
      loop: "{{ missing_teams }}"
      loop_control:
        label: "{{ item }}"
      no_log: true              # the API token rides the request headers

    # The create is no_log, so its own failure detail is censored. Re-reading the list
    # is what turns "something was censored" back into a sentence naming the team.
    - name: Re-read the team list
      ansible.builtin.uri:
        url: "{{ portainer_url | regex_replace('/$', '') }}/api/teams"
        method: GET
        headers:
          X-API-Key: "{{ _pat }}"
        validate_certs: "{{ portainer_verify_ssl | bool }}"
        status_code: 200
      register: teams_after
      no_log: true              # the API token rides the request headers

    - name: Confirm every wanted team is there
      ansible.builtin.assert:
        that:
          - wanted_teams | map('lower') | difference(teams_after.json | map(attribute='Name') | map('lower') | list) | length == 0
        fail_msg: >-
          Still missing after the create:
          {{ wanted_teams | map('lower') | difference(teams_after.json | map(attribute='Name') | map('lower') | list) | join(', ') }}.
          Check that the API token belongs to a Portainer administrator — a standard
          user can read /api/teams and cannot create one.

    - name: Result
      ansible.builtin.debug:
        msg: >-
          {{ ('created: ' ~ (missing_teams | join(', '))) if (missing_teams | default([]) | length > 0)
             else 'nothing to do — every wanted team already existed' }}.
          Next: portainer-env-access.yml, to give a team access to an environment.
          A team with no access policy grants nothing.
