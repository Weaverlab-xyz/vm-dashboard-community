# Extend on-prem Active Directory to a cloud over a VyOS site-to-site VPN
# Target: the ON-PREM VyOS 1.4 router (SSH, network_cli), from the local runner or a
# remote agent that reaches it. The cloud side is the cloud's managed VPN (AWS
# Site-to-Site VPN, GCP HA VPN, Azure VPN Gateway): two tunnels with BGP, so a tunnel or
# cloud-endpoint failure fails over by itself. That pairing is the recommended cheap and
# reliable setup; see docs/cloud/directories.md#connecting-on-prem-ad-to-the-cloud.
#
# What it configures:
#   - one route-based IPsec tunnel (VTI) per cloud tunnel: IKEv2, AES-256-GCM, DH group 20,
#     PFS, dead-peer detection. Match the proposal to what the cloud offers.
#   - eBGP over each tunnel. Only onprem_dc_subnets are ADVERTISED, and only
#     cloud_networks are ACCEPTED, so the cloud learns the DCs and nothing else.
#   - a forward firewall from the tunnels: cloud_networks may reach onprem_dc_addresses
#     on the Active Directory ports only (DNS, Kerberos, NTP, RPC, LDAP/LDAPS, SMB,
#     kpasswd, Global Catalog, and the RPC dynamic range). Everything else is dropped.
#
# Required:
#   vyos_local_address: 203.0.113.10          # this router's public (IKE) address
#   vpn_tunnels:                              # from the cloud's VPN configuration
#     - peer_address: 198.51.100.1
#       inside_local: 169.254.10.2/30         # this side of the tunnel's inside /30
#       inside_peer: 169.254.10.1             # the cloud side (its BGP neighbour)
#       psk_secret: network/aws-vpn-tunnel1   # Password Safe SECRET path, or
#       # psk: <bind via Use a secret>
#     - peer_address: 198.51.100.2
#       inside_local: 169.254.11.2/30
#       inside_peer: 169.254.11.1
#       psk_secret: network/aws-vpn-tunnel2
#   bgp_local_asn: 65010
#   bgp_peer_asn: 64512                       # the cloud gateway's ASN
#   onprem_dc_subnets: [10.0.0.0/28]          # advertised to the cloud
#   onprem_dc_addresses: [10.0.0.10, 10.0.0.11]
#   cloud_networks: [10.8.0.0/16]             # the cloud VPC ranges
#   confirm: true                             # this changes a router
# Optional:
#   vyos_wan_interface: eth0
#   ad_rpc_ports: 49152-65535                 # narrow it if your DCs pin RPC ports
#   vpn_ike_encryption / vpn_esp_encryption: aes256gcm128   vpn_dh_group: "20"
#
# Run with --check first: vyos_config reports the diff without committing.
- name: VyOS site-to-site VPN for Active Directory
  hosts: all
  gather_facts: false
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: vyos.vyos.vyos
    confirm: false
    vyos_wan_interface: eth0
    vyos_local_address: ""
    vpn_tunnels: []
    bgp_local_asn: 0
    bgp_peer_asn: 0
    onprem_dc_subnets: []
    onprem_dc_addresses: []
    cloud_networks: []
    ad_rpc_ports: 49152-65535
    vpn_ike_encryption: aes256gcm128
    vpn_esp_encryption: aes256gcm128
    vpn_hash: sha256
    vpn_dh_group: "20"
    ad_tcp_ports: ["53", "88", "135", "389", "445", "464", "636", "3268-3269"]
    ad_udp_ports: ["53", "88", "123", "389", "464"]
    ps_api_url: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_API_URL') }}"
    ps_client_id: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_CLIENT_ID') }}"
    ps_client_secret: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_CLIENT_SECRET') }}"
    ps_verify_ca: true
  tasks:
    - name: Refuse unless confirmed, and check the required vars
      ansible.builtin.assert:
        that:
          - confirm | bool
          - vyos_local_address | length > 0
          - vpn_tunnels | length > 0
          - vpn_tunnels | length <= 4
          - bgp_local_asn | int > 0 and bgp_peer_asn | int > 0
          - onprem_dc_subnets | length > 0
          - onprem_dc_addresses | length > 0
          - cloud_networks | length > 0
        fail_msg: >-
          Set vyos_local_address, vpn_tunnels (1–4), both BGP ASNs, onprem_dc_subnets,
          onprem_dc_addresses and cloud_networks, and confirm: true — this changes a router.

    # Fetched into a private fact keyed by peer, never onto the caller's psk: extra vars
    # outrank set_fact, so writing back would be silently ignored.
    - name: Fetch tunnel keys from Password Safe
      ansible.builtin.set_fact:
        _ps_psks: >-
          {{ (_ps_psks | default({})) | combine({item.peer_address:
               lookup('beyondtrust.secrets_safe.secrets_safe_lookup',
                      api_url=ps_api_url, api_version='3.1', retrieval_type='SECRET',
                      client_id=ps_client_id, client_secret=ps_client_secret,
                      secret_list=item.psk_secret, decrypt=True, verify_ca=ps_verify_ca,
                      wantlist=False)}) }}
      loop: "{{ vpn_tunnels }}"
      when: (item.psk_secret | default('')) | length > 0
      no_log: true

    - name: Resolve each tunnel's pre-shared key (Password Safe wins when a path was given)
      ansible.builtin.set_fact:
        _psks: >-
          {{ (_psks | default([])) + [(_ps_psks | default({})).get(item.peer_address)
                                      or (item.psk | default(''))] }}
      loop: "{{ vpn_tunnels }}"
      no_log: true

    - name: Fail early if a tunnel has no key
      ansible.builtin.assert:
        that:
          - _psks | select('match', '^.{16,}$') | list | length == vpn_tunnels | length
        fail_msg: Every tunnel needs a pre-shared key of at least 16 characters (psk or psk_secret).
      no_log: true

    - name: Build the configuration (no secrets)
      ansible.builtin.set_fact:
        _config: |
          set vpn ipsec interface {{ vyos_wan_interface }}
          set vpn ipsec ike-group AD-IKE key-exchange ikev2
          set vpn ipsec ike-group AD-IKE lifetime 28800
          set vpn ipsec ike-group AD-IKE dead-peer-detection action restart
          set vpn ipsec ike-group AD-IKE dead-peer-detection interval 10
          set vpn ipsec ike-group AD-IKE dead-peer-detection timeout 30
          set vpn ipsec ike-group AD-IKE proposal 1 encryption {{ vpn_ike_encryption }}
          set vpn ipsec ike-group AD-IKE proposal 1 hash {{ vpn_hash }}
          set vpn ipsec ike-group AD-IKE proposal 1 dh-group {{ vpn_dh_group }}
          set vpn ipsec esp-group AD-ESP lifetime 3600
          set vpn ipsec esp-group AD-ESP pfs dh-group{{ vpn_dh_group }}
          set vpn ipsec esp-group AD-ESP proposal 1 encryption {{ vpn_esp_encryption }}
          set vpn ipsec esp-group AD-ESP proposal 1 hash {{ vpn_hash }}
          {% for t in vpn_tunnels %}
          set interfaces vti vti{{ loop.index0 }} address {{ t.inside_local }}
          set interfaces vti vti{{ loop.index0 }} description 'AD cloud tunnel {{ loop.index }}'
          set interfaces vti vti{{ loop.index0 }} ip adjust-mss 1350
          set vpn ipsec authentication psk AD-TUN{{ loop.index0 }} id {{ vyos_local_address }}
          set vpn ipsec authentication psk AD-TUN{{ loop.index0 }} id {{ t.peer_address }}
          set vpn ipsec site-to-site peer AD-TUN{{ loop.index0 }} authentication mode pre-shared-secret
          set vpn ipsec site-to-site peer AD-TUN{{ loop.index0 }} remote-address {{ t.peer_address }}
          set vpn ipsec site-to-site peer AD-TUN{{ loop.index0 }} local-address {{ vyos_local_address }}
          set vpn ipsec site-to-site peer AD-TUN{{ loop.index0 }} connection-type initiate
          set vpn ipsec site-to-site peer AD-TUN{{ loop.index0 }} ike-group AD-IKE
          set vpn ipsec site-to-site peer AD-TUN{{ loop.index0 }} default-esp-group AD-ESP
          set vpn ipsec site-to-site peer AD-TUN{{ loop.index0 }} vti bind vti{{ loop.index0 }}
          set protocols bgp neighbor {{ t.inside_peer }} remote-as {{ bgp_peer_asn }}
          set protocols bgp neighbor {{ t.inside_peer }} timers holdtime 30
          set protocols bgp neighbor {{ t.inside_peer }} timers keepalive 10
          set protocols bgp neighbor {{ t.inside_peer }} address-family ipv4-unicast soft-reconfiguration inbound
          set protocols bgp neighbor {{ t.inside_peer }} address-family ipv4-unicast route-map import AD-CLOUD-IN
          set protocols bgp neighbor {{ t.inside_peer }} address-family ipv4-unicast route-map export AD-DC-OUT
          set firewall ipv4 forward filter rule {{ 200 + loop.index0 }} action jump
          set firewall ipv4 forward filter rule {{ 200 + loop.index0 }} jump-target AD-CLOUD-TO-DC
          set firewall ipv4 forward filter rule {{ 200 + loop.index0 }} inbound-interface name vti{{ loop.index0 }}
          {% endfor %}
          set protocols bgp system-as {{ bgp_local_asn }}
          {% for n in onprem_dc_subnets %}
          set protocols bgp address-family ipv4-unicast network {{ n }}
          set policy prefix-list AD-DC-OUT rule {{ 10 + loop.index0 }} action permit
          set policy prefix-list AD-DC-OUT rule {{ 10 + loop.index0 }} prefix {{ n }}
          {% endfor %}
          {% for n in cloud_networks %}
          set policy prefix-list AD-CLOUD-IN rule {{ 10 + loop.index0 }} action permit
          set policy prefix-list AD-CLOUD-IN rule {{ 10 + loop.index0 }} prefix {{ n }}
          set policy prefix-list AD-CLOUD-IN rule {{ 10 + loop.index0 }} le 32
          set firewall group network-group AD-CLOUD-NETS network {{ n }}
          {% endfor %}
          set policy route-map AD-DC-OUT rule 10 action permit
          set policy route-map AD-DC-OUT rule 10 match ip address prefix-list AD-DC-OUT
          set policy route-map AD-CLOUD-IN rule 10 action permit
          set policy route-map AD-CLOUD-IN rule 10 match ip address prefix-list AD-CLOUD-IN
          {% for a in onprem_dc_addresses %}
          set firewall group address-group AD-DCS address {{ a }}
          {% endfor %}
          {% for p in ad_tcp_ports + [ad_rpc_ports] %}
          set firewall group port-group AD-TCP port {{ p }}
          {% endfor %}
          {% for p in ad_udp_ports %}
          set firewall group port-group AD-UDP port {{ p }}
          {% endfor %}
          set firewall ipv4 name AD-CLOUD-TO-DC default-action drop
          set firewall ipv4 name AD-CLOUD-TO-DC description 'Cloud to domain controllers: AD ports only'
          set firewall ipv4 name AD-CLOUD-TO-DC rule 5 action accept
          set firewall ipv4 name AD-CLOUD-TO-DC rule 5 state established
          set firewall ipv4 name AD-CLOUD-TO-DC rule 5 state related
          set firewall ipv4 name AD-CLOUD-TO-DC rule 10 action accept
          set firewall ipv4 name AD-CLOUD-TO-DC rule 10 protocol tcp
          set firewall ipv4 name AD-CLOUD-TO-DC rule 10 source group network-group AD-CLOUD-NETS
          set firewall ipv4 name AD-CLOUD-TO-DC rule 10 destination group address-group AD-DCS
          set firewall ipv4 name AD-CLOUD-TO-DC rule 10 destination group port-group AD-TCP
          set firewall ipv4 name AD-CLOUD-TO-DC rule 20 action accept
          set firewall ipv4 name AD-CLOUD-TO-DC rule 20 protocol udp
          set firewall ipv4 name AD-CLOUD-TO-DC rule 20 source group network-group AD-CLOUD-NETS
          set firewall ipv4 name AD-CLOUD-TO-DC rule 20 destination group address-group AD-DCS
          set firewall ipv4 name AD-CLOUD-TO-DC rule 20 destination group port-group AD-UDP
          set firewall ipv4 name AD-CLOUD-TO-DC rule 30 action accept
          set firewall ipv4 name AD-CLOUD-TO-DC rule 30 protocol icmp
          set firewall ipv4 name AD-CLOUD-TO-DC rule 30 source group network-group AD-CLOUD-NETS
          set firewall ipv4 name AD-CLOUD-TO-DC rule 30 destination group address-group AD-DCS

    - name: Show what will be applied (pre-shared keys are added separately and never shown)
      ansible.builtin.debug:
        msg: "{{ _config.splitlines() | map('trim') | select | list }}"

    - name: Apply and save the configuration
      vyos.vyos.vyos_config:
        lines: >-
          {{ (_config.splitlines() | map('trim') | select | list)
             + _psk_lines }}
        save: true
      vars:
        _psk_lines: >-
          {% set out = [] %}{% for t in vpn_tunnels %}{% set _ = out.append("set vpn ipsec authentication psk AD-TUN" ~ loop.index0 ~ " secret '" ~ _psks[loop.index0] ~ "'") %}{% endfor %}{{ out }}
      no_log: true              # the lines include the pre-shared keys
