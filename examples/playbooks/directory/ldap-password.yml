# Set an LDAP user's password
# Target: an on-prem directory, run through its remote agent with transport "LDAP".
# Uses the LDAP Password Modify extended operation; for Active Directory use
# ad-reset-password.yml instead (AD sets unicodePwd, which this does not).
#
# Required:
#   ldap_user_dn: uid=jdoe,ou=People,dc=example,dc=com
#   ldap_new_password_secret: app-secrets/jdoe-ldap   # a Password Safe SECRET path,
#   ldap_new_password: <or bind via Use a secret>     # or the value itself
# Optional:
#   ldap_validate_certs: true
# Supports --check.
- name: Set an LDAP password
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ldap_user_dn: ""
    ldap_new_password: ""
    ldap_new_password_secret: ""
    ldap_validate_certs: true
    ldap_server_uri: "{{ ('ldaps' if dir_use_ldaps | default(true) | bool else 'ldap') ~ '://' ~ dir_host ~ ':' ~ dir_port }}"
    ps_api_url: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_API_URL') }}"
    ps_client_id: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_CLIENT_ID') }}"
    ps_client_secret: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_CLIENT_SECRET') }}"
    ps_verify_ca: true
  tasks:
    - name: Fetch the new password from Password Safe
      ansible.builtin.set_fact:
        _ps_ldap_new_password: "{{ lookup('beyondtrust.secrets_safe.secrets_safe_lookup',
          api_url=ps_api_url,
          api_version='3.1',
          retrieval_type='SECRET',
          client_id=ps_client_id,
          client_secret=ps_client_secret,
          secret_list=ldap_new_password_secret,
          decrypt=True,
          verify_ca=ps_verify_ca,
          wantlist=False) }}"
      no_log: true
      when: ldap_new_password_secret | length > 0

    - name: Resolve the new password (Password Safe wins when a path was given)
      ansible.builtin.set_fact:
        _ldap_new_password: "{{ _ps_ldap_new_password | default(ldap_new_password, true) }}"
      no_log: true

    - name: Fail early if required vars are missing
      ansible.builtin.assert:
        that:
          - dir_host is defined and dir_host | length > 0
          - ldap_user_dn | length > 0
          - _ldap_new_password | length >= 12
        fail_msg: >-
          Set ldap_user_dn, and a new password of at least 12 characters, either
          ldap_new_password (Use a secret) or ldap_new_password_secret (a Password Safe path).

    - name: Set the password
      community.general.ldap_passwd:
        dn: "{{ ldap_user_dn }}"
        passwd: "{{ _ldap_new_password }}"
        server_uri: "{{ ldap_server_uri }}"
        bind_dn: "{{ dir_bind_dn }}"
        bind_pw: "{{ dir_bind_password }}"
        validate_certs: "{{ ldap_validate_certs }}"
      no_log: true              # the new password and the bind password
