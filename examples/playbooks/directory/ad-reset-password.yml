# Reset an Active Directory user's password
# Target: an on-prem AD directory, run through its remote agent over WinRM.
#
# Required:
#   ad_user_name: jdoe
#   ad_new_password_secret: app-secrets/jdoe-reset    # a Password Safe SECRET path,
#   ad_new_password: <or bind via Use a secret>       # or the value itself
# Optional:
#   ad_change_at_logon: true               # the user must change it at next logon
#   ad_unlock: true                        # also clear a lockout
# The new password never appears in job output. Supports --check.
- name: Reset an Active Directory password
  hosts: all
  gather_facts: false
  vars:
    ansible_connection: winrm
    ad_user_name: ""
    ad_new_password: ""
    ad_new_password_secret: ""
    ad_change_at_logon: true
    ad_unlock: true
    ps_api_url: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_API_URL') }}"
    ps_client_id: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_CLIENT_ID') }}"
    ps_client_secret: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_CLIENT_SECRET') }}"
    ps_verify_ca: true
  tasks:
    - name: Fetch the new password from Password Safe
      ansible.builtin.set_fact:
        _ps_ad_new_password: "{{ lookup('beyondtrust.secrets_safe.secrets_safe_lookup',
          api_url=ps_api_url,
          api_version='3.1',
          retrieval_type='SECRET',
          client_id=ps_client_id,
          client_secret=ps_client_secret,
          secret_list=ad_new_password_secret,
          decrypt=True,
          verify_ca=ps_verify_ca,
          wantlist=False) }}"
      no_log: true
      when: ad_new_password_secret | length > 0

    - name: Resolve the new password (Password Safe wins when a path was given)
      ansible.builtin.set_fact:
        _ad_new_password: "{{ _ps_ad_new_password | default(ad_new_password, true) }}"
      no_log: true

    - name: Fail early if required vars are missing
      ansible.builtin.assert:
        that:
          - ad_user_name | length > 0
          - _ad_new_password | length >= 12
        fail_msg: >-
          Set ad_user_name, and a new password of at least 12 characters, either
          ad_new_password (Use a secret) or ad_new_password_secret (a Password Safe path).

    - name: Set the password
      microsoft.ad.user:
        identity: "{{ ad_user_name }}"
        state: present
        password: "{{ _ad_new_password }}"
        update_password: always
        password_expired: "{{ ad_change_at_logon }}"
        account_locked: "{{ false if ad_unlock else omit }}"
        domain_server: "{{ dir_host | default(omit) }}"
        domain_username: "{{ dir_bind_dn | default(omit) }}"
        domain_password: "{{ dir_bind_password | default(omit) }}"
      no_log: true              # the new password and the bind password
