# Audit: stale and risky Active Directory user accounts (read-only)
# Target: an on-prem AD directory, run through its remote agent over WinRM.
# Changes nothing. The report is printed and recorded as job stats.
#
# Reports enabled users who:
#   - have not logged on in ad_stale_days (default 90), by lastLogonTimestamp, which AD
#     replicates lazily (up to ~14 days behind), so treat the edge of the window loosely;
#   - have never logged on;
#   - have "password never expires" set;
#   - have "password not required" set.
# Optional:
#   ad_stale_days: 90
#   ad_search_base: OU=Staff,DC=corp,DC=example,DC=com   # blank = the whole domain
- name: Audit stale and risky AD accounts
  hosts: all
  gather_facts: false
  vars:
    ansible_connection: winrm
    ad_stale_days: 90
    ad_search_base: ""
    # lastLogonTimestamp is a FILETIME: 100-ns intervals since 1601-01-01.
    _cutoff_filetime: "{{ (((now().timestamp() | int) - (ad_stale_days | int) * 86400 + 11644473600) * 10000000) | int }}"
    _enabled_users: "(objectCategory=person)(objectClass=user)(!(userAccountControl:1.2.840.113556.1.4.803:=2))"
    _checks:
      stale: "(&{{ _enabled_users }}(lastLogonTimestamp<={{ _cutoff_filetime }}))"
      never_logged_on: "(&{{ _enabled_users }}(!(lastLogonTimestamp=*)))"
      password_never_expires: "(&{{ _enabled_users }}(userAccountControl:1.2.840.113556.1.4.803:=65536))"
      password_not_required: "(&{{ _enabled_users }}(userAccountControl:1.2.840.113556.1.4.803:=32))"
  tasks:
    - name: Fail early on a bad window
      ansible.builtin.assert:
        that:
          - ad_stale_days | int > 0
        fail_msg: ad_stale_days must be a positive number of days.

    - name: Query each check
      microsoft.ad.object_info:
        ldap_filter: "{{ item.value }}"
        properties: [sAMAccountName, lastLogonTimestamp]
        search_base: "{{ ad_search_base if ad_search_base | length > 0 else omit }}"
        domain_server: "{{ dir_host | default(omit) }}"
        domain_username: "{{ dir_bind_dn | default(omit) }}"
        domain_password: "{{ dir_bind_password | default(omit) }}"
      loop: "{{ _checks | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: _found
      no_log: true              # carries the bind password

    - name: Build the report
      ansible.builtin.set_fact:
        _report: >-
          {{ _report | default({}) | combine({item.item.key:
               item.objects | map(attribute='sAMAccountName') | list | sort}) }}
      loop: "{{ _found.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: Print the report
      ansible.builtin.debug:
        msg:
          - "Window: no logon in {{ ad_stale_days }} days"
          - "{% for k, v in _report.items() %}{{ k }}: {{ v | length }}{% if not loop.last %}, {% endif %}{% endfor %}"
          - "{{ _report }}"

    - name: Record the report as job stats
      ansible.builtin.set_stats:
        data:
          ad_audit_stale_accounts: "{{ _report }}"
