# Make the k3s API server accept SPIFFE JWT-SVIDs as bearer tokens
# Target: the k3s SERVER node, after spire-agent-install.yml on the same host.
# Idempotent — re-running rewrites the config and restarts k3s only if something changed.
#
# The last piece of the chain: the API server trusts the SPIRE OIDC Discovery Provider as a
# JWT issuer, maps the SPIFFE ID in the token's `sub` to a username, and RBAC binds that
# username. A workload then reaches the cluster with a token that lives minutes and is
# written to no disk and no vault. Full argument, and what it is being compared against, in
# docs/design/workload-k8s-short-lived-token.md.
#
# NEVER LIVE-VALIDATED. This is the play in the set most likely to need adjusting, because
# it edits the API server's authentication configuration: get it wrong and the API server
# can fail to start. Read "If k3s will not come back" at the end BEFORE the first run.
#
# WHY k3s AND NOT A MANAGED CLUSTER. --authentication-config is a kube-apiserver flag, and
# this pattern needs all of it: an issuer on a private address, trusted through the SPIFFE
# bundle rather than a public CA. EKS, GKE and OKE each accept ONE public OIDC issuer for
# people (and AKS does in preview) — enough for Dex, see
# docs/design/agent-and-human-identity.md — but not this. k3s takes arbitrary API server
# flags, which is the whole reason the lab is built on it. That is a real limit on the
# pattern's reach, not a lab shortcut.
#
# SHARED WITH k3s-dex-auth.yml. Both plays keep their JWT authenticator in the one
# AuthenticationConfiguration and each replaces only its own entry (by username_prefix),
# so running either one never removes the other's.
#
# STRUCTURED AUTHENTICATION IS GA IN KUBERNETES 1.34 (apiserver.config.k8s.io/v1). On an
# older k3s the apiVersion has to be v1beta1 and the feature gate turned on; this play
# checks the server's version and refuses rather than writing a config it will reject.
#
# THE ISSUER MUST BE A HOSTNAME, NOT AN IP, AND THAT IS NOT COSMETIC.
# `spire-server x509 mint -dns <x>` writes a **DNS** SAN. Go verifies an **IP** SAN for a
# URL like https://10.0.0.5:8443, so an IP issuer fails TLS verification at the API server
# no matter how correct the trust bundle is — and the error reads as a bad CA, which sends
# you looking in the wrong place entirely. So the provider is minted for a hostname
# (oidc.<trust-domain>) and this play writes the /etc/hosts entry that resolves it to
# `spire_oidc_host_ip`. Leave that blank only if the name already resolves in real DNS.
#
# THE USERNAME PREFIX IS MANDATORY AND IT BECOMES PART OF EVERY BINDING. Kubernetes
# requires a prefix on any claim mapping that is not `email`, so the RBAC subject is
# "<prefix><spiffe id>" — by default "spiffe:spiffe://td/path", which looks odd and is
# correct. Read the binding rather than assuming the name; docs/kubernetes.md records the
# same trap costing hours when Entitle silently rewrote an email into its subject.
#
# extra_vars:
#   oidc_issuer_url: https://10.0.0.10:8443    # REQUIRED — from spire-oidc-provider.yml
#   trust_bundle_pem: ""                       # REQUIRED — from spire-k8s-entry.yml
#   workload_spiffe_id: ""                     # REQUIRED — the full spiffe:// URI
#   audience: k8s                              # MUST match the entry and the workload
#   username_prefix: "spiffe:"
#   workload_role: view                        # a ClusterRole that already exists
#   exec_auth_version: 0.3.0                   # spiffe/k8s-spiffe-workload-jwt-exec-auth
#   exec_auth_sha256: ""                       # overrides the pinned checksum table
#   spire_allow_unpinned: false                # true = take an unpinned version on TLS alone
#   workload_user: deploy-bot                  # gets the kubeconfig
- name: Accept SPIFFE JWT-SVIDs at the k3s API server
  hosts: all
  become: true
  vars:
    oidc_issuer_url: ""
    trust_bundle_pem: ""
    workload_spiffe_id: ""
    audience: "k8s"
    username_prefix: "spiffe:"
    workload_role: "view"
    # The exec credential plugin. Upstream publishes goreleaser archives
    # (k8s-spiffe-workload-jwt-exec-auth_Linux_<x86_64|arm64>.tar.gz, tag v<version>), not
    # bare binaries -- the old `-linux-amd64` URL never existed. SHA-256 per version and
    # architecture, checked against the release's own <name>_<version>_checksums.txt; a
    # version not in this table is REFUSED unless exec_auth_sha256 or
    # spire_allow_unpinned is set.
    exec_auth_version: "0.3.0"
    exec_auth_sha256: ""
    exec_auth_checksums:
      "0.3.0":
        x86_64: 0f55d73172b8f18eb4a567f59b3c9e0a84190dca4d5dd536fc90206f0339f2f2
        arm64: 41ec47018a42910e3723a2c40da872f268a697aa8df1c2cc40d5df42a9900ecd
    spire_allow_unpinned: false
    workload_user: "deploy-bot"
    # The SPIRE host's address, for the /etc/hosts entry below. Blank skips it, for a lab
    # whose issuer hostname already resolves in DNS.
    spire_oidc_host_ip: ""
    k3s_server_dir: /var/lib/rancher/k3s/server
    auth_config: /var/lib/rancher/k3s/server/spiffe-auth-config.yaml
    bundle_path: /var/lib/rancher/k3s/server/tls/spiffe-bundle.pem
    # A drop-in, NOT config.yaml itself: k3s merges everything in config.yaml.d, so this
    # cannot clobber flags an operator or k3s-server-init.yml already set there.
    dropin: /etc/rancher/k3s/config.yaml.d/10-spiffe-auth.yaml
    exec_auth_bin: /usr/local/bin/k8s-spiffe-workload-jwt-exec-auth
    # Each version unpacks into its own directory and exec_auth_bin is a symlink to it, so
    # an upgrade is a new directory plus a re-pointed link, never an overwrite in place.
    exec_auth_root: /opt/k8s-spiffe-workload-jwt-exec-auth
  tasks:
    - name: Require the issuer, the bundle and the identity
      ansible.builtin.assert:
        that:
          - oidc_issuer_url is match('^https://')
          - "'BEGIN CERTIFICATE' in trust_bundle_pem"
          - workload_spiffe_id is match('^spiffe://')
          - audience | length > 0
        fail_msg: >-
          oidc_issuer_url (https, from spire-oidc-provider.yml), trust_bundle_pem (the
          PEM itself, from spire-k8s-entry.yml) and workload_spiffe_id (the full
          spiffe:// URI) are all required. The issuer must be https and must be spelled
          EXACTLY as the discovery document advertises it — Kubernetes matches the
          issuer string, so a trailing slash or a swapped host rejects every token with
          no useful message.

    - name: Confirm k3s is running here
      ansible.builtin.command: systemctl is-active k3s
      register: k3s_state
      changed_when: false
      failed_when: false

    - name: Fail when this is not a k3s server
      ansible.builtin.fail:
        msg: >-
          k3s is not active on this host (systemctl is-active k3s said
          '{{ k3s_state.stdout | default("nothing") }}'). Run k3s-server-init.yml first —
          this play edits the API server's configuration and has nothing to edit yet.
      when: k3s_state.stdout != "active"

    - name: Read the k3s version
      ansible.builtin.command: k3s --version
      register: k3s_version_out
      changed_when: false

    # Structured authentication went GA in 1.34 as apiserver.config.k8s.io/v1. Writing a v1
    # document to an older API server makes it reject the file and fail to start, which on a
    # single-node cluster means no API to fix it from. Refused up front instead.
    - name: Require Kubernetes 1.34 or newer
      ansible.builtin.assert:
        that:
          - _k8s_minor | int >= 34
        fail_msg: >-
          This host runs Kubernetes {{ _k8s_minor }}, and apiserver.config.k8s.io/v1
          AuthenticationConfiguration is GA in 1.34. On an older release the apiVersion
          must be v1beta1 and the StructuredAuthenticationConfiguration feature gate
          turned on — both deliberately out of scope here, because a rejected config
          file stops the API server on a single-node cluster.
      vars:
        _k8s_minor: >-
          {{ (k3s_version_out.stdout | regex_search('v1\.(\d+)\.', '\\1') | first) | default(0, true) }}

    - name: Resolve the issuer hostname to the SPIRE host
      ansible.builtin.lineinfile:
        path: /etc/hosts
        # Anchored on the NAME, so a changed address rewrites the entry instead of
        # appending a second one that /etc/hosts resolution order decides between.
        regexp: '\s{{ _issuer_host | regex_escape }}(\s|$)'
        line: "{{ spire_oidc_host_ip }} {{ _issuer_host }}"
        state: present
      when:
        - spire_oidc_host_ip | length > 0
        - _issuer_host is not match('^[0-9.]+$')
      vars:
        _issuer_host: "{{ oidc_issuer_url | regex_replace('^https://([^:/]+).*$', '\\1') }}"

    - name: Write the SPIFFE trust bundle for the API server
      ansible.builtin.copy:
        dest: "{{ bundle_path }}"
        content: "{{ trust_bundle_pem }}"
        mode: "0600"
      notify: Restart k3s

    # certificateAuthority is why no public CA is involved: the provider serves TLS with an
    # SVID that SPIRE issued, so the same bundle that validates the token validates the
    # connection the keys arrived over.
    #
    # claimMappings.username.prefix is REQUIRED by Kubernetes for any claim other than
    # email. The resulting username is what every binding below has to name.
    - name: Describe this play's JWT authenticator
      ansible.builtin.set_fact:
        _own_jwt:
          issuer:
            url: "{{ oidc_issuer_url }}"
            audiences: ["{{ audience }}"]
            certificateAuthority: "{{ trust_bundle_pem }}"
          claimMappings:
            username:
              claim: sub
              prefix: "{{ username_prefix }}"
          claimValidationRules:
            # Belt and braces with `audiences` above: the audience is the only thing
            # stopping a token minted for another relying party being replayed here.
            - claim: aud
              requiredValue: "{{ audience }}"

    # ── ONE FILE, MORE THAN ONE AUTHENTICATOR ────────────────────────────────
    # k3s takes a single --authentication-config, and k3s-dex-auth.yml puts its own JWT
    # authenticator in the same file. So this play no longer writes the file whole: it
    # reads what is there and replaces only the entry it OWNS (appending it the first
    # time), leaving every other authenticator exactly where it was. Ownership
    # is the username prefix — Kubernetes rejects unknown fields in this file, so there is
    # nowhere to put a marker, and keying by prefix (not issuer) means a re-run with a new
    # issuer REPLACES its old entry instead of leaving a stale second one beside it.
    # The file keeps its historical spiffe- name so a node linked before this change is
    # updated in place and never ends up with two authentication-config flags.
    - name: Read the current AuthenticationConfiguration, if there is one
      ansible.builtin.slurp:
        src: "{{ auth_config }}"
      register: _auth_existing
      failed_when: false

    # In PLACE, not removed-and-appended: if each play moved its entry to the end, running
    # them alternately would reorder the file every time and restart k3s for nothing.
    - name: Put this play's authenticator where its old one was
      ansible.builtin.set_fact:
        _other_jwt: >-
          {{ _existing_jwt | zip(_prefixes) | rejectattr('1', 'equalto', username_prefix)
             | map('first') | list }}
        _new_jwt: >-
          {{ _existing_jwt[:(_at | int)]
             + [_own_jwt]
             + (_existing_jwt[(_at | int) + 1:] | zip(_prefixes[(_at | int) + 1:])
                | rejectattr('1', 'equalto', username_prefix) | map('first') | list) }}
      vars:
        _existing_jwt: >-
          {{ (((_auth_existing.content | b64decode | from_yaml) or {}).get('jwt') or [])
             if _auth_existing.content is defined else [] }}
        _prefixes: >-
          {{ _existing_jwt | map(attribute='claimMappings.username.prefix', default='') | list }}
        _at: >-
          {{ _prefixes.index(username_prefix) if username_prefix in _prefixes else _existing_jwt | length }}

    - name: Write the AuthenticationConfiguration
      ansible.builtin.copy:
        dest: "{{ auth_config }}"
        mode: "0600"
        content: "{{ _auth_doc | to_nice_yaml(indent=2) }}"
      vars:
        _auth_doc:
          apiVersion: apiserver.config.k8s.io/v1
          kind: AuthenticationConfiguration
          jwt: "{{ _new_jwt }}"
      notify: Restart k3s

    - name: Create the drop-in directory
      ansible.builtin.file:
        path: /etc/rancher/k3s/config.yaml.d
        state: directory
        mode: "0755"

    - name: Point the API server at it
      ansible.builtin.copy:
        dest: "{{ dropin }}"
        mode: "0600"
        content: |
          # Managed by k3s-spiffe-auth.yml and k3s-dex-auth.yml, which share the file it
          # names. A drop-in rather than config.yaml, so flags set elsewhere survive.
          kube-apiserver-arg:
            - "authentication-config={{ auth_config }}"
      notify: Restart k3s

    - name: Apply the restart before touching the API
      ansible.builtin.meta: flush_handlers

    - name: Wait for the API to serve again
      ansible.builtin.wait_for:
        port: 6443
        host: 127.0.0.1
        timeout: 180

    - name: Resolve the RBAC username
      ansible.builtin.set_fact:
        _rbac_user: "{{ username_prefix }}{{ workload_spiffe_id }}"

    # Written as a manifest and applied, rather than `kubectl create clusterrolebinding`,
    # so a re-run is an update instead of an AlreadyExists failure.
    - name: Write the RBAC binding
      ansible.builtin.copy:
        dest: "{{ k3s_server_dir }}/spiffe-rbac.yaml"
        mode: "0600"
        content: |
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: spiffe-workload
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: {{ workload_role }}
          subjects:
          - apiGroup: rbac.authorization.k8s.io
            kind: User
            name: "{{ _rbac_user }}"

    - name: Bind the SPIFFE identity to a role
      ansible.builtin.command: >-
        k3s kubectl apply -f {{ k3s_server_dir }}/spiffe-rbac.yaml
      register: rbac_apply
      changed_when: "'unchanged' not in rbac_apply.stdout"

    # ── the client half ──────────────────────────────────────────────────────
    - name: Map the CPU architecture to the plugin's release asset
      ansible.builtin.set_fact:
        _ea_arch: "{{ {'x86_64': 'x86_64', 'aarch64': 'arm64'}[ansible_facts['architecture']] | default('') }}"

    - name: Resolve the pinned plugin checksum
      ansible.builtin.set_fact:
        _ea_sha256: >-
          {{ exec_auth_sha256 if exec_auth_sha256 | length > 0
             else (exec_auth_checksums[exec_auth_version][_ea_arch] | default('')
                   if exec_auth_version in exec_auth_checksums else '') }}
        _ea_dir: "{{ exec_auth_root }}/{{ exec_auth_version }}"

    - name: Refuse an unverified plugin download
      ansible.builtin.assert:
        that:
          - _ea_arch | length > 0
          - _ea_sha256 | length > 0 or spire_allow_unpinned | bool
        fail_msg: >-
          No pinned SHA-256 for exec credential plugin {{ exec_auth_version }} on
          {{ ansible_facts['architecture'] }}. Add it to exec_auth_checksums in this play
          (from the release's k8s-spiffe-workload-jwt-exec-auth_{{ exec_auth_version }}_checksums.txt),
          pass exec_auth_sha256, or set spire_allow_unpinned to take it on TLS alone.

    - name: Create the plugin's version directory
      ansible.builtin.file:
        path: "{{ _ea_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # A failure here FAILS the play. It used to be swallowed, because the asset URL was a
    # guess; with the real asset and a pinned checksum, a failed download is a network
    # fault or a tampered file, and neither should report success.
    - name: Download the exec credential plugin
      ansible.builtin.get_url:
        url: >-
          https://github.com/spiffe/k8s-spiffe-workload-jwt-exec-auth/releases/download/v{{ exec_auth_version }}/k8s-spiffe-workload-jwt-exec-auth_Linux_{{ _ea_arch }}.tar.gz
        dest: "{{ _ea_dir }}/plugin.tar.gz"
        checksum: "{{ ('sha256:' ~ _ea_sha256) if _ea_sha256 | length > 0 else omit }}"
        mode: "0640"

    - name: Warn when the plugin was not checksummed
      ansible.builtin.debug:
        msg: >-
          spire_allow_unpinned is set and no checksum is pinned for exec credential plugin
          {{ exec_auth_version }}, so it was taken on TLS alone.
      when: _ea_sha256 | length == 0

    - name: Unpack the plugin binary
      ansible.builtin.unarchive:
        src: "{{ _ea_dir }}/plugin.tar.gz"
        dest: "{{ _ea_dir }}"
        remote_src: true
        include: [k8s-spiffe-workload-jwt-exec-auth]
        owner: root
        group: root
        mode: "0755"
        creates: "{{ _ea_dir }}/k8s-spiffe-workload-jwt-exec-auth"

    - name: Point the plugin path at this version
      ansible.builtin.file:
        src: "{{ _ea_dir }}/k8s-spiffe-workload-jwt-exec-auth"
        dest: "{{ exec_auth_bin }}"
        state: link
        force: true

    - name: Read the cluster CA for the workload's kubeconfig
      ansible.builtin.slurp:
        src: "{{ k3s_server_dir }}/tls/server-ca.crt"
      register: k3s_ca

    - name: Resolve this node's API address
      ansible.builtin.set_fact:
        _api_addr: "{{ ansible_facts['default_ipv4']['address'] }}"

    - name: Ensure the kubeconfig directory belongs to the workload
      ansible.builtin.file:
        path: "/home/{{ workload_user }}/.kube"
        state: directory
        owner: "{{ workload_user }}"
        mode: "0700"

    # No token, no client certificate, no secret of any kind in this file — which is the
    # entire point. It names a command; the command asks the Workload API.
    - name: Write the workload's kubeconfig
      ansible.builtin.copy:
        dest: "/home/{{ workload_user }}/.kube/config"
        owner: "{{ workload_user }}"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Config
          clusters:
          - name: k3s
            cluster:
              server: https://{{ _api_addr }}:6443
              certificate-authority-data: {{ k3s_ca.content }}
          contexts:
          - name: spiffe
            context:
              cluster: k3s
              user: spiffe-workload
          current-context: spiffe
          users:
          - name: spiffe-workload
            user:
              exec:
                apiVersion: "client.authentication.k8s.io/v1"
                command: "{{ exec_auth_bin }}"
                interactiveMode: Never
                # The plugin's default waits forever for the Workload API; kubectl would
                # hang with it rather than fail.
                args: ["-timeout=10s"]
                env:
                - name: SPIFFE_JWT_AUDIENCE
                  value: "{{ audience }}"

    - name: What was built
      ansible.builtin.debug:
        msg:
          - "The k3s API server now accepts JWT-SVIDs from {{ oidc_issuer_url }}."
          - "Audience:      {{ audience }}   (entry, API server and workload must agree)"
          - "RBAC subject:  {{ _rbac_user }}"
          - "Bound to:      ClusterRole/{{ workload_role }}"
          - "Kubeconfig:    /home/{{ workload_user }}/.kube/config — it holds NO credential."
          - "Prove it end to end, as the workload:"
          - "  sudo -u {{ workload_user }} kubectl get pods -A"
          - "Then prove the audience is load-bearing — this MUST be rejected:"
          - "  sudo -u {{ workload_user }} env SPIFFE_JWT_AUDIENCE=wrong kubectl get pods -A"
          - "A 401 on the first attempt is almost always the issuer string or the clock:"
          - "  journalctl -u k3s | grep -i 'authentication\\|oidc\\|jwt'"
          - "IF K3S WILL NOT COME BACK: delete {{ dropin }} and run"
          - "  systemctl restart k3s"
          - "That removes the flag and leaves the cluster exactly as it was. The config"
          - "file and the binding are inert on their own."
  handlers:
    - name: Restart k3s
      ansible.builtin.systemd:
        name: k3s
        state: restarted
        daemon_reload: true
