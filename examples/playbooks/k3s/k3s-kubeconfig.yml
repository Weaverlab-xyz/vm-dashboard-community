# Collect the k3s admin kubeconfig, ready to register in the dashboard
# Target: a k3s SERVER node. Read-only on the cluster — it only reads a file.
#
# k3s writes /etc/rancher/k3s/k3s.yaml with `server: https://127.0.0.1:6443`, which is
# useless to anything off-box. This rewrites it to the node's reachable address, which
# is exactly the field the dashboard parses when you register the cluster
# (clusters[].cluster.server) — register the loopback version and you get a cluster
# nothing can reach.
#
# CLUSTER-ADMIN WARNING: this kubeconfig is a client certificate with full
# cluster-admin, and the dashboard stores and uses registered kubeconfigs VERBATIM (no
# token is minted for a cloud=local cluster). A k3s client cert cannot be revoked
# without re-issuing the cluster CA. For anything beyond a lab, mint a dedicated
# ServiceAccount with a scoped ClusterRole and build a kubeconfig from its token
# instead — that one you can delete.
#
# extra_vars (optional, via the local runner):
#   api_address: 10.0.0.11         # address to write into the kubeconfig;
#                                  # default = the host's primary IPv4
#   api_port: 6443
#   cluster_name: onprem-k3s       # name suggested for the dashboard registration
#   kubeconfig_secret: infra/k3s-kubeconfig   # store it here instead of printing
#   kubeconfig_safe: Automation               # the Secrets Safe safe holding it
#
# WRITING REQUIRES CREATE RIGHTS on kubeconfig_safe, and the safe/folder must already
# exist — password-safe/onboard-safe-and-account.yml creates them.
- name: Collect the k3s admin kubeconfig
  hosts: all
  become: true
  vars:
    api_address: ""
    api_port: 6443
    cluster_name: "onprem-k3s"
    # Optional Password Safe destination (blank = print the kubeconfig instead).
    kubeconfig_secret: ""
    kubeconfig_safe: "Automation"
    ps_api_url: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_API_URL') }}"
    ps_client_id: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_CLIENT_ID') }}"
    ps_client_secret: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_CLIENT_SECRET') }}"
    ps_verify_ca: true          # set false only for a self-signed Password Safe
  tasks:
    - name: Validate the Password Safe destination
      ansible.builtin.assert:
        that:
          - "'/' in kubeconfig_secret or kubeconfig_secret | length == 0"
          - ps_api_url | length > 0 or kubeconfig_secret | length == 0
        fail_msg: >-
          kubeconfig_secret must be 'folder/title', and writing needs the
          PASSWORD_SAFE_* credentials (auto-injected when BeyondTrust is configured).

    - name: Confirm this host is a k3s server
      ansible.builtin.command: systemctl is-active k3s
      register: k3s_state
      changed_when: false
      failed_when: false

    - name: Fail if this is not a server
      ansible.builtin.fail:
        msg: >-
          The admin kubeconfig only exists on a SERVER node, and the k3s service here
          reports '{{ k3s_state.stdout | default("absent") }}'. Target a control-plane node.
      when: k3s_state.stdout != "active"

    - name: Read the admin kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_raw

    - name: Resolve the reachable API address
      ansible.builtin.set_fact:
        _api_addr: "{{ api_address | default(ansible_facts['default_ipv4']['address'], true) }}"

    # Rewrite the loopback server address. Done on the parsed document rather than by
    # regex so the result is guaranteed well-formed YAML with exactly one server value.
    - name: Rewrite the server address
      ansible.builtin.set_fact:
        _kubeconfig: >-
          {{ (kubeconfig_raw.content | b64decode | from_yaml)
             | combine({'clusters': [
                 (kubeconfig_raw.content | b64decode | from_yaml).clusters[0]
                 | combine({'cluster':
                     (kubeconfig_raw.content | b64decode | from_yaml).clusters[0].cluster
                     | combine({'server': 'https://' ~ _api_addr ~ ':' ~ api_port })})
               ]}) | to_nice_yaml }}
      no_log: true

    # ── Store in Password Safe (optional) ────────────────────────────────────
    # delegate_to: localhost is load-bearing — secrets_create is a MODULE, and only
    # the runner container has beyondtrust-bips-library.
    - name: Store the kubeconfig in Password Safe
      beyondtrust.secrets_safe.secrets_create:
        api_url: "{{ ps_api_url }}"
        api_version: "3.1"
        client_id: "{{ ps_client_id }}"
        client_secret: "{{ ps_client_secret }}"
        verify_ca: "{{ ps_verify_ca }}"
        safe_name: "{{ kubeconfig_safe }}"
        folder_name: "{{ kubeconfig_secret.split('/')[:-1] | join('/') }}"
        title: "{{ kubeconfig_secret.split('/') | last }}"
        secret_type: "text"
        text: "{{ _kubeconfig }}"
      delegate_to: localhost
      become: false
      no_log: true
      when: kubeconfig_secret | length > 0

    # ── Registration instructions ────────────────────────────────────────────
    - name: Next step (kubeconfig stored in Password Safe)
      ansible.builtin.debug:
        msg:
          - "Kubeconfig stored at '{{ kubeconfig_secret }}' in safe '{{ kubeconfig_safe }}'."
          - "API server: https://{{ _api_addr }}:{{ api_port }}"
          - "Register it on the dashboard's Kubernetes page (Register a cluster), or:"
          - "  POST /api/k8s/clusters"
          - "  {\"name\": \"{{ cluster_name }}\", \"cloud\": \"local\", \"kubeconfig\": \"<the stored YAML>\"}"
          - "The cluster name must be unique across the dashboard."
      when: kubeconfig_secret | length > 0

    - name: Next step (kubeconfig printed — nothing was stored)
      ansible.builtin.debug:
        msg:
          - "API server: https://{{ _api_addr }}:{{ api_port }}"
          - "Register this on the dashboard's Kubernetes page (Register a cluster) with"
          - "cloud='local' and the YAML below. The name must be unique across the dashboard."
          - "Set kubeconfig_secret next time to store it instead of printing it."
          - "--- kubeconfig ---"
          - "{{ _kubeconfig }}"
      when: kubeconfig_secret | length == 0
