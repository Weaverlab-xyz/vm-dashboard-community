# Install the first k3s control-plane node (server)
# Target: an on-prem Linux host. Idempotent — a host already running k3s is left alone.
#
# This is step 1 of 2. It prints (or stores) the node token; feed that into k3s-join.yml
# on every other node. k3s bundles its own CNI, so there is no separate networking step.
#
# NEEDS EGRESS to get.k3s.io — the official install script is fetched over HTTPS.
# Air-gapped installs (pre-staged binary + images) are out of scope for this sample.
#
# TOKEN HANDLING — two modes, matching examples/playbooks/swarm/:
#
#   1. WRITE TO PASSWORD SAFE (recommended). Set node_token_secret to a folder/title
#      and the token is stored there instead of printed; k3s-join.yml reads it back
#      with the SAME path. The token never appears in any job output.
#   2. PRINT (default). With no path set, the token is printed so you can paste it into
#      k3s-join.yml. Anyone who can see the job and reach :6443 can then join a node.
#
# extra_vars (optional, via the local runner):
#   k3s_version: v1.30.5+k3s1     # pin the release; blank = latest stable
#   cluster_init: false           # true = start an HA embedded-etcd cluster, so
#                                 #        additional SERVERS can join later
#   advertise_addr: 10.0.0.11     # address other nodes reach this server on;
#                                 # default = the host's primary IPv4
#   server_args: ""               # extra flags, e.g. "--disable traefik"
#   node_token_secret: infra/k3s-node-token   # store the token here
#   token_safe: Automation                    # the Secrets Safe safe holding it
#
# WRITING REQUIRES CREATE RIGHTS on token_safe, beyond the read scope the lookup
# samples need, and the safe/folder must already exist —
# password-safe/onboard-safe-and-account.yml creates them. The management modules'
# argument names vary by Password Safe version; verify secrets_create against the
# collection docs before relying on it.
- name: Install the first k3s server
  hosts: all
  become: true
  vars:
    k3s_version: ""
    cluster_init: false
    advertise_addr: ""
    server_args: ""
    # Optional Password Safe destination (blank = print the token instead).
    node_token_secret: ""
    token_safe: "Automation"
    ps_api_url: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_API_URL') }}"
    ps_client_id: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_CLIENT_ID') }}"
    ps_client_secret: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_CLIENT_SECRET') }}"
    ps_verify_ca: true          # set false only for a self-signed Password Safe
  tasks:
    - name: Validate the Password Safe destination
      ansible.builtin.assert:
        that:
          - "'/' in node_token_secret or node_token_secret | length == 0"
          - ps_api_url | length > 0 or node_token_secret | length == 0
        fail_msg: >-
          node_token_secret must be 'folder/title', and writing needs the
          PASSWORD_SAFE_* credentials (auto-injected when BeyondTrust is configured).

    - name: Detect k3s
      ansible.builtin.command: systemctl is-active k3s
      register: k3s_state
      changed_when: false
      failed_when: false

    - name: Report an existing installation
      ansible.builtin.debug:
        msg: >-
          k3s is already active here — leaving it untouched. Run k3s-status.yml to
          inspect it, or k3s-uninstall.yml to remove it first.
      when: k3s_state.stdout == "active"

    - name: Resolve this server's advertised address
      ansible.builtin.set_fact:
        _api_addr: "{{ advertise_addr | default(ansible_facts['default_ipv4']['address'], true) }}"

    # ── Install ──────────────────────────────────────────────────────────────
    # The installer is idempotent-ish but re-runs restart the service, so it is
    # guarded on the state probe rather than `creates:` — that way a version bump
    # is not silently skipped when the binary already exists.
    - name: Install k3s (server)
      ansible.builtin.shell:
        cmd: >-
          curl -sfL https://get.k3s.io | sh -s - server
          --advertise-address {{ _api_addr }}
          --tls-san {{ _api_addr }}
          {{ '--cluster-init' if cluster_init | bool else '' }}
          {{ server_args }}
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      register: k3s_install
      changed_when: k3s_install.rc == 0
      when: k3s_state.stdout != "active"

    - name: Wait for the API to serve
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ _api_addr }}"
        timeout: 180

    - name: Read the node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token_raw

    - name: Decode the node token
      ansible.builtin.set_fact:
        _node_token: "{{ node_token_raw.content | b64decode | trim }}"
      no_log: true

    # ── Store the token in Password Safe (optional) ──────────────────────────
    # delegate_to: localhost is load-bearing. secrets_create is a MODULE, not a
    # lookup, so by default it would execute on this k3s node — which has no
    # beyondtrust-bips-library. Only the runner container does.
    - name: Store the node token in Password Safe
      beyondtrust.secrets_safe.secrets_create:
        api_url: "{{ ps_api_url }}"
        api_version: "3.1"
        client_id: "{{ ps_client_id }}"
        client_secret: "{{ ps_client_secret }}"
        verify_ca: "{{ ps_verify_ca }}"
        safe_name: "{{ token_safe }}"
        folder_name: "{{ node_token_secret.split('/')[:-1] | join('/') }}"
        title: "{{ node_token_secret.split('/') | last }}"
        secret_type: "text"
        text: "{{ _node_token }}"
      delegate_to: localhost
      become: false
      no_log: true
      when: node_token_secret | length > 0

    # ── Tell the operator what to do next ────────────────────────────────────
    - name: Join instructions (token stored in Password Safe)
      ansible.builtin.debug:
        msg:
          - "k3s server ready at https://{{ _api_addr }}:6443"
          - "The node token is stored at '{{ node_token_secret }}' in safe '{{ token_safe }}'."
          - "Run k3s-join.yml against each node with:"
          - "  server_url:        https://{{ _api_addr }}:6443"
          - "  node_token_secret: {{ node_token_secret }}"
          - "  node_role:         agent   (or 'server' for another control-plane node)"
          - "Then run k3s-kubeconfig.yml here to collect the admin kubeconfig."
      when: node_token_secret | length > 0

    - name: Join instructions (token printed — nothing was stored)
      ansible.builtin.debug:
        msg:
          - "k3s server ready at https://{{ _api_addr }}:6443"
          - "Run k3s-join.yml against each node with:"
          - "  server_url: https://{{ _api_addr }}:6443"
          - "  node_token: {{ _node_token }}"
          - "  node_role:  agent   (or 'server' for another control-plane node)"
          - "Then run k3s-kubeconfig.yml here to collect the admin kubeconfig."
          - "Set node_token_secret next time to store the token instead of printing it."
      when: node_token_secret | length == 0
