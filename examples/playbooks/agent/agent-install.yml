# Install the MCP agent worker onto a dashboard-deployed Linux VM.
# Target: a host that is ALREADY a SPIRE agent node — run the spire/ plays first, so the
# workload API socket exists for this worker to attest against. Idempotent.
#
# WHAT THIS IS FOR. The agent demo cell needs a non-human principal that reads the estate
# and can be stopped while somebody watches. This play puts that worker on a host and
# under systemd; api/agentcell.py mints the PAT it spends and records what was issued.
#
# THE TOKEN ARRIVES AS AN EXTRA VAR AND LANDS IN A 0600 FILE, never in the unit and never
# in the environment. An Environment= line in a systemd unit is world-readable through
# `systemctl show`, and an env var is readable from /proc/<pid>/environ by anything running
# as the same user. `no_log` keeps it out of the run output as well — the same discipline
# spire-admin-identity.yml uses for the PKCS#12 passphrase.
#
# THE WORKER IS NOT GIVEN A ROUTE IT DOES NOT NEED. It talks to exactly two things: the
# dashboard's /mcp endpoint and the local SPIRE workload API socket. It is not given cloud
# credentials, a kubeconfig, or SSH anywhere, because the cell's argument is that a
# non-human principal should hold the least it can and spend it visibly.
#
# NEEDS EGRESS to the dashboard's MCP endpoint, and the `mcp` Python client on the host.
# The play installs the client from pip; on an air-gapped host, pre-bake it instead and
# set agent_skip_pip=true.
#
# NEVER LIVE-VALIDATED — see docs/profiles/demo/agent-demo-cell.md.
#
# extra_vars:
#   agent_mcp_url:      https://dashboard.example/mcp   # REQUIRED
#   agent_token_source: file | wlc | ps                 # default file
#   agent_token:        vmcli_<64hex>                   # REQUIRED when source is `file`
#
#   # `wlc` and `ps` put NO SECRET ON THE HOST. Every value below is non-secret: the
#   # worker asks the platform for its own identity token and presents that to Workload
#   # Credentials in place of a PAT. See docs/profiles/demo/agent-demo-cell.md.
#   agent_wlc_base_url:     https://…                   # REQUIRED for `wlc` and `ps`
#   agent_wlc_site_id:      …                           # REQUIRED for `wlc` and `ps`
#   agent_wlc_service_name: …                           # the registered Workload Identity
#   agent_wlc_resource:     …                           # the audience to mint the token for
#   agent_wlc_secret_name:  agent-mcp-pat               # `wlc`: where the PAT lives in WC
#   agent_wlc_folder:       ""
#   agent_wlc_client_id:    ""                          # Azure user-assigned identity only
#
#   # Which issuer vouches for this machine. NOT Azure-only — every cloud federates a
#   # non-human identity over OIDC, and `spire` needs no cloud at all.
#   agent_identity_platform:   auto | azure | gcp | aws | spire | file
#   agent_identity_token_file: ""                       # aws/file: override the path
#
#   # `ps` reads the Password Safe API client pair out of WC and requests the credential
#   # from the vault, so the retrieval is a recorded request rather than a file read.
#   agent_ps_client_id_secret:     ps-client-id         # REQUIRED when source is `ps`
#   agent_ps_client_secret_secret: ps-client-secret     # REQUIRED when source is `ps`
#   agent_ps_api_url:  https://ps.example.com/BeyondTrust/api/public/v3
#   agent_ps_account_id: 42                             # the account whose password is the PAT
#   agent_ps_system_id:  0                              # optional; resolved from the account
#   agent_ps_duration:   30
#   agent_ps_reason:     "mcp-agent credential fetch"
#   agent_trust_domain: weaverlab.test                  # for the log line only
#   agent_interval:     30
#   agent_spiffe_socket: unix:///tmp/spire-agent/public/api.sock
#   agent_skip_pip:     false
---
- name: Install the MCP agent worker
  hosts: all
  become: true
  vars:
    agent_token_source: file
    agent_wlc_base_url: ""
    agent_wlc_site_id: ""
    agent_wlc_service_name: ""
    agent_wlc_resource: ""
    agent_wlc_secret_name: ""
    agent_wlc_folder: ""
    agent_wlc_client_id: ""
    agent_identity_platform: auto
    agent_identity_token_file: ""
    agent_ps_client_id_secret: ""
    agent_ps_client_secret_secret: ""
    agent_ps_api_url: ""
    agent_ps_account_id: 0
    agent_ps_system_id: 0
    agent_ps_duration: 30
    agent_ps_reason: "mcp-agent credential fetch"
    agent_interval: 30
    agent_spiffe_socket: "unix:///tmp/spire-agent/public/api.sock"
    agent_skip_pip: false
    agent_home: /opt/mcp-agent
    agent_conf: /etc/mcp-agent

    # ONE folded line, deliberately. An earlier version of this built the ExecStart out of
    # backslash continuations with `{% if %}` blocks between them, and a conditional that
    # ended without a trailing backslash silently truncated the command: `file` mode lost
    # --spiffe-socket and --interval, and systemd saw the remainder as an unknown
    # directive. A folded scalar has no continuations to get wrong -- YAML joins the lines,
    # systemd splits the result on whitespace, and a blank line from a skipped `{% if %}`
    # collapses to a space that changes nothing.
    agent_args: >-
      --url {{ agent_mcp_url }}
      --token-source {{ agent_token_source }}
      --spiffe-socket {{ agent_spiffe_socket }}
      --interval {{ agent_interval }}
      {% if agent_token_source == 'file' %}
      --token-file {{ agent_conf }}/token
      {% else %}
      --identity-platform {{ agent_identity_platform }}
      {% if agent_identity_token_file %}--identity-token-file {{ agent_identity_token_file }}{% endif %}
      --wlc-base-url {{ agent_wlc_base_url }}
      --wlc-site-id {{ agent_wlc_site_id }}
      --wlc-service-name {{ agent_wlc_service_name }}
      --wlc-resource {{ agent_wlc_resource }}
      {% if agent_wlc_folder %}--wlc-folder {{ agent_wlc_folder }}{% endif %}
      {% if agent_wlc_client_id %}--wlc-client-id {{ agent_wlc_client_id }}{% endif %}
      {% endif %}
      {% if agent_token_source == 'wlc' %}
      --wlc-secret-name {{ agent_wlc_secret_name }}
      {% endif %}
      {% if agent_token_source == 'ps' %}
      --ps-client-id-secret {{ agent_ps_client_id_secret }}
      --ps-client-secret-secret {{ agent_ps_client_secret_secret }}
      --ps-api-url {{ agent_ps_api_url }}
      --ps-account-id {{ agent_ps_account_id }}
      {% if agent_ps_system_id | int > 0 %}--ps-system-id {{ agent_ps_system_id }}{% endif %}
      --ps-duration {{ agent_ps_duration }}
      --ps-reason "{{ agent_ps_reason }}"
      {% endif %}

  tasks:
    - name: Refuse to run without an endpoint to call
      ansible.builtin.assert:
        that:
          - agent_mcp_url is defined and agent_mcp_url | length > 0
        fail_msg: agent_mcp_url is required.

    - name: Refuse a file-sourced worker with no token
      ansible.builtin.assert:
        that:
          - agent_token is defined and agent_token | length > 0
        fail_msg: >-
          agent_token is required when agent_token_source is `file`. The token is minted
          by the agent cell, not by hand: a worker with a token nothing recorded is the
          thing this demo argues against.
      when: agent_token_source == 'file'

    - name: Refuse a workload-identity worker with nothing to identify itself to
      ansible.builtin.assert:
        that:
          - agent_wlc_base_url | length > 0
          - agent_wlc_site_id | length > 0
          - agent_wlc_service_name | length > 0
          - agent_wlc_resource | length > 0
        fail_msg: >-
          agent_token_source is `{{ agent_token_source }}`, which needs the Workload
          Credentials base url, the site, the registered Workload Identity name and the
          audience to mint the identity token for. Every one of those is NON-SECRET --
          if you are reaching for a credential here, the mode is wrong.
      when: agent_token_source in ['wlc', 'ps']

    - name: Refuse a wlc-sourced worker with no secret name
      ansible.builtin.assert:
        that:
          - agent_wlc_secret_name | length > 0
        fail_msg: >-
          agent_token_source is `wlc`, so agent_wlc_secret_name must name the Workload
          Credentials secret holding the PAT.
      when: agent_token_source == 'wlc'

    # The two WC secrets here are the Password Safe OAuth2 pair, not the credential. That
    # pair is a standing credential and always was -- ps_api_service._sign_in uses one --
    # so the question is where it lives, and in this mode it lives in WC rather than on
    # this host. Naming the secrets is configuration; the secrets are not on this box.
    - name: Refuse a Password-Safe-sourced worker with no way into the vault
      ansible.builtin.assert:
        that:
          - agent_ps_client_id_secret | length > 0
          - agent_ps_client_secret_secret | length > 0
          - agent_ps_api_url | length > 0
          - agent_ps_account_id | int > 0
        fail_msg: >-
          agent_token_source is `ps`, which needs the two Workload Credentials secret
          NAMES holding the Password Safe client id and secret, the Password Safe API
          url, and the managed account whose password is this worker's PAT. The names
          are non-secret; if you are pasting a client secret into this play, the mode is
          wrong -- put it in Workload Credentials instead.
      when: agent_token_source == 'ps'

    - name: Create the worker's directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ agent_home }}"
        - "{{ agent_conf }}"

    - name: Install the MCP client library
      ansible.builtin.pip:
        name: "mcp>=1.2.0,<2"
        state: present
      when: not agent_skip_pip

    - name: Install the worker
      ansible.builtin.copy:
        src: files/mcp_agent.py
        dest: "{{ agent_home }}/mcp_agent.py"
        owner: root
        group: root
        mode: "0755"

    # 0600 and root-owned. The worker reads it once at startup; nothing else on the host
    # should be able to.
    - name: Write the PAT where only the worker can read it
      ansible.builtin.copy:
        content: "{{ agent_token }}"
        dest: "{{ agent_conf }}/token"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: agent_token_source == 'file'

    # Not merely skipped -- REMOVED. Re-running this play to move a host off `file` must
    # leave no token behind, or the claim that nothing is stored on the host would be
    # false and the evidence would be sitting in /etc.
    - name: Remove any token left from a file-sourced install
      ansible.builtin.file:
        path: "{{ agent_conf }}/token"
        state: absent
      when: agent_token_source != 'file'

    - name: Install the systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/mcp-agent.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=MCP agent worker (agent demo cell)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/env python3 {{ agent_home }}/mcp_agent.py {{ agent_args }}
          # NOT Restart=always. The worker exits 2 when its token is refused, and that
          # exit IS the demo's closing beat -- restarting it would hide the revoke behind
          # a loop of failures. on-failure with SuccessExitStatus=2 means a genuine crash
          # still restarts and a revoke stops, visibly.
          Restart=on-failure
          SuccessExitStatus=2
          RestartSec=10
          # The worker needs the SPIRE socket under /tmp, so PrivateTmp would hide it --
          # the same trap spire-agent-install.yml documents.
          PrivateTmp=no
          NoNewPrivileges=yes
          ProtectSystem=strict
          ReadWritePaths={{ agent_conf }}
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target

    - name: Start the worker
      ansible.builtin.systemd:
        name: mcp-agent
        enabled: true
        state: restarted
        daemon_reload: true

    - name: Say where to watch it
      ansible.builtin.debug:
        msg: >-
          Worker running. Follow it with `journalctl -u mcp-agent -f`; each line names the
          SPIFFE ID it proved and the token it spent. Revoke the token in
          Settings -> API Tokens to end it.
