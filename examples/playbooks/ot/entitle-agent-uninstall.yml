# Remove the Entitle agent from a single-node k3s or KubeSolo host
# Target: the host holding the release (the OT demo's DMZ broker runs k3s). Idempotent — a host with no release
# is a no-op, not a failure.
#
# DESTRUCTIVE, and requires confirm: true to do anything.
#   * The agent stops brokering access immediately; anything Entitle grants through
#     this agent stops working.
#   * With kmsType: kubernetes_secret_manager the agent's stored access tokens live in
#     Secrets in this namespace. Deleting the namespace destroys them, and Entitle
#     will re-seed on the next install — so a reinstall is clean, not a recovery.
#
# The agent token itself is NOT revoked here. It stays valid in Entitle; retire it in
# Org Settings if this host is gone for good.
#
# extra_vars:
#   confirm: true                 # required — nothing happens without it
#   delete_namespace: false       # also remove the namespace and its Secrets
#   k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml
#   kubesolo_path: /var/lib/kubesolo
- name: Uninstall the Entitle agent
  hosts: all
  become: true
  vars:
    confirm: false
    delete_namespace: false
    k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml
    kubesolo_path: /var/lib/kubesolo
    entitle_agent_namespace: entitle
    entitle_agent_release: entitle-agent
  tasks:
    # k3s (the OT demo's cell and broker) or KubeSolo (a standalone edge host): the
    # admin kubeconfig is the tell for which, and every kubectl and helm call below
    # uses whichever one is here.
    - name: Look for k3s's kubeconfig
      ansible.builtin.stat:
        path: "{{ k3s_kubeconfig }}"
      register: _k3s_kc

    - name: Look for KubeSolo's kubeconfig
      ansible.builtin.stat:
        path: "{{ kubesolo_path }}/pki/admin/admin.kubeconfig"
      register: _kubesolo_kc
      when: not _k3s_kc.stat.exists

    - name: Use whichever cluster this host runs
      ansible.builtin.set_fact:
        kube_kubeconfig: >-
          {{ k3s_kubeconfig if _k3s_kc.stat.exists
             else (kubesolo_path ~ '/pki/admin/admin.kubeconfig') }}
        kube_present: >-
          {{ _k3s_kc.stat.exists or (_kubesolo_kc.stat.exists | default(false)) }}

    - name: Nothing to do
      ansible.builtin.debug:
        msg: >-
          Neither k3s nor KubeSolo appears to be installed here, so there is no
          release to remove.
      when: not (kube_present | bool)

    - name: Look for the release
      ansible.builtin.command: >-
        /usr/local/bin/helm status {{ entitle_agent_release }} -n {{ entitle_agent_namespace }}
      environment:
        KUBECONFIG: "{{ kube_kubeconfig }}"
      register: release_probe
      changed_when: false
      failed_when: false
      when: kube_present | bool

    - name: Report a host with no release
      ansible.builtin.debug:
        msg: >-
          No helm release '{{ entitle_agent_release }}' in namespace
          '{{ entitle_agent_namespace }}' — nothing to remove.
      when:
        - kube_present | bool
        - release_probe.rc != 0

    - name: Require explicit confirmation
      ansible.builtin.assert:
        that: confirm | bool
        fail_msg: >-
          Refusing to remove the Entitle agent without confirm: true. This stops all
          access this agent brokers{{ ', and delete_namespace: true would also destroy
          the agent Secrets in the namespace' if delete_namespace | bool else '' }}.
      when:
        - kube_present | bool
        - release_probe.rc == 0

    # ── Uninstall ────────────────────────────────────────────────────────────
    - name: Uninstall the release
      ansible.builtin.command: >-
        /usr/local/bin/helm uninstall {{ entitle_agent_release }}
        -n {{ entitle_agent_namespace }} --wait --timeout 300s
      environment:
        KUBECONFIG: "{{ kube_kubeconfig }}"
      register: removed
      changed_when: removed.rc == 0
      when:
        - kube_present | bool
        - release_probe.rc == 0
        - confirm | bool

    - name: Delete the namespace
      ansible.builtin.command: >-
        /usr/local/bin/kubectl delete namespace {{ entitle_agent_namespace }} --wait=false
      environment:
        KUBECONFIG: "{{ kube_kubeconfig }}"
      register: ns_removed
      changed_when: ns_removed.rc == 0
      when:
        - kube_present | bool
        - confirm | bool
        - delete_namespace | bool

    - name: Result
      ansible.builtin.debug:
        msg: >-
          Entitle agent removed from this node.
          {{ 'The namespace and its Secrets went with it.' if delete_namespace | bool
             else 'The namespace and the agent Secrets remain — a reinstall will reuse them.' }}
          The agent token is still valid in Entitle; retire it in Org Settings if this
          host is not coming back.
      when:
        - kube_present | bool
        - release_probe.rc == 0
        - confirm | bool
