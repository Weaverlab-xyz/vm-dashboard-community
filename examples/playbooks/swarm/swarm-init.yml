# Initialise a Docker Swarm manager
# Target: an on-prem Linux host that already has Docker (run linux/install-docker.yml
# first). Idempotent — a host that is already an active swarm node is left alone.
#
# This is step 1 of 2. It prints the `docker swarm join` commands for workers and for
# additional managers; feed the token into swarm-join.yml on each other node.
#
# TOKEN HANDLING — two modes:
#
#   1. WRITE TO PASSWORD SAFE (recommended). Set join_token_secret to a folder/title
#      and the worker token is stored there instead of printed; swarm-join.yml then
#      reads it back with the SAME path via its own join_token_secret. The token never
#      appears in any job output.
#   2. PRINT (default). With no path set, the token is printed so you can paste it into
#      swarm-join.yml. Anyone who can see the job and reach :2377 can then join the
#      swarm — rotate it when you are done:  docker swarm join-token --rotate worker
#
# Ports must be reachable between nodes — see swarm-open-ports.yml.
#
# extra_vars (optional, via the local runner):
#   advertise_addr: 10.0.0.11   # which address other nodes reach this manager on;
#                               # default = the host's primary IPv4. Set it explicitly
#                               # on multi-NIC hosts, where autodetect guesses wrong.
#   default_addr_pool: ""       # e.g. 10.20.0.0/16 — overlay subnet pool
#   join_token_secret: infra/swarm-worker-token     # store the WORKER token here
#   manager_token_secret: infra/swarm-manager-token # …and optionally the MANAGER token
#   token_safe: Automation      # the Secrets Safe safe holding them
#
# WRITING REQUIRES CREATE RIGHTS: the auto-injected OAuth client needs permission to
# create secrets in `token_safe`, beyond the read scope the lookup examples need. The
# safe and folder must already exist — password-safe/onboard-safe-and-account.yml
# creates them.
#
# ADAPT BEFORE USE (write mode only): the management modules' argument names vary by
# BeyondInsight/Password Safe version. Verify secrets_create's parameters against the
# collection docs before relying on it. The auth params are stable across the
# collection; the resource params are a starting point.
- name: Initialise a Docker Swarm manager
  hosts: all
  become: true
  vars:
    advertise_addr: ""
    default_addr_pool: ""
    # Optional Password Safe destinations (blank = print the tokens instead).
    join_token_secret: ""
    manager_token_secret: ""
    token_safe: "Automation"
    ps_api_url: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_API_URL') }}"
    ps_client_id: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_CLIENT_ID') }}"
    ps_client_secret: "{{ lookup('ansible.builtin.env', 'PASSWORD_SAFE_CLIENT_SECRET') }}"
    ps_verify_ca: true          # set false only for a self-signed Password Safe
  tasks:
    - name: Validate the Password Safe destinations
      ansible.builtin.assert:
        that:
          - "'/' in join_token_secret or join_token_secret | length == 0"
          - "'/' in manager_token_secret or manager_token_secret | length == 0"
          - ps_api_url | length > 0 or (join_token_secret | length == 0 and manager_token_secret | length == 0)
        fail_msg: >-
          Token paths must be 'folder/title', and writing needs the PASSWORD_SAFE_*
          credentials (auto-injected when BeyondTrust is enabled and configured).

    - name: Check Docker is present
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false
      failed_when: docker_version.rc != 0

    - name: Detect swarm state
      ansible.builtin.command: docker info --format '{% raw %}{{.Swarm.LocalNodeState}}{% endraw %}'
      register: swarm_state
      changed_when: false

    - name: Report an already-initialised node
      ansible.builtin.debug:
        msg: >-
          This host is already an active swarm node — leaving it untouched.
          Run swarm-status.yml to inspect it, or swarm-leave.yml to remove it first.
      when: swarm_state.stdout == "active"

    # ── Initialise ───────────────────────────────────────────────────────────
    - name: Initialise the swarm
      ansible.builtin.command: >-
        docker swarm init
        --advertise-addr {{ advertise_addr | default(ansible_facts['default_ipv4']['address'], true) }}
        {{ ('--default-addr-pool ' ~ default_addr_pool) if default_addr_pool | length > 0 else '' }}
      register: swarm_init
      changed_when: swarm_init.rc == 0
      when: swarm_state.stdout != "active"

    # ── Join commands for the other nodes ────────────────────────────────────
    - name: Read the worker join token
      ansible.builtin.command: docker swarm join-token -q worker
      register: worker_token
      changed_when: false

    - name: Read the manager join token
      ansible.builtin.command: docker swarm join-token -q manager
      register: manager_token
      changed_when: false

    - name: Resolve this manager's advertised address
      ansible.builtin.set_fact:
        _manager_addr: "{{ advertise_addr | default(ansible_facts['default_ipv4']['address'], true) }}"

    # ── Store the tokens in Password Safe (optional) ─────────────────────────
    # delegate_to: localhost is load-bearing. secrets_create is a MODULE, not a lookup,
    # so by default it would execute on the swarm node — which has no
    # beyondtrust-bips-library. Running it on the controller (the runner container,
    # where the library and the injected credentials live) is the only thing that
    # works. become: false so the delegation doesn't try to sudo on the controller.
    - name: Store the worker join token in Password Safe
      beyondtrust.secrets_safe.secrets_create:
        api_url: "{{ ps_api_url }}"
        api_version: "3.1"
        client_id: "{{ ps_client_id }}"
        client_secret: "{{ ps_client_secret }}"
        verify_ca: "{{ ps_verify_ca }}"
        safe_name: "{{ token_safe }}"
        folder_name: "{{ join_token_secret.split('/')[:-1] | join('/') }}"
        title: "{{ join_token_secret.split('/') | last }}"
        secret_type: "text"
        text: "{{ worker_token.stdout }}"
      delegate_to: localhost
      become: false
      no_log: true
      when: join_token_secret | length > 0

    - name: Store the manager join token in Password Safe
      beyondtrust.secrets_safe.secrets_create:
        api_url: "{{ ps_api_url }}"
        api_version: "3.1"
        client_id: "{{ ps_client_id }}"
        client_secret: "{{ ps_client_secret }}"
        verify_ca: "{{ ps_verify_ca }}"
        safe_name: "{{ token_safe }}"
        folder_name: "{{ manager_token_secret.split('/')[:-1] | join('/') }}"
        title: "{{ manager_token_secret.split('/') | last }}"
        secret_type: "text"
        text: "{{ manager_token.stdout }}"
      delegate_to: localhost
      become: false
      no_log: true
      when: manager_token_secret | length > 0

    # ── Tell the operator what to do next ────────────────────────────────────
    - name: Join instructions (tokens stored in Password Safe)
      ansible.builtin.debug:
        msg:
          - "Swarm ready on {{ _manager_addr }}."
          - "The worker token is stored at '{{ join_token_secret }}' in safe '{{ token_safe }}'."
          - "Run swarm-join.yml against each WORKER with:"
          - "  manager_addr:      {{ _manager_addr }}"
          - "  join_token_secret: {{ join_token_secret }}"
          - >-
            {{ ("For an additional MANAGER, use join_role: manager and join_token_secret: "
                ~ manager_token_secret) if manager_token_secret | length > 0
               else "No manager token was stored — set manager_token_secret to add one." }}
      when: join_token_secret | length > 0

    - name: Join commands (tokens printed — nothing was stored)
      ansible.builtin.debug:
        msg:
          - "Swarm ready on {{ _manager_addr }}."
          - "Run swarm-join.yml against each WORKER with:"
          - "  manager_addr: {{ _manager_addr }}"
          - "  join_token:   {{ worker_token.stdout }}"
          - "For an additional MANAGER, use join_role: manager and:"
          - "  join_token:   {{ manager_token.stdout }}"
          - "Rotate with `docker swarm join-token --rotate worker` when you are done,"
          - "or set join_token_secret next time to store it instead of printing it."
      when: join_token_secret | length == 0
