# Open the SPIRE Server API port on the host firewall
# Target: the SPIRE server VM. Idempotent.
#
# SPIRE needs one port for this lab:
#   8081/tcp   the server API — gRPC over mTLS, which is what the plugin dials
#
# THIS IS THE HOST FIREWALL ONLY, and it is the second of two gates. On a cloud VM it
# is usually not the one blocking you: the cloud's own network ACL is. Open that too,
# from wherever the Password Safe worker or Resource Broker actually egresses:
#
#   Azure   the VM's Network Security Group — an inbound allow on tcp/8081
#   GCP     a VPC firewall rule on the network, targeting the VM's network tag
#   AWS     an inbound rule on the VM's security group
#
# A closed cloud ACL and a closed host firewall present identically to the plugin: a
# gRPC timeout on Verify Functional Account, which reads like a credential problem and
# is not. Check both before suspecting admin_ids.
#
# SCOPE: spire_source_cidr is empty by default, which opens the port to any source.
# That suits a throwaway lab on a private subnet and is wrong anywhere else — 8081 is
# an API that mints identities, so set it to the broker's range when you know it.
#
# Handles firewalld (RHEL/Rocky/Alma) and ufw (Debian/Ubuntu). A host running neither
# is reported and skipped; iptables/nftables rules are never written directly.
#
# extra_vars (optional):
#   bind_port: 8081
#   spire_source_cidrs: [10.0.0.0/24, 203.0.113.7/32]   # restrict to these sources
#   spire_source_cidr: 10.0.0.0/24     # one source; kept for back-compat
#
# TAKE THE LIST FORM WHEN YOU HAVE MORE THAN ONE SOURCE. Corporate egress commonly
# rotates between two addresses, so a rule pinned to one of them fails on roughly
# half the connections and reads as an intermittent credential problem. The
# dashboard's Workload Lab page (SPIRE tab) passes whatever it opened on the cloud ACL, so both
# gates end up carrying the same source set.
- name: Open the SPIRE Server API port
  hosts: all
  become: true
  vars:
    bind_port: 8081
    spire_source_cidr: ""
    spire_source_cidrs: []
  tasks:
    # One list, however the caller expressed it. An empty result means "any
    # source", which is what the unrestricted tasks below key off.
    - name: Resolve the source list
      ansible.builtin.set_fact:
        _sources: >-
          {{ (spire_source_cidrs | default([], true) | list)
             + ([spire_source_cidr] if (spire_source_cidr | length > 0) else []) }}

    - name: Detect firewalld
      ansible.builtin.command: systemctl is-active firewalld
      register: firewalld_active
      changed_when: false
      failed_when: false

    - name: Detect ufw
      ansible.builtin.command: ufw status
      register: ufw_status
      changed_when: false
      failed_when: false

    # ── firewalld (RHEL / Rocky / Alma) ──────────────────────────────────────
    - name: Open the SPIRE API port to each source (firewalld)
      ansible.posix.firewalld:
        port: "{{ bind_port }}/tcp"
        permanent: true
        immediate: true
        state: enabled
        source: "{{ item }}"
      loop: "{{ _sources }}"
      when:
        - firewalld_active.stdout == "active"
        - _sources | length > 0

    - name: Open the SPIRE API port to any source (firewalld)
      ansible.posix.firewalld:
        port: "{{ bind_port }}/tcp"
        permanent: true
        immediate: true
        state: enabled
      when:
        - firewalld_active.stdout == "active"
        - _sources | length == 0

    # ── ufw (Debian / Ubuntu) ────────────────────────────────────────────────
    # community.general.ufw is not in the runner image's documented collection set,
    # so this shells out, exactly as k3s-open-ports.yml does. `ufw allow` is itself
    # idempotent — a duplicate reports "Skipping adding existing rule".
    - name: Open the SPIRE API port to each source (ufw)
      ansible.builtin.command: >-
        ufw allow from {{ item }} to any port {{ bind_port }} proto tcp
      register: ufw_rule
      changed_when: "'existing rule' not in ufw_rule.stdout"
      loop: "{{ _sources }}"
      when:
        - ufw_status.rc == 0
        - "'inactive' not in ufw_status.stdout"
        - _sources | length > 0

    - name: Open the SPIRE API port to any source (ufw)
      ansible.builtin.command: "ufw allow {{ bind_port }}/tcp"
      register: ufw_rule_any
      changed_when: "'existing rule' not in ufw_rule_any.stdout"
      when:
        - ufw_status.rc == 0
        - "'inactive' not in ufw_status.stdout"
        - _sources | length == 0

    - name: Report a host with neither firewall
      ansible.builtin.debug:
        msg: >-
          Neither firewalld nor an active ufw is present, so nothing was changed. If
          the plugin still cannot reach :{{ bind_port }}, the cloud network ACL is the
          remaining gate — see the header of this file.
      when:
        - firewalld_active.stdout != "active"
        - ufw_status.rc != 0 or 'inactive' in ufw_status.stdout

    # Say what actually happened. Reporting "the host firewall allows tcp/8081" on a host
    # with no host firewall reads as though a rule was written, and the next person to
    # debug a timeout will trust it and look in the wrong place.
    - name: What is now reachable
      ansible.builtin.debug:
        msg:
          - >-
            {{ ('Host firewall allows tcp/' ~ bind_port ~ ' from '
                ~ (_sources | join(', ') if _sources | length > 0 else 'any source') ~ '.')
               if (firewalld_active.stdout == 'active'
                   or (ufw_status.rc == 0 and 'inactive' not in ufw_status.stdout))
               else ('No host firewall is running, so nothing here restricts tcp/'
                     ~ bind_port ~ ' and no rule was written.') }}
          - "The cloud NSG / VPC firewall / security group is a SEPARATE gate. Open it too."
