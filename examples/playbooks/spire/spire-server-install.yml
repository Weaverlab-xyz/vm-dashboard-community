# Install a SPIRE Server for the Password Safe SPIFFE SVID plugin's lab
# Target: a Linux VM the Password Safe worker or Resource Broker can reach on 8081.
# Idempotent — a host already running the service keeps its datastore and its CA.
#
# This builds the lab the plugin is developed against: one trust domain, a sqlite
# datastore, the join_token node attestor and a disk key manager. It is a THROWAWAY
# lab, not a production topology — no HA, no upstream CA, and no agent, because the
# plugin only ever talks to the server's API.
#
# NEEDS EGRESS to github.com to fetch the release tarball.
#
# RUNS AS AN UNPRIVILEGED USER, the way upstream ships it. The official image runs the
# server as uid 1000, and the server makes its API socket 0770 so only its own user or
# group can connect. Here the server is the `spire` system user (no shell, no home), the
# binaries are root-owned so that user cannot replace them, the datastore and CA keys
# are 0700 to it alone, and the unit is sandboxed (no capabilities, read-only system,
# writable only where it must be). `systemd-analyze security spire-server` scores it.
# The CLI calls every other play makes run as root through `become`, which reaches the
# socket regardless.
#
# admin_ids IS THE LINE PEOPLE GET WRONG, so this playbook writes it for you. Setting
# `-admin` on a registration entry grants admin rights to SVIDs the AGENT issues for
# that entry; it does nothing for an SVID produced by `spire-server x509 mint`, which
# is how the functional account credential is made. Only admin_ids covers that, and a
# missing entry here surfaces later as PERMISSION_DENIED on Verify Functional Account.
#
# ca_ttl CAPS EVERY SVID THE SERVER ISSUES. The admin credential is minted with
# `-ttl 720h`, but SPIRE clamps it to ca_ttl and says so ("X509-SVID lifetime was
# capped shorter than specified ttl"). At the 168h default that is a 7-day admin
# credential, which is exactly when the plugin starts warning. Raise ca_ttl here if
# you want a lab that outlives a week.
#
# extra_vars:
#   trust_domain: weaverlab.test        # REQUIRED — the Managed System models one of these
#   spire_version: 1.15.3
#   spire_sha256: ""                # overrides the pinned checksum table
#   bind_port: 8081
#   ca_ttl: 168h
#   admin_spiffe_id: ""                 # default spiffe://<trust_domain>/password-safe/admin
- name: Install a SPIRE Server
  hosts: all
  become: true
  vars:
    trust_domain: ""
    spire_version: "1.15.3"
    spire_sha256: ""
    # SHA-256 of the upstream release tarballs, checked against the project's own
    # *_sha256sum.txt. Pinned per version and architecture; a version not in this table
    # is REFUSED unless spire_sha256 is given or spire_allow_unpinned is set. Move it
    # together with spire_version and the other SPIRE plays (a test holds them equal).
    spire_checksums:
      "1.15.3":
        amd64: ca1a4d1155317bdd2afc7f36663828a10410c7c840e54725b90b4064b0a301c7
        arm64: a9982b3ca7de489def22265fd4586d8e13091ecb6fddf6adcea9291313b18886
    spire_allow_unpinned: false
    bind_port: 8081
    ca_ttl: "168h"
    default_x509_svid_ttl: "1h"
    default_jwt_svid_ttl: "5m"
    admin_spiffe_id: ""
    spire_root: /opt/spire
    spire_data: /opt/spire/data
    spire_user: spire
    spire_group: spire
    # The server's default socket directory. Kept at the default so every CLI call in
    # the other plays reaches it without a -socketPath flag.
    socket_dir: /tmp/spire-server
  tasks:
    - name: Require a trust domain
      ansible.builtin.assert:
        that:
          - trust_domain | length > 0
          - "'/' not in trust_domain"
        fail_msg: >-
          trust_domain is required, and is a bare DNS-style name such as
          'weaverlab.test' — not a spiffe:// URI. The Managed System in Password Safe
          models exactly one of these, and the plugin asserts it on every connect.

    - name: Resolve the administrative SPIFFE ID
      ansible.builtin.set_fact:
        _admin_id: >-
          {{ admin_spiffe_id | default('spiffe://' ~ trust_domain ~ '/password-safe/admin', true) }}

    - name: Map the CPU architecture to a SPIRE release asset
      ansible.builtin.set_fact:
        _arch: "{{ _arch_map[ansible_facts['architecture']] | default('') }}"
      vars:
        _arch_map:
          x86_64: amd64
          aarch64: arm64

    - name: Fail on an architecture SPIRE does not publish
      ansible.builtin.fail:
        msg: "no SPIRE release asset for architecture {{ ansible_facts['architecture'] }}"
      when: _arch | length == 0

    - name: Detect an existing install
      ansible.builtin.command: "{{ spire_root }}/bin/spire-server --version"
      register: spire_installed
      changed_when: false
      failed_when: false

    # spire-server prints its version to STDERR, not stdout. Reading only stdout left the
    # guard below permanently true, so every run re-downloaded and re-unpacked the release
    # — and on a version bump it would have overwritten in place while looking guarded.
    - name: Note the version already installed
      ansible.builtin.set_fact:
        _installed: "{{ (spire_installed.stdout | default('')) ~ (spire_installed.stderr | default('')) }}"

    - name: Create the spire group
      ansible.builtin.group:
        name: "{{ spire_group }}"
        system: true

    - name: Create the spire user (no shell, no home)
      ansible.builtin.user:
        name: "{{ spire_user }}"
        group: "{{ spire_group }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ spire_data }}"
        create_home: false

    # conf/ is 0755 inside the release tarball, so unarchive resets it every time it
    # runs. Forcing 0750 here made the two fight and the play report changed forever;
    # the mode below is the one the tarball actually ships (server.conf itself is 0640).
    # data/ is ours, not the tarball's: the datastore and the CA keys, 0700 to the
    # server user alone -- not even its group, which the OIDC provider joins for the
    # socket. The root is group-traversable for the same reason.
    - name: Create the SPIRE directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ spire_root }}", owner: root, group: "{{ spire_group }}", mode: "0750"}
        - {path: "{{ spire_root }}/conf", owner: root, group: root, mode: "0755"}
        - {path: "{{ spire_data }}", owner: "{{ spire_user }}", group: "{{ spire_group }}", mode: "0700"}
      loop_control:
        label: "{{ item.path }}"

    # A lab first built before the server ran unprivileged has a root-owned datastore.
    - name: Give the datastore and keys to the server user
      ansible.builtin.file:
        path: "{{ spire_data }}"
        state: directory
        owner: "{{ spire_user }}"
        group: "{{ spire_group }}"
        recurse: true

    - name: Resolve the pinned checksum for this version and architecture
      ansible.builtin.set_fact:
        _spire_sha256: >-
          {{ spire_sha256 if spire_sha256 | length > 0
             else (spire_checksums[spire_version][_arch] | default('')
                   if spire_version in spire_checksums else '') }}

    - name: Refuse an unverified download
      ansible.builtin.assert:
        that:
          - _spire_sha256 | length > 0 or spire_allow_unpinned | bool
        fail_msg: >-
          No pinned SHA-256 for the SPIRE {{ spire_version }} tarball on {{ _arch }}.
          Add it to spire_checksums in this play (from the release page's
          *_sha256sum.txt), pass spire_sha256, or set spire_allow_unpinned to
          take the download on TLS alone.
      when: spire_version not in _installed

    - name: Download the SPIRE release
      ansible.builtin.get_url:
        url: >-
          https://github.com/spiffe/spire/releases/download/v{{ spire_version }}/spire-{{ spire_version }}-linux-{{ _arch }}-musl.tar.gz
        dest: "/tmp/spire-{{ spire_version }}.tar.gz"
        checksum: "{{ ('sha256:' ~ _spire_sha256) if _spire_sha256 | length > 0 else omit }}"
        mode: "0640"
      when: spire_version not in _installed

    - name: Warn when the download was not checksummed
      ansible.builtin.debug:
        msg: >-
          spire_allow_unpinned is set and no checksum is pinned for this version,
          so the tarball was taken on TLS alone.
      when:
        - _spire_sha256 | length == 0
        - spire_version not in _installed

    - name: Unpack SPIRE
      ansible.builtin.unarchive:
        src: "/tmp/spire-{{ spire_version }}.tar.gz"
        dest: "{{ spire_root }}"
        remote_src: true
        extra_opts: ["--strip-components=1"]
        # The archive's own uids would otherwise survive extraction as root -- leaving
        # the binaries owned by whoever that uid is on this host.
        owner: root
        group: root
      # A new binary on disk changes nothing until the running process is replaced.
      notify: Restart spire-server
      when: spire_version not in _installed

    - name: Keep the binaries root-owned
      ansible.builtin.file:
        path: "{{ spire_root }}/bin"
        state: directory
        owner: root
        group: root
        recurse: true

    - name: Remove the downloaded tarball
      ansible.builtin.file:
        path: "/tmp/spire-{{ spire_version }}.tar.gz"
        state: absent

    # data_dir and keys_path are inside spire_data and are NOT touched here: rewriting
    # server.conf must never re-key a server that already has a CA and issued SVIDs.
    - name: Write the server configuration
      ansible.builtin.copy:
        dest: "{{ spire_root }}/conf/server.conf"
        owner: root
        group: "{{ spire_group }}"
        mode: "0640"
        content: |
          server {
              bind_address = "0.0.0.0"
              bind_port    = "{{ bind_port }}"
              trust_domain = "{{ trust_domain }}"
              data_dir     = "{{ spire_data }}"
              log_level    = "INFO"
              ca_ttl       = "{{ ca_ttl }}"
              default_x509_svid_ttl = "{{ default_x509_svid_ttl }}"
              default_jwt_svid_ttl  = "{{ default_jwt_svid_ttl }}"

              # An entry-level admin=true does NOT apply to an SVID produced by
              # "spire-server x509 mint". Only admin_ids grants administrative rights
              # to a minted SVID, which is what the plugin authenticates with.
              admin_ids = ["{{ _admin_id }}"]
          }

          plugins {
              DataStore "sql" {
                  plugin_data {
                      database_type     = "sqlite3"
                      connection_string = "{{ spire_data }}/datastore.sqlite3"
                  }
              }
              NodeAttestor "join_token" { plugin_data {} }
              KeyManager  "disk"        { plugin_data { keys_path = "{{ spire_data }}/keys.json" } }
          }
      notify: Restart spire-server

    # The socket stays at the upstream default under /tmp. tmpfiles owns the directory
    # (created at boot, never aged out, re-owned if a root-run server left it behind), so
    # the sandbox below can make exactly it writable. 0750: the OIDC provider reaches the
    # 0770 socket through the group.
    - name: Declare the socket directory
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/spire-server.conf
        mode: "0644"
        content: |
          d {{ socket_dir }}         0750 {{ spire_user }} {{ spire_group }} -
          d {{ socket_dir }}/private 0750 {{ spire_user }} {{ spire_group }} -
      register: tmpfiles_conf

    - name: Create the socket directory now
      ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/spire-server.conf
      changed_when: tmpfiles_conf.changed

    - name: Install the systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/spire-server.service
        mode: "0644"
        content: |
          [Unit]
          Description=SPIRE Server (Password Safe SPIFFE SVID plugin lab)
          After=network-online.target
          Wants=network-online.target

          [Service]
          ExecStart={{ spire_root }}/bin/spire-server run -config {{ spire_root }}/conf/server.conf
          WorkingDirectory={{ spire_data }}
          User={{ spire_user }}
          Group={{ spire_group }}
          UMask=0027
          Restart=on-failure
          RestartSec=5

          # Sandbox. 8081 is unprivileged, so the process needs no capability at all.
          NoNewPrivileges=yes
          CapabilityBoundingSet=
          AmbientCapabilities=
          ProtectSystem=strict
          ReadWritePaths={{ spire_data }} {{ socket_dir }}
          ProtectHome=yes
          PrivateDevices=yes
          ProtectKernelTunables=yes
          ProtectKernelModules=yes
          ProtectKernelLogs=yes
          ProtectControlGroups=yes
          ProtectClock=yes
          ProtectHostname=yes
          RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
          RestrictNamespaces=yes
          RestrictRealtime=yes
          RestrictSUIDSGID=yes
          LockPersonality=yes
          MemoryDenyWriteExecute=yes
          SystemCallArchitectures=native
          SystemCallFilter=@system-service
          SystemCallErrorNumber=EPERM

          [Install]
          WantedBy=multi-user.target
      notify: Restart spire-server

    - name: Enable and start spire-server
      ansible.builtin.systemd:
        name: spire-server
        enabled: true
        state: started
        daemon_reload: true

    - name: Apply any pending restart before probing the API
      ansible.builtin.meta: flush_handlers

    - name: Wait for the API port to accept connections
      ansible.builtin.wait_for:
        port: "{{ bind_port }}"
        host: 127.0.0.1
        timeout: 60

    - name: Health check
      ansible.builtin.command: "{{ spire_root }}/bin/spire-server healthcheck"
      register: spire_health
      changed_when: false
      retries: 5
      delay: 3
      until: spire_health.rc == 0

    - name: What was built
      ansible.builtin.debug:
        msg:
          - "SPIRE {{ spire_version }} serving trust domain '{{ trust_domain }}' on :{{ bind_port }}."
          - "Administrative identity in admin_ids: {{ _admin_id }}"
          - "Runs as '{{ spire_user }}', sandboxed. Score it: systemd-analyze security spire-server"
          - "ca_ttl is {{ ca_ttl }} and it CAPS the admin credential, whatever x509 mint asks for."
          - "Next: spire-open-ports.yml, spire-seed-entries.yml, then spire-admin-identity.yml."
  handlers:
    - name: Restart spire-server
      ansible.builtin.systemd:
        name: spire-server
        state: restarted
        daemon_reload: true
