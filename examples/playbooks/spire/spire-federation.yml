# Federate the lab's SPIRE server with the dashboard's own SPIRE server (SPIFFE federation)
# Target: the SPIRE server VM (vm, docker or k8s mode). Idempotent; re-running is a refresh.
#
# docs/design/dashboard-workload-identity.md, L4. Two SPIRE servers, two trust domains:
# the lab's, and the dashboard's own (docker-compose.spire.yml). Federation is each one
# holding the OTHER's trust bundle, fetched from the other's bundle endpoint and kept
# current through rotation by SPIRE itself — so a workload in one trust domain can
# authenticate a workload in the other (an X.509-SVID over mTLS, or a JWT-SVID).
#
# THIS PLAY IS THE LAB'S HALF: a federation relationship naming the dashboard's trust
# domain, its bundle endpoint (https://<dashboard>:8082), and the SPIFFE ID that endpoint
# presents (spiffe://<dashboard td>/spire/server). The dashboard creates the mirror-image
# relationship on its own server after this succeeds (dashboard_spire.federate).
#
# THE SEED BUNDLE. An https_spiffe endpoint is authenticated with the other trust domain's
# own roots, so the very first fetch needs a copy of them. The dashboard passes its current
# bundle as `dashboard_bundle_json` — public keys, nothing secret — and SPIRE replaces it
# with what the endpoint serves from then on.
#
# REACHABILITY, BOTH WAYS. The lab fetches from the dashboard host's tcp/8082 (outbound
# from here); the dashboard fetches from this host's tcp/8082 (opened on the lab's ACL to
# the lab's source set). The refresh at the end proves the first direction; the dashboard
# proves the second.
#
# K8S MODE DECLARES, IT DOES NOT CREATE. The Helm chart's controller manager reconciles
# federation relationships from ClusterFederatedTrustDomain resources, and DELETES every
# relationship no resource declares (spire-controller-manager 0.7.0,
# pkg/spirefederationrelationship: anything in the server and not in a CR is removed
# within its 10s gcInterval). So `federation create` would be undone almost at once.
# Instead the play applies a ClusterFederatedTrustDomain carrying the controller
# manager's own className (read from its ConfigMap; the chart sets watchClassless false,
# so a resource without it is ignored) and waits for the server to report the
# relationship. The manager compares URL and profile only, so the seed bundle is used
# at creation and SPIRE's own refreshes are never overwritten. The workload entry's
# federatesWith is still written through the CLI: that entry is the k3s link's, not the
# manager's, and the manager leaves entries it did not create alone.
#
# NEVER LIVE-VALIDATED. The `federation` subcommands and flags are SPIRE 1.15's, read from
# its CLI docs; the first lab federated is the test.
#
# extra_vars:
#   trust_domain: lab.example.test               # REQUIRED — this lab's trust domain
#   dashboard_trust_domain: dashboard.example.com # REQUIRED
#   dashboard_bundle_endpoint_url: https://dashboard.example.com:8082   # REQUIRED
#   dashboard_bundle_json: '{"keys": [...]}'      # REQUIRED when state=present (the seed)
#   state: present                               # absent = remove the relationship + bundle
#   workload_spiffe_id: ""                       # the linked k3s workload; its entry gains
#                                                #   (or loses) the dashboard in federatesWith
#   spire_cli_prefix: ""                         # set by the lab for the docker and k8s modes
#   deployment_mode: ""                          # vm | docker | k8s (k8s is also inferred
#                                                #   from a `k3s kubectl` CLI prefix)
- name: Federate the lab's SPIRE server with the dashboard's
  hosts: all
  become: true
  vars:
    trust_domain: ""
    dashboard_trust_domain: ""
    dashboard_bundle_endpoint_url: ""
    dashboard_bundle_json: ""
    state: present
    workload_spiffe_id: ""
    spire_root: /opt/spire
    spire_cli_prefix: ""
    deployment_mode: ""
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    # The seed goes in on stdin, so a container needs `docker exec -i`. A VM runs the binary
    # directly and needs nothing.
    _cli: "{{ spire_cli_prefix | regex_replace('^docker exec ', 'docker exec -i ') }}{{ spire_root }}/bin/spire-server"
    _endpoint_id: "spiffe://{{ dashboard_trust_domain }}/spire/server"
    _k8s: "{{ deployment_mode == 'k8s' or spire_cli_prefix is match('^k3s kubectl ') }}"
    # A cluster-scoped resource name: the trust domain is already DNS-shaped.
    _cftd_name: "{{ dashboard_trust_domain | lower | regex_replace('[^a-z0-9.-]', '-') }}"
    _cftd_file: "{{ spire_root }}/federation-{{ _cftd_name }}.yaml"
    # The controller manager's className in its rendered config (quoted or not, and
    # JSON-escaped inside the ConfigMap's data).
    _class_re: 'className:\s*\\?"?([A-Za-z0-9._-]+)'
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: Validate the inputs
      ansible.builtin.assert:
        that:
          - trust_domain | length > 0
          - dashboard_trust_domain | length > 0
          - "'/' not in dashboard_trust_domain"
          - dashboard_trust_domain != trust_domain
          - state in ['present', 'absent']
          - state == 'absent' or dashboard_bundle_endpoint_url is match('^https://[^/]+:[0-9]+$')
          - state == 'absent' or '"keys"' in dashboard_bundle_json
        fail_msg: >-
          trust_domain, dashboard_trust_domain (a bare name, not this lab's), and for
          state=present an https bundle endpoint URL (https://<host>:<port>, no path) and
          the dashboard's SPIFFE bundle as the seed are required.

    - name: Look for an existing relationship
      ansible.builtin.command: "{{ _cli }} federation show -trustDomain {{ dashboard_trust_domain }}"
      register: existing
      changed_when: false
      failed_when: false

    - name: Remove the relationship and the federated bundle
      when: state == 'absent'
      block:
        - name: Delete the relationship
          ansible.builtin.command: "{{ _cli }} federation delete -id {{ dashboard_trust_domain }}"
          when:
            - existing.rc == 0
            - not _k8s | bool

        # k8s: withdraw the declaration; the controller manager deletes the relationship.
        - name: Delete the ClusterFederatedTrustDomain
          ansible.builtin.command: >-
            k3s kubectl delete clusterfederatedtrustdomain {{ _cftd_name }} --ignore-not-found
          register: cftd_delete
          changed_when: "'deleted' in cftd_delete.stdout"
          when: _k8s | bool

        - name: Wait for the controller manager to remove the relationship
          ansible.builtin.command: "{{ _cli }} federation show -trustDomain {{ dashboard_trust_domain }}"
          register: gone
          changed_when: false
          failed_when: false
          retries: 10
          delay: 3
          until: gone.rc != 0
          when:
            - _k8s | bool
            - existing.rc == 0

        - name: Delete the relationship directly if the manager did not
          ansible.builtin.command: "{{ _cli }} federation delete -id {{ dashboard_trust_domain }}"
          register: direct_delete
          failed_when: false
          when:
            - _k8s | bool
            - existing.rc == 0
            - gone.rc | default(1) == 0

        - name: Remove the declaration file
          ansible.builtin.file:
            path: "{{ _cftd_file }}"
            state: absent
          when: _k8s | bool

        - name: Delete the federated bundle
          ansible.builtin.command: "{{ _cli }} bundle delete -id spiffe://{{ dashboard_trust_domain }}"
          register: bundle_delete
          failed_when: false
          changed_when: bundle_delete.rc == 0

    - name: Create or update the relationship
      when: state == 'present'
      block:
        - name: Write the relationship, seeded with the dashboard's bundle
          when: not _k8s | bool
          ansible.builtin.command:
            cmd: >-
              {{ _cli }} federation {{ 'update' if existing.rc == 0 else 'create' }}
              -trustDomain {{ dashboard_trust_domain }}
              -bundleEndpointURL {{ dashboard_bundle_endpoint_url }}
              -bundleEndpointProfile https_spiffe
              -endpointSpiffeID {{ _endpoint_id }}
              -trustDomainBundleFormat spiffe
              -trustDomainBundlePath /dev/stdin
            stdin: "{{ dashboard_bundle_json }}"

        # ── k8s: declare it for the controller manager ──────────────────────
        - name: Read the controller manager's configuration
          when: _k8s | bool
          ansible.builtin.command: >-
            k3s kubectl -n spire-server get configmap spire-controller-manager -o json
          register: cm_config
          changed_when: false
          failed_when: false

        - name: Work out the controller manager's className
          when: _k8s | bool
          ansible.builtin.set_fact:
            _cftd_class: "{{ cm_config.stdout | default('') | regex_findall(_class_re) | first | default('') }}"

        - name: Write the ClusterFederatedTrustDomain, seeded with the dashboard's bundle
          when: _k8s | bool
          ansible.builtin.copy:
            dest: "{{ _cftd_file }}"
            mode: "0644"
            content: |
              apiVersion: spire.spiffe.io/v1alpha1
              kind: ClusterFederatedTrustDomain
              metadata:
                name: {{ _cftd_name }}
              spec:
              {% if _cftd_class | length > 0 %}
                className: {{ _cftd_class | to_json }}
              {% endif %}
                trustDomain: {{ dashboard_trust_domain | to_json }}
                bundleEndpointURL: {{ dashboard_bundle_endpoint_url | to_json }}
                bundleEndpointProfile:
                  type: https_spiffe
                  endpointSPIFFEID: {{ _endpoint_id | to_json }}
                trustDomainBundle: {{ dashboard_bundle_json | to_json }}

        - name: Apply the ClusterFederatedTrustDomain
          when: _k8s | bool
          ansible.builtin.command: k3s kubectl apply -f {{ _cftd_file }}
          register: cftd_apply
          changed_when: "'created' in cftd_apply.stdout or 'configured' in cftd_apply.stdout"

        - name: Wait for the controller manager to create the relationship
          when: _k8s | bool
          ansible.builtin.command: "{{ _cli }} federation show -trustDomain {{ dashboard_trust_domain }}"
          register: declared
          changed_when: false
          failed_when: false
          retries: 20
          delay: 3
          until: declared.rc == 0

        - name: Refuse a declaration the controller manager did not act on
          when: _k8s | bool
          ansible.builtin.assert:
            that: declared.rc == 0
            fail_msg: >-
              The ClusterFederatedTrustDomain {{ _cftd_name }} was applied, but the lab's
              SPIRE server has no relationship for {{ dashboard_trust_domain }} after a minute.
              Its className is "{{ _cftd_class }}"; the controller manager only acts on its
              own class (spire-controller-manager ConfigMap in spire-server) and on
              reconcile.clusterFederatedTrustDomains. Check
              `k3s kubectl -n spire-server logs spire-server-0 -c spire-controller-manager`.

        # The proof of the lab->dashboard direction. Fails here, with the likely cause, rather
        # than leaving a relationship that silently keeps the seed until it goes stale.
        - name: Fetch the dashboard's bundle from its endpoint now
          ansible.builtin.command: "{{ _cli }} federation refresh -id {{ dashboard_trust_domain }}"
          register: refresh
          changed_when: false
          failed_when: false

        - name: Refuse a relationship that cannot fetch
          ansible.builtin.assert:
            that: refresh.rc == 0
            fail_msg: >-
              This lab's SPIRE server could not fetch the dashboard's bundle from
              {{ dashboard_bundle_endpoint_url }}: {{ (refresh.stderr or refresh.stdout) | trim }}.
              Check that the dashboard host publishes tcp/8082 (docker-compose.spire.yml,
              SPIRE_FEDERATION_PORT) and that this host can reach it. The relationship is kept
              with its seed bundle; re-run once the port is open.

        - name: Read the federated bundle back
          ansible.builtin.command: "{{ _cli }} bundle list -id spiffe://{{ dashboard_trust_domain }} -format spiffe"
          register: federated
          changed_when: false

        - name: What this server now trusts
          ansible.builtin.debug:
            msg:
              - "Federated with {{ dashboard_trust_domain }} via {{ dashboard_bundle_endpoint_url }}"
              - "Endpoint SPIFFE ID: {{ _endpoint_id }}"
              - "Keys held for it: {{ federated.stdout | regex_findall('\"use\"') | length }}"

    # THE WORKLOAD. A relationship lets the SERVER hold the dashboard's bundle; an entry's
    # federatesWith is what hands it to a workload in its SVID response. `entry update`
    # REPLACES the entry, so every field is written back from what the server reports and
    # only federatesWith changes. Skipped when there is no linked workload, or when the
    # entry is already in the wanted state.
    - name: Read the workload's entry
      when: workload_spiffe_id | length > 0
      ansible.builtin.command: "{{ _cli }} entry show -spiffeID {{ workload_spiffe_id }} -output json"
      register: workload_entry
      changed_when: false

    - name: Set the workload's federatesWith
      when:
        - workload_spiffe_id | length > 0
        - (workload_entry.stdout | from_json).entries | default([]) | length > 0
        - (_have | sort) != (_want | sort)
      vars:
        _entry: "{{ (workload_entry.stdout | from_json).entries | first }}"
        _have: "{{ _entry.federates_with | default([], true) | map('regex_replace', '^spiffe://', '') | list }}"
        _want: >-
          {{ (_have + [dashboard_trust_domain]) | unique | list if state == 'present'
             else _have | reject('equalto', dashboard_trust_domain) | list }}
      ansible.builtin.command:
        cmd: >-
          {{ _cli }} entry update -entryID {{ _entry.id }}
          -parentID spiffe://{{ _entry.parent_id.trust_domain }}{{ _entry.parent_id.path }}
          -spiffeID spiffe://{{ _entry.spiffe_id.trust_domain }}{{ _entry.spiffe_id.path }}
          {% for sel in _entry.selectors %}-selector {{ sel.type }}:{{ sel.value }} {% endfor %}
          {% if _entry.x509_svid_ttl | default(0) %}-x509SVIDTTL {{ _entry.x509_svid_ttl }} {% endif %}
          {% if _entry.jwt_svid_ttl | default(0) %}-jwtSVIDTTL {{ _entry.jwt_svid_ttl }} {% endif %}
          {% for td in _want %}-federatesWith spiffe://{{ td }} {% endfor %}
