# Install the SPIRE OIDC Discovery Provider beside the server
# Target: the SPIRE server VM, after spire-server-install.yml. Idempotent.
#
# This is what turns a SPIRE trust domain into an ordinary OIDC issuer: it publishes
# /.well-known/openid-configuration and a JWKS endpoint carrying the trust domain's JWT
# signing keys, so any relying party that can validate an OIDC token can validate a
# JWT-SVID. The Kubernetes API server is the relying party this lab is built for — see
# k3s-spiffe-auth.yml and docs/design/workload-k8s-short-lived-token.md.
#
# NEVER LIVE-VALIDATED. Written against the SPIRE 1.15.3 documentation and this lab's own
# server.conf, but not yet run against a live server-plus-k3s pair. Treat the first run as
# the validation, and read the "Verify by hand" block at the end before trusting it.
#
# NEEDS EGRESS to github.com for the spire-extras release tarball. The provider ships in
# spire-extras-<version>, NOT in the spire-<version> tarball spire-server-install.yml
# fetches, so this downloads a second archive at the same version.
#
# IT SERVES TLS WITH AN SVID THAT SPIRE ITSELF ISSUED, which is the point. The API server
# is configured with the SPIFFE trust bundle as its certificateAuthority, so the same
# bundle that validates the token also validates the connection that published the keys,
# and no public CA or ACME round trip is involved. The consequence is the one below.
#
# THE SERVING CERTIFICATE EXPIRES, AND RE-RUNNING THIS PLAY IS THE RENEWAL. ca_ttl on the
# server caps every SVID it issues, so at the 168h default this certificate lives ~7 days
# however large svid_ttl is set — the same clamp that shortens the admin credential, and
# it prints the real expiry below. Past it the API server's JWKS fetch fails and every
# workload's kubectl call reads as an authentication error with nothing wrong at the
# workload end. A production topology renews from the Workload API on a timer; this lab
# does not, deliberately, because a lab that hides the expiry teaches the wrong lesson.
#
# UNPRIVILEGED, LIKE THE SERVER. The provider runs as its own user -- `spire-oidc` under
# systemd, uid 1001 in the container -- which is a member of the server's group only so
# it can reach the 0770 API socket. It cannot read the server's datastore or CA keys
# (0700 to the server user), and only it and root can read its own serving key.
#
# extra_vars:
#   trust_domain: weaverlab.test    # REQUIRED — must match the running server
#   oidc_domain: ""                 # REQUIRED — the DNS name or IP the KUBERNETES API
#                                   #   SERVER will reach this on. It becomes the cert's
#                                   #   SAN and the issuer URL, so it cannot be localhost.
#   oidc_port: 8443
#   spire_version: 1.15.3           # match spire-server-install.yml
#   spire_extras_sha256: ""         # tarball checksum from the release page; blank skips
#   svid_ttl: 168h                  # asked for; ca_ttl is what you actually get
- name: Install the SPIRE OIDC Discovery Provider
  hosts: all
  become: true
  vars:
    trust_domain: ""
    oidc_domain: ""
    oidc_port: 8443
    spire_version: "1.15.3"
    spire_extras_sha256: ""
    svid_ttl: "168h"
    spire_root: /opt/spire
    # How the SPIRE CLI is reached. Empty on a VM (the systemd install). The Workload Lab
    # sets it for the container modes -- `docker exec spire-server ` or
    # `k3s kubectl exec -n spire-server spire-server-0 -c spire-server -- ` -- and the
    # official images keep the binary at the same /opt/spire/bin path, so the rest of
    # every command is identical in all three modes.
    spire_cli_prefix: ""
    # true when the server runs in a container: `x509 mint -write` would write INSIDE the
    # container, so mint to stdout and split the PEM blocks on the host instead.
    spire_mint_stdout: false
    # systemd = the provider binary under a unit (VM mode); docker = the
    # `oidc-discovery-provider` service in spire-docker-server.yml's compose file, which
    # this play (re)creates so a renewed certificate is picked up.
    oidc_runtime: systemd
    compose_file: /opt/spire/compose.yml
    # Split `x509 mint` stdout into svid.pem / key.pem / bundle.pem. BY POSITION, not by
    # section header: certificates before the private key are the SVID, the key is the
    # key, certificates after it are the bundle -- which holds whatever headers the
    # pinned SPIRE version prints. Written 0600 straight from stdin; nothing is echoed.
    _pem_split: |
      import os, re, sys
      d = sys.argv[1]
      t = sys.stdin.read()
      b = [m.group(0) for m in re.finditer(r"-----BEGIN ([A-Z ]+)-----.*?-----END \1-----", t, re.S)]
      k = [i for i, x in enumerate(b) if "PRIVATE KEY" in x.splitlines()[0]]
      if len(k) != 1 or k[0] == 0 or k[0] == len(b) - 1:
          sys.exit("x509 mint output was not certificate(s), one private key, then the bundle")
      i = k[0]
      for name, parts in (("svid.pem", b[:i]), ("key.pem", [b[i]]), ("bundle.pem", b[i + 1:])):
          fd = os.open(os.path.join(d, name), os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          os.write(fd, ("\n".join(parts) + "\n").encode())
          os.close(fd)
    oidc_dir: /opt/spire/oidc
    # Who the provider runs as. systemd: named users (spire-server-install.yml creates
    # the `spire` group). docker: numeric ids matching spire-docker-server.yml's compose.
    spire_group: spire
    oidc_user: spire-oidc
    oidc_gid: 1001
    # The server's default socket_path. spire-server-install.yml does not override it, so
    # the provider reads the admin API here to fetch the JWKS.
    server_socket: /tmp/spire-server/private/api.sock
  tasks:
    - name: Require a trust domain and a reachable domain
      ansible.builtin.assert:
        that:
          - trust_domain | length > 0
          - "'/' not in trust_domain"
          - oidc_domain | length > 0
          - oidc_domain not in ['localhost', '127.0.0.1']
        fail_msg: >-
          trust_domain is required as a bare name such as 'weaverlab.test', and
          oidc_domain is required as the address the KUBERNETES API SERVER will fetch
          JWKS from. localhost is refused because the API server is on another host —
          a certificate and an issuer URL naming localhost produce a JWKS fetch that
          fails only once Kubernetes tries it, from a play that reported success.

    - name: Resolve the provider identity and issuer URL
      ansible.builtin.set_fact:
        _oidc_id: "spiffe://{{ trust_domain }}/oidc-discovery-provider"
        _issuer: "https://{{ oidc_domain }}:{{ oidc_port }}"
        _oidc_group: "{{ oidc_user if oidc_runtime == 'systemd' else (oidc_gid | string) }}"

    - name: Create the provider group
      ansible.builtin.group:
        name: "{{ oidc_user }}"
        system: true
      when: oidc_runtime == 'systemd'

    - name: Create the provider user (no shell, no home; in the server's group for the socket)
      ansible.builtin.user:
        name: "{{ oidc_user }}"
        group: "{{ oidc_user }}"
        groups: ["{{ spire_group }}"]
        append: true
        system: true
        shell: /usr/sbin/nologin
        create_home: false
      when: oidc_runtime == 'systemd'

    - name: Confirm the server is up
      ansible.builtin.command: "{{ spire_cli_prefix }}{{ spire_root }}/bin/spire-server healthcheck"
      register: oidc_health
      changed_when: false

    - name: Map the CPU architecture to a SPIRE release asset
      ansible.builtin.set_fact:
        _arch: "{{ _arch_map[ansible_facts['architecture']] | default('') }}"
      vars:
        _arch_map:
          x86_64: amd64
          aarch64: arm64
      when: oidc_runtime == 'systemd'

    - name: Fail on an architecture SPIRE does not publish
      ansible.builtin.fail:
        msg: "no spire-extras release asset for architecture {{ ansible_facts['architecture'] }}"
      when:
        - oidc_runtime == 'systemd'
        - _arch | length == 0

    - name: Create the provider directory
      ansible.builtin.file:
        path: "{{ oidc_dir }}"
        state: directory
        owner: root
        group: "{{ _oidc_group }}"
        mode: "0750"

    # Guarded on the binary's absence rather than on a version probe: unlike
    # spire-server, oidc-discovery-provider has no --version flag that is stable across
    # the 1.x line, so a version bump wants the binary removed first. Said out loud in
    # the output below rather than silently re-downloading every run.
    - name: Detect the provider binary
      ansible.builtin.stat:
        path: "{{ oidc_dir }}/oidc-discovery-provider"
      register: oidc_bin
      when: oidc_runtime == 'systemd'

    - name: Download the spire-extras release
      ansible.builtin.get_url:
        url: >-
          https://github.com/spiffe/spire/releases/download/v{{ spire_version }}/spire-extras-{{ spire_version }}-linux-{{ _arch }}-musl.tar.gz
        dest: "/tmp/spire-extras-{{ spire_version }}.tar.gz"
        checksum: "{{ ('sha256:' ~ spire_extras_sha256) if spire_extras_sha256 | length > 0 else omit }}"
        mode: "0640"
      when:
        - oidc_runtime == 'systemd'
        - not oidc_bin.stat.exists

    - name: Warn when the download was not checksummed
      ansible.builtin.debug:
        msg: >-
          spire_extras_sha256 was blank, so the tarball was taken on TLS alone. The
          release page publishes a checksum — set it for anything you intend to keep.
      when:
        - oidc_runtime == 'systemd'
        - spire_extras_sha256 | length == 0
        - not oidc_bin.stat.exists

    - name: Unpack the provider binary
      ansible.builtin.unarchive:
        src: "/tmp/spire-extras-{{ spire_version }}.tar.gz"
        dest: "{{ oidc_dir }}"
        remote_src: true
        extra_opts: ["--strip-components=2", "--wildcards", "*/bin/oidc-discovery-provider"]
        owner: root
        group: "{{ _oidc_group }}"
        mode: "0750"
      when:
        - oidc_runtime == 'systemd'
        - not oidc_bin.stat.exists

    - name: Remove the downloaded tarball
      ansible.builtin.file:
        path: "/tmp/spire-extras-{{ spire_version }}.tar.gz"
        state: absent

    # -dns puts oidc_domain in the certificate's SAN. Without it the cert carries only the
    # SPIFFE URI, and Go's TLS stack rejects the connection on hostname mismatch before
    # any of the trust-bundle configuration is consulted — which reads like a bad CA.
      when: oidc_runtime == 'systemd'

    - name: Mint the provider's serving SVID
      ansible.builtin.command: >-
        {{ spire_cli_prefix }}{{ spire_root }}/bin/spire-server x509 mint
        -spiffeID {{ _oidc_id }}
        -dns {{ oidc_domain }}
        -ttl {{ svid_ttl }}
        -write {{ oidc_dir }}
      register: oidc_mint
      changed_when: oidc_mint.rc == 0
      when: not spire_mint_stdout | bool

    - name: Mint the provider's serving SVID (to stdout, server in a container)
      ansible.builtin.command: >-
        {{ spire_cli_prefix }}{{ spire_root }}/bin/spire-server x509 mint
        -spiffeID {{ _oidc_id }}
        -dns {{ oidc_domain }}
        -ttl {{ svid_ttl }}
      register: oidc_mint_stdout
      changed_when: oidc_mint_stdout.rc == 0
      no_log: true
      when: spire_mint_stdout | bool

    - name: Split the serving SVID into the provider directory
      ansible.builtin.command:
        argv: [python3, -c, "{{ _pem_split }}", "{{ oidc_dir }}"]
        stdin: "{{ oidc_mint_stdout.stdout }}"
      changed_when: true
      no_log: true
      when: spire_mint_stdout | bool

    # Root-owned, readable by the provider's group only: the provider can read its key
    # but not rewrite it, and the SPIRE server user cannot read it at all.
    - name: Secure the minted key
      ansible.builtin.file:
        path: "{{ oidc_dir }}/{{ item }}"
        owner: root
        group: "{{ _oidc_group }}"
        mode: "0640"
      loop: [svid.pem, key.pem, bundle.pem]

    - name: Read the serving certificate's real expiry
      ansible.builtin.command: >-
        openssl x509 -in {{ oidc_dir }}/svid.pem -noout -enddate
      register: oidc_expiry
      changed_when: false

    # domains must list every name the issuer URL can be spelled as, because the provider
    # refuses a request whose Host header is not in this list — a 404 on the discovery
    # document that looks like the endpoint does not exist.
    - name: Write the provider configuration
      ansible.builtin.copy:
        dest: "{{ spire_root }}/conf/oidc-discovery-provider.conf"
        owner: root
        group: "{{ _oidc_group }}"
        mode: "0640"
        content: |
          log_level = "INFO"
          domains = ["{{ oidc_domain }}"]

          serving_cert_file {
              addr           = ":{{ oidc_port }}"
              cert_file_path = "{{ oidc_dir }}/svid.pem"
              key_file_path  = "{{ oidc_dir }}/key.pem"
          }

          server_api {
              address = "unix://{{ server_socket }}"
          }
      notify: Restart spire-oidc-provider

    # PrivateTmp is deliberately absent: the server's API socket lives under /tmp, and a
    # private /tmp namespace would give this unit its own empty one. The provider would
    # then start cleanly and fail every key fetch. ProtectSystem=strict is fine: it makes
    # /tmp read-only, and connecting to a socket is not a write to the filesystem.
    - name: Install the systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/spire-oidc-provider.service
        mode: "0644"
        content: |
          [Unit]
          Description=SPIRE OIDC Discovery Provider (Workload Lab)
          After=spire-server.service
          Wants=spire-server.service

          [Service]
          ExecStart={{ oidc_dir }}/oidc-discovery-provider -config {{ spire_root }}/conf/oidc-discovery-provider.conf
          WorkingDirectory={{ oidc_dir }}
          User={{ oidc_user }}
          Group={{ oidc_user }}
          SupplementaryGroups={{ spire_group }}
          UMask=0077
          Restart=on-failure
          RestartSec=5

          # Sandbox. It writes nothing; 8443 is unprivileged, so no capability either.
          NoNewPrivileges=yes
          CapabilityBoundingSet=
          AmbientCapabilities=
          ProtectSystem=strict
          ProtectHome=yes
          PrivateDevices=yes
          ProtectKernelTunables=yes
          ProtectKernelModules=yes
          ProtectKernelLogs=yes
          ProtectControlGroups=yes
          ProtectClock=yes
          ProtectHostname=yes
          RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
          RestrictNamespaces=yes
          RestrictRealtime=yes
          RestrictSUIDSGID=yes
          LockPersonality=yes
          MemoryDenyWriteExecute=yes
          SystemCallArchitectures=native
          SystemCallFilter=@system-service
          SystemCallErrorNumber=EPERM

          [Install]
          WantedBy=multi-user.target
      notify: Restart spire-oidc-provider
      when: oidc_runtime == 'systemd'

    - name: Enable and start the provider
      ansible.builtin.systemd:
        name: spire-oidc-provider
        enabled: true
        state: started
        daemon_reload: true
      when: oidc_runtime == 'systemd'

    # Recreated rather than restarted: the container mounts the certificate files, and a
    # recreate is what guarantees it reads the renewed ones.
    - name: (Re)create the provider container
      ansible.builtin.command: >-
        docker compose -f {{ compose_file }} up -d --force-recreate oidc-discovery-provider
      register: oidc_compose
      changed_when: oidc_compose.rc == 0
      when: oidc_runtime == 'docker'

    - name: Apply any pending restart before probing
      ansible.builtin.meta: flush_handlers

    - name: Wait for the provider port to accept connections
      ansible.builtin.wait_for:
        port: "{{ oidc_port }}"
        host: 127.0.0.1
        timeout: 60

    # Validated against the bundle it was minted from, not with -k: skipping verification
    # here would pass on exactly the misconfiguration this endpoint exists to avoid.
    - name: Fetch the discovery document
      ansible.builtin.command: >-
        curl -sS --noproxy '*' --cacert {{ oidc_dir }}/bundle.pem
        --resolve {{ oidc_domain }}:{{ oidc_port }}:127.0.0.1
        {{ _issuer }}/.well-known/openid-configuration
      register: oidc_discovery
      changed_when: false
      retries: 5
      delay: 3
      until: oidc_discovery.rc == 0 and 'jwks_uri' in oidc_discovery.stdout

    - name: Confirm the issuer the document advertises
      ansible.builtin.assert:
        that:
          - _issuer in oidc_discovery.stdout
        fail_msg: >-
          The discovery document does not advertise {{ _issuer }} as its issuer. The
          Kubernetes AuthenticationConfiguration matches on the issuer STRING, so a
          mismatch here rejects every token with no useful message. Check oidc_domain
          and oidc_port against the URL Kubernetes will be given.

    - name: What was built
      ansible.builtin.debug:
        msg:
          - "OIDC Discovery Provider serving {{ _issuer }} for trust domain '{{ trust_domain }}'."
          - "Issuer URL (give this to k3s-spiffe-auth.yml): {{ _issuer }}"
          - "JWKS:      {{ _issuer }}/keys"
          - "Identity:  {{ _oidc_id }}"
          - "Serving certificate {{ oidc_expiry.stdout | trim }} — RE-RUN THIS PLAY TO RENEW."
          - "ca_ttl on the server caps that date whatever svid_ttl ({{ svid_ttl }}) asked for."
          - "Open {{ oidc_port }} on the host firewall AND the cloud ACL to the k3s node."
          - "Verify by hand from the K3S NODE, not from here:"
          - "  curl --cacert <trust-bundle.pem> {{ _issuer }}/.well-known/openid-configuration"
          - "A connection refused there is the firewall; a certificate error is oidc_domain."
          - "Next: spire-k8s-entry.yml on this host, then spire-agent-install.yml on the node."
          - "To upgrade the provider, remove {{ oidc_dir }}/oidc-discovery-provider first —"
          - "this play guards on the binary existing, not on its version."
  handlers:
    - name: Restart spire-oidc-provider
      ansible.builtin.systemd:
        name: spire-oidc-provider
        state: restarted
        daemon_reload: true
      when: oidc_runtime == 'systemd'
