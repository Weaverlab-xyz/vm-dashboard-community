# SPIRE sidecar for the remote agent — OPT-IN, and layered over docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.spire.yml up -d
#
# Instead of keeping its Ed25519 key in the state volume, an agent next to this sidecar
# gets a short-lived SPIFFE identity from the dashboard's SPIRE server
# (docker-compose.spire.yml at the repo root) and holds its signing key only in memory.
# Without this overlay nothing changes: the agent enrols and authenticates exactly as it
# always has, and that path stays supported.
#
# STATUS: the sidecar half. The agent image that USES the socket is Phase 2 in
# docs/design/agent-and-human-identity.md — until it ships, the agent ignores
# SPIFFE_ENDPOINT_SOCKET and keeps authenticating with Ed25519. You can still prove the
# identity is there (see "Check it" below).
#
# Before the first `up`:
#   1. On the dashboard, migrate the agent to SPIRE (or create its entries by hand) and
#      copy the join token it gives you. Cloud VMs skip this — see SPIRE_AGENT_CONF.
#   2. Copy the dashboard's SPIRE trust bundle here as spire/bootstrap.crt:
#        docker compose -f docker-compose.yml -f docker-compose.spire.yml \
#          exec spire-server /opt/spire/bin/spire-server bundle show   # on the dashboard
#   3. Set SPIRE_SERVER_ADDRESS, SPIRE_TRUST_DOMAIN and (join token only) SPIRE_JOIN_TOKEN.
#
# BEHIND A TLS-INSPECTING PROXY: agent-to-server is mTLS gRPC and an inspecting proxy
# breaks it. Ask for a bypass for SPIRE_SERVER_ADDRESS:SPIRE_SERVER_PORT, or stay on
# Ed25519 — it is not going away.
#
# Check it — fetch a JWT-SVID as the agent's uid, the only uid the entry matches:
#   docker compose -f docker-compose.yml -f docker-compose.spire.yml exec --user 10001 \
#     spire-agent /opt/spire/bin/spire-agent api fetch jwt -audience check \
#     -socketPath /run/spire/sockets/agent.sock

services:
  # Named volumes are created root-owned and the sidecar runs as 1000 with a read-only
  # root — same fix, same pinned image, as the dashboard-side overlay.
  spire-volumes-init:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    command: ["sh", "-c", "chown 1000:1000 /data /sock && chmod 0700 /data && chmod 0755 /sock"]
    volumes:
      - spire_agent_data:/data
      - spire_agent_socket:/sock
    restart: "no"

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.15.3@sha256:41b0dcd8b258a69db9e2768292a060766fb76fd866e4bc925849981ea1b825ff
    container_name: dashboard-agent-spire
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    command: ["-config", "/opt/spire/conf/agent.conf", "-expandEnv"]
    environment:
      SPIRE_SERVER_ADDRESS: ${SPIRE_SERVER_ADDRESS:?set SPIRE_SERVER_ADDRESS, the dashboard host agents reach SPIRE on}
      SPIRE_SERVER_PORT: ${SPIRE_SERVER_PORT:-8081}
      SPIRE_TRUST_DOMAIN: ${SPIRE_TRUST_DOMAIN:?set SPIRE_TRUST_DOMAIN to the dashboard's trust domain}
      # Only read by agent-join-token.conf, and only on first start.
      SPIRE_JOIN_TOKEN: ${SPIRE_JOIN_TOKEN:-}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      # agent-join-token.conf (default) or agent-cloud.conf (no key at rest).
      - ./spire/${SPIRE_AGENT_CONF:-agent-join-token.conf}:/opt/spire/conf/agent.conf:ro,Z
      - ./spire/bootstrap.crt:/opt/spire/conf/bootstrap.crt:ro,Z
      - spire_agent_data:/opt/spire/data
      - spire_agent_socket:/run/spire/sockets
    depends_on:
      spire-volumes-init:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  agent:
    # Share the sidecar's PID namespace so the unix workload attestor can see this
    # process and read its uid (10001). The alternative, the docker attestor, needs the
    # Docker socket — root on the host — and nothing on this host gets that.
    pid: "service:spire-agent"
    depends_on:
      - spire-agent
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/agent.sock
    volumes:
      - spire_agent_socket:/run/spire/sockets:ro
    # agent_state is deliberately still mounted: it holds sealing.key, the host-local key
    # for sealed credentials. That is not an authentication key and SPIRE does not replace it.

volumes:
  spire_agent_data:
  spire_agent_socket:
