# Password Safe client for the agent — YOUR file, not the dashboard's.
#
# With this in place and `ps_managed_account:` on a connection, the agent holds **no
# hypervisor credential at all**. It holds one credential — this OAuth client — whose
# only power is to ask Password Safe for another, subject to Password Safe's own
# policy, approval workflow and session recording. Each job checks a credential out and
# checks it back in.
#
# The dashboard never issues this and never sees it. If it did, the dashboard would once
# again be a place from which every hypervisor could be reached, which is the thing the
# whole design exists to prevent.
#
# Mount it read-only, with the SELinux relabel:
#   -v "$PWD/passwordsafe.yaml:/etc/dashboard-agent/passwordsafe.yaml:ro,Z"
#
# The `,Z` is not optional on Fedora, RHEL, CentOS, Rocky or Alma. Same as every other
# file the agent reads.

# Either the bare host or the full /BeyondTrust/api/public/v3 path — both are accepted.
api_url: https://passwordsafe.corp.internal

client_id: 8f3c1e00-0000-0000-0000-000000000000

# Prefer client_secret_file so the value can be a Docker/Podman secret rather than
# text in a YAML file. If both are set, the file wins.
client_secret_file: /run/secrets/ps_client_secret
# client_secret: "REPLACE-ME"

# Leave true unless Password Safe presents an internal CA this container does not trust.
# If you must turn it off, mount the CA instead — AGENT_CA_BUNDLE already exists for the
# dashboard connection and the same bundle applies here.
verify_ssl: true

# ── What the tenant needs ────────────────────────────────────────────────────
#
# The OAuth client's linked BeyondInsight user needs the **Requestor** role, with an
# access policy granting **View** (API-only is fine) on a Smart Rule containing each
# managed account you reference. Without it the checkout comes back
# `4031, statuscode: 403` and the agent reports exactly that, naming the role.
#
# Two things make this easy to misdiagnose, both learned the hard way elsewhere in this
# product:
#   * a Smart Rule for one account type does not extend to another — a working VM path
#     tells you nothing about a hypervisor account;
#   * Smart Rule membership is recomputed on a schedule, so a freshly created account is
#     not requestable the instant it exists (allow a couple of minutes).
#
# If the account requires human approval, the checkout will not release until someone
# approves it and the job will fail rather than wait. Use auto-approve access policies
# for accounts an unattended agent needs.
