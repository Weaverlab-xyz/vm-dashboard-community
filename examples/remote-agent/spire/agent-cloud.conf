# SPIRE agent sidecar, cloud instance-identity attestation: the VM's own identity document
# is the proof, so no join token (no secret) ever reaches the host. Mounted by
# docker-compose.spire.yml; started with -expandEnv.
#
# The node key is kept on DISK. aws_iid, azure_imds and gcp_iit are all trust-on-first-use
# ("for any given node, attestation may occur only once"), so a memory key would leave the
# host unable to attest again after a SPIRE agent restart or a reboot. A replacement VM is
# a new instance and attests afresh.
#
# Keep exactly ONE NodeAttestor below — the one for the cloud this VM runs in — and make
# sure the dashboard's server.conf (examples/spire-server/server.conf) enables the same.
# Agents the dashboard deploys get this written for them (Settings → SPIFFE and SPIRE).

agent {
    data_dir          = "/opt/spire/data"
    log_level         = "INFO"
    server_address    = "${SPIRE_SERVER_ADDRESS}"
    server_port       = "${SPIRE_SERVER_PORT}"
    trust_domain      = "${SPIRE_TRUST_DOMAIN}"
    trust_bundle_path = "/opt/spire/conf/bootstrap.crt"
    socket_path       = "/run/spire/sockets/agent.sock"
}

plugins {
    NodeAttestor "aws_iid" { plugin_data {} }
    # NodeAttestor "azure_imds" { plugin_data { tenant_domain = "<tenant>.onmicrosoft.com" } }
    # NodeAttestor "gcp_iit"    { plugin_data {} }
    KeyManager "disk" { plugin_data { directory = "/opt/spire/data" } }
    WorkloadAttestor "unix" { plugin_data {} }
}
