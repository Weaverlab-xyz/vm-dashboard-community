# SPIRE agent sidecar, join-token attestation. For a bare Docker host with no platform
# identity. Mounted by docker-compose.spire.yml; started with -expandEnv.
#
# What this does NOT buy you, stated plainly: after the one-use token is spent the agent
# keeps its own SVID key on disk (spire_agent_data), because on restart it has nothing
# else to prove itself with. That key lives an hour, rotates, and the dashboard can ban
# it centrally — far better than a key that lives until someone re-enrols — but it is a
# key at rest. For none at all, use agent-cloud.conf on a cloud VM.

agent {
    data_dir          = "/opt/spire/data"
    log_level         = "INFO"
    server_address    = "${SPIRE_SERVER_ADDRESS}"
    server_port       = "${SPIRE_SERVER_PORT}"
    trust_domain      = "${SPIRE_TRUST_DOMAIN}"
    # The dashboard's trust bundle, copied next to the compose file. Never
    # insecure_bootstrap: the first connection is the one an attacker would intercept.
    trust_bundle_path = "/opt/spire/conf/bootstrap.crt"
    join_token        = "${SPIRE_JOIN_TOKEN}"
    socket_path       = "/run/spire/sockets/agent.sock"
}

plugins {
    NodeAttestor "join_token" { plugin_data {} }
    KeyManager "disk" { plugin_data { directory = "/opt/spire/data" } }
    # The dashboard-agent container shares this one's PID namespace, so its process is
    # visible here and is identified by uid — no Docker socket needed.
    WorkloadAttestor "unix" { plugin_data {} }
}
