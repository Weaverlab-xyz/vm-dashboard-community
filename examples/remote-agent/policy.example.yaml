# Remote agent policy — YOUR file, not the dashboard's.
#
# This is the boundary that makes it safe to run a dashboard-controlled process inside
# your network. Nothing in the dashboard API can read, write or override it; the agent
# reports only its sha256 so you can see on the Agents page whether it has changed.
#
# It fails CLOSED. If this file is missing, unreadable, or not valid YAML, the agent
# refuses every job and exits with a message saying so. There is no permissive default.
#
# Mount it read-only:
#   -v "$PWD/policy.yaml:/etc/dashboard-agent/policy.yaml:ro,Z"        # bash
#   -v "${PWD}/policy.yaml:/etc/dashboard-agent/policy.yaml:ro,Z"      # PowerShell
#
# Two details in that line are not decoration. `$PWD` because `docker run -v` rejects a
# relative source path outright — PowerShell spells it `${PWD}`, and continues lines with a
# backtick rather than a `\`. `,Z` because on an SELinux-enforcing host — Fedora, RHEL,
# CentOS, Rocky, Alma — a file in your home directory is labelled `user_home_t`, which the
# container is not allowed to read no matter how permissive its mode bits are; without the
# relabel the agent exits 2 on `Permission denied` reading this file, before it has made a
# single network call. Docker and Podman ignore `z`/`Z` where SELinux is absent, so the
# flag is safe on every host. Check with `ls -lZ policy.yaml`.
#
# On a Windows host none of the SELinux half applies — the flag is inert and bind mounts
# arrive with permissive ownership, so an unreadable file means Docker Desktop file sharing
# rather than a label. The Agents page emits both flavours; pick the shell with the toggle.
# See docs/remote-agents.md, "Running on Windows".

# ── What may be touched ───────────────────────────────────────────────────────
# The agent refuses any address:port not matched here. Matching happens on the
# RESOLVED IP at connect time, not on the hostname the dashboard asked for, so a name
# that resolves inside the range when checked and elsewhere when connected is refused.
#
# Omit `ports` to allow any port within the range. Naming ports is better: it is the
# difference between "the agent may look for databases on this subnet" and "the agent
# may reach anything on this subnet".
# 443 vCenter/ESXi and XCP-ng XAPI, 8006 Proxmox VE, 9440 Nutanix Prism,
# 5985/5986 WinRM. Trim this to the products you actually run.
targets:
  - cidr: 10.20.0.0/24
    ports: [443, 8006, 9440, 5985, 5986]

  # A single host, resolved once at startup and pinned to the resulting addresses.
  # - fqdn: vcenter.lab.internal
  #   ports: [443]

# ── What may never be touched ─────────────────────────────────────────────────
# Cloud instance metadata (169.254.0.0/16) and loopback are denied unconditionally —
# they are re-added even if you replace this list, because an operator who writes a
# wide CIDR has not decided to expose their metadata endpoint, they have just written
# a wide CIDR. Add your own ranges here to carve holes out of `targets` above.
deny:
  - 169.254.0.0/16
  - 127.0.0.0/8
  # - 10.20.0.240/28      # e.g. the production DB row you never want probed

# ── What the agent will run ───────────────────────────────────────────────────
# A closed list. A job type absent from here is refused before its payload is read,
# even if the dashboard signed it correctly.
job_types:
  - agent_discover
  # Uncomment to let this agent broker hypervisor operations. It is not enough on its
  # own — each connection below must also grant the individual verbs.
  # - agent_hypervisor
  # Uncomment to let this agent RUN PLAYBOOKS against hosts on this network. Also not
  # enough on its own — see the `ansible:` block further down, which has its own target
  # list because this is a much larger grant than a port probe.
  # - agent_ansible
  # Uncomment to let this agent run a BeyondTrust GATEWAY beside itself. Also not enough
  # on its own — see the `gateway:` block, which needs an image and an explicit
  # `privileged: true` because a Gateway cannot tunnel without it.
  # - agent_gateway

# ── What may be done to each hypervisor ───────────────────────────────────────
# Per-connection verb grants. YOU decide what may be done to each target; the
# dashboard can only ask. A connection absent from this list, or present without the
# verb, is refused however correctly the job was signed.
#
# `name` must match the `name:` of an entry in your connections.yaml AND the
# "Name in the agent's connections.yaml" field on the dashboard's Connections page.
# The dashboard never holds the credential — that string is the whole join.
#
# connections:
#   - name: dc1-vcenter
#     verbs: [inventory_sync]                                  # read-only
#   - name: lab-proxmox
#     verbs: [inventory_sync, power_on, power_off, shutdown, reboot, snapshot]
#
#   # VMware Workstation on THIS host. `allow_loopback` is what lets the agent reach
#   # vmrest on 127.0.0.1 — see below.
#   - name: my-workstation
#     verbs: [inventory_sync, power_on, power_off]
#     allow_loopback: true
#
# The verbs, and which button each one is:
#
#   power_on     Start / Power On
#   power_off    Force Off — cuts the virtual power, no guest involvement
#   shutdown     Shutdown — asks the GUEST to shut down, so it needs the guest agent
#                (VMware Tools / Integration Services / qemu-guest-agent) and does
#                nothing without it. Granting power_off instead is a power cut.
#   reboot       Reboot — the graceful one, guest agent again. Proxmox only; XCP-ng's
#                Reboot button still uses `restart` (see below) and Hyper-V has no
#                graceful reboot at all.
#   power_reset  Reset / Hard Reboot / Restart — a hard bounce, no guest involvement
#   restart      Older name, kept because policies in the field grant it. It resolves
#                PER PRODUCT — a clean reboot on XCP-ng and ESXi, a graceful shutdown
#                on Proxmox — which is exactly why `shutdown` and `reboot` exist. Grant
#                those instead for anything new; only XCP-ng's Reboot button still
#                needs this one.
#   snapshot     creates a snapshot named dash-<job id>. The name is GENERATED, never
#                supplied — there is no field anywhere in the protocol through which an
#                operator string could reach a hypervisor. Grant it only where you want
#                snapshots piling up.
#
# A verb this agent's build does not know is refused by name, so upgrading the dashboard
# before the agent costs you the new buttons and nothing else: the refusal names this
# file and the line to add, and no job is left half-done.

# ── allow_loopback ────────────────────────────────────────────────────────────
# Loopback and cloud-metadata addresses are denied unconditionally, and that deny is
# re-added even if you delete it from the list above — an operator who writes a wide
# CIDR has not decided to expose their own container.
#
# One case genuinely needs an exception: VMware Workstation's `vmrest` binds 127.0.0.1,
# so a co-located agent cannot reach it any other way. Setting `allow_loopback: true` on
# a connection exempts THAT connection, for the port its connections.yaml entry names,
# and nothing else. A discovery scan still refuses loopback however this is set — the
# exception applies only where you have already written down the name, host and port.
#
# If you can make vmrest listen on a routable address instead, do that and leave this
# alone. It is not needed for anything but a same-host connection.

# ── The sibling runner (OFF, and it needs the Docker socket) ──────────────────
# Hyper-V and BARE ESXi are the only two the agent cannot talk to itself: WinRM needs a
# real NTLM stack and a standalone ESXi host serves only the SOAP API. Both run in a
# one-shot container the agent launches and then deletes.
#
# That needs the Docker socket, which is ROOT ON THIS HOST. It is not mounted by the
# default deployment; applying examples/remote-agent/docker-compose.sibling.yml is a
# separate, deliberate act, and prefer the rootless or Podman socket. If you do not run
# Hyper-V or standalone ESXi, leave this alone — vCenter, Proxmox, Prism and XCP-ng need
# none of it.
#
# The image comes from HERE and never from a job, so a compromised dashboard cannot
# choose what runs on your host. Pull it yourself; the agent will not.
#
# sibling:
#   enabled: true
#   image: chrweav/hypervisor-runner:latest
#   network: bridge

# ── Config Management (OFF, and it needs the Docker socket) ───────────────────
# Running an Ansible playbook against a VM or a database on THIS network, in a one-shot
# container the agent creates and then deletes. This is the only way a cloud-hosted
# dashboard can configure an on-premises guest at all — the runner it would otherwise
# launch is a sibling container on its own host, which has no route to your LAN.
#
# READ THIS BLOCK DIFFERENTLY FROM THE ONES ABOVE. `targets:` at the top of this file
# grants a port PROBE. This grants a playbook, running as root, on the hosts you name.
# They are deliberately separate lists for that reason: widening a discovery sweep must
# never widen what may be reconfigured. There is no fallback — leave `ansible.targets`
# empty and nothing can be configured, however wide `targets:` is.
#
# Four things must agree before a single task runs:
#   1. the dashboard grants this agent the `agent_ansible` job type (Agents page);
#   2. `agent_ansible` is in `job_types:` above;
#   3. this block is enabled, names an image for the kind of run, and lists the target;
#   4. the run's credential — the dashboard holds it, and the agent fetches it per job,
#      sealed to a key that exists only for that one fetch.
# Withhold any one and nothing happens.
#
# It needs the Docker socket, which is ROOT ON THIS HOST — the same requirement, and the
# same overlay, as the hypervisor sibling above. Prefer the rootless or Podman socket.
#
# The IMAGES COME FROM HERE and never from a job, so a compromised dashboard cannot
# choose what executes on your host. A job says only which KIND of run it is. Pull them
# yourself; the agent will not:
#
#   docker pull chrweav/ansible-winrm:latest     # VM targets  (SSH and WinRM)
#   docker pull chrweav/ansible-cloud:latest     # database targets (localhost play)
#
# Name only the one you need — a run of a kind with no image is refused, by name.
#
# ansible:
#   enabled: true
#   vm_image: chrweav/ansible-winrm:latest
#   db_image: chrweav/ansible-cloud:latest
#
#   # Where a playbook may be applied. Its own list, NOT the `targets:` one above.
#   # Name the ports: 22 for Linux over SSH, 5985/5986 for Windows over WinRM, and the
#   # database port for a database target (5432 postgres, 3306 mysql, 1433 sqlserver).
#   targets:
#     - cidr: 10.20.10.0/24
#       ports: [22, 5985, 5986]
#     # - cidr: 10.20.20.0/24
#     #   ports: [5432]
#
#   # Ceiling on one run, after which the container is stopped. Guards against a playbook
#   # that hangs waiting on something that will never answer.
#   max_runtime_minutes: 30
#
#   # Which Docker network the runner joins. Defaults to `sibling.network` above, then
#   # `bridge`. `none` is refused: it makes every task fail as "unreachable", which reads
#   # as a firewall or credential problem on the target.
#   # network: bridge
#
# A VM only becomes selectable on the dashboard once the sync reports its ADDRESS, which
# needs the guest powered on, guest tools/Integration Services installed in it, and
# `sync_guest_details: true` on that connection in your connections.yaml. Without the
# last one the agent does not ask, because reading each guest's addresses costs a call
# per VM on every sync.

# ── The BeyondTrust Gateway (OFF, needs the Docker socket, and PRIVILEGED) ────
# A Gateway node running on THIS host, brokering PRA sessions into this network. Unlike
# everything above it, this is not a one-shot container that finishes — it is long-lived
# and it stays.
#
# READ THE `privileged:` LINE BEFORE ENABLING THIS. A Gateway carries protocol tunnels,
# which needs NET_ADMIN, NET_RAW, IPC_LOCK and /dev/net/tun. Docker has no granular way
# to grant that set here, so it is the all-or-nothing flag — and a privileged container
# is, for practical purposes, root on this host. The agent will not start a Gateway
# without the flag rather than start one that cannot work: without it the Gateway
# registers ONLINE and every tunnel silently times out, which reads as a firewall problem
# for a long time.
#
# The image comes from HERE and never from a job, like the runners above. A job says only
# whether to install one or take it away. Pull it yourself; the agent will not:
#
#   docker pull beyondtrust/sra-jumpoint:latest
#
# Pin a tag rather than tracking `latest` on anything you care about — an SRA image that
# moves under a registered Gateway is a support case nobody enjoys.
#
# The DEPLOY KEY is not here. It is per-Gateway, it is a real credential, and the agent
# fetches it from the dashboard per job, sealed to a key that exists only for that fetch.
# Nothing about a Gateway's identity is written in this file.
#
# gateway:
#   enabled: true
#   image: beyondtrust/sra-jumpoint:24.2.1
#   privileged: true
#   # Which Docker network the Gateway joins. Defaults to `sibling.network`, then `bridge`.
#   # network: bridge

# ── Ceilings ──────────────────────────────────────────────────────────────────
# Applied on top of whatever the dashboard requested; the smaller number always wins.
# These bound a scan even if someone with dashboard access asks for something silly.
limits:
  max_hosts: 1024
  max_concurrency: 64
