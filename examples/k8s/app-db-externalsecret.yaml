# Multi-key credentials consumed with envFrom — a database "connection bundle"
# where every field (host, port, name, user, password) is synced from BeyondTrust
# Password Safe by ESO into a single Secret, and the app loads the whole Secret as
# environment variables with one `envFrom.secretRef`. Contrast with
# app-externalsecret.yaml, which pulls a single key via `secretKeyRef`.
#
# PREREQUISITE: same as app-externalsecret.yaml — the dashboard's secret-delivery
# action must have installed ESO + the BeyondTrust `beyondtrust-store`
# ClusterSecretStore on this cluster (POST /clusters/{id}/secret-delivery, kind=eso;
# see docs/kubernetes.md). Until ESO creates the Secret, the db-client pod stays
# pending (CreateContainerConfigError) — that's expected, not a failure. Nothing
# sensitive is committed here: only POINTERS (remoteRef.key) into Password Safe.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-db-credentials
  namespace: sample-apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: beyondtrust-store          # = eso_bt_clustersecretstore (dashboard default)
  target:
    name: app-db-credentials         # the K8s Secret ESO creates and owns
    creationPolicy: Owner
  # Each secretKey becomes an env var of the same name when the Secret is loaded
  # via envFrom, so keep them valid env-var identifiers. remoteRef.key format
  # depends on eso_bt_retrieval_type:
  #   SECRET (default): "folder/title"   MANAGED_ACCOUNT: "system/account"
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: change-me/DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: change-me/DB_PORT
    - secretKey: DB_NAME
      remoteRef:
        key: change-me/DB_NAME
    - secretKey: DB_USERNAME
      remoteRef:
        key: change-me/DB_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: change-me/DB_PASSWORD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-client
  namespace: sample-apps
  labels:
    app: db-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-client
  template:
    metadata:
      labels:
        app: db-client
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: busybox:1.36
          # envFrom loads EVERY key of the Secret as an env var (key = var name),
          # so one reference wires up the whole connection bundle at once.
          command:
            - /bin/sh
            - -c
            - 'echo "DB target: ${DB_USERNAME:-?}@${DB_HOST:-?}:${DB_PORT:-?}/${DB_NAME:-?} (password ${DB_PASSWORD:+set})"; sleep 3600'
          envFrom:
            - secretRef:
                name: app-db-credentials
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
