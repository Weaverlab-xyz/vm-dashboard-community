# ESO-backed credentials — the real-use counterpart to app-secret.yaml. Same
# "app consumes DB_PASSWORD" shape, but the Secret is SYNCED from BeyondTrust
# Password Safe by the External Secrets Operator instead of committed as a literal.
# Nothing sensitive lives here: only a POINTER (remoteRef.key) to where the value
# lives in Password Safe; ESO writes the real value into a K8s Secret at runtime.
#
# PREREQUISITE: the dashboard's secret-delivery action must have installed ESO +
# the BeyondTrust `beyondtrust-store` ClusterSecretStore on this cluster
# (POST /clusters/{id}/secret-delivery, kind=eso; see docs/kubernetes.md). Without
# the CRDs + store, this ExternalSecret won't reconcile.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-db-credentials
  namespace: sample-apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: beyondtrust-store          # = eso_bt_clustersecretstore (dashboard default)
  target:
    name: eso-db-credentials         # the K8s Secret ESO creates and owns
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD          # key inside the produced Secret
      remoteRef:
        # Password Safe pointer — format depends on eso_bt_retrieval_type:
        #   SECRET (default): "folder/title"   MANAGED_ACCOUNT: "system/account"
        key: change-me/DB_PASSWORD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eso-secret-consumer
  namespace: sample-apps
  labels:
    app: eso-secret-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eso-secret-consumer
  template:
    metadata:
      labels:
        app: eso-secret-consumer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - 'echo "DB_PASSWORD present: ${DB_PASSWORD:+yes}"; sleep 3600'
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eso-db-credentials
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
