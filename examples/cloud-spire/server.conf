# SPIRE server for the dashboard's own trust domain, as a SIDECAR on a managed container
# runtime (Azure Container Apps, Cloud Run, ECS/Fargate, a Kubernetes pod).
#
# The compose overlay's config (examples/spire-server/server.conf) keeps everything on a
# named volume. A managed runtime has no volume that survives a restart, so the two
# things that must outlive one live elsewhere:
#
#   * the datastore (entries, attested nodes, the bundle) -> PostgreSQL, the same server
#     the dashboard already uses, in a database of its own;
#   * the trust anchor -> an UPSTREAM CA supplied as a platform secret. The server's own
#     signing keys are in memory and change on every start; each new intermediate is
#     signed by the same upstream root, so the bundle an agent bootstrapped with stays
#     valid and nothing has to be migrated again after a restart.
#
# Several replicas may share one datastore and one upstream CA: that is SPIRE's own HA
# shape, and each replica's JWT key is published in the shared bundle.
#
# The timings match the compose config and the SPIRE lab; tests/test_spire_overlay.py
# pins them. Values in ${...} are expanded at start (-expandEnv) by entrypoint.sh.

server {
    bind_address = "0.0.0.0"
    bind_port    = "8081"
    # The admin API. A unix socket on a volume shared with the app container ONLY; it is
    # never published. The app drives it with `spire-server … -socketPath` (SPIRE_SERVER_SOCKET).
    socket_path  = "/run/spire-server/api.sock"
    trust_domain = "${SPIRE_TRUST_DOMAIN}"
    # Scratch only: nothing in here has to survive a restart.
    data_dir     = "/var/lib/spire"
    log_level    = "INFO"
    ca_ttl       = "168h"
    default_x509_svid_ttl = "1h"
    default_jwt_svid_ttl  = "5m"
    jwt_issuer = "${SPIRE_JWT_ISSUER}"

    federation {
        bundle_endpoint {
            address = "0.0.0.0"
            port    = 8082
            # Explicit: SPIRE 1.15 defaults to it with a warning that an unset profile
            # will be fatal in a future release.
            profile "https_spiffe" {}
        }
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "postgres"
            connection_string = "${SPIRE_DATASTORE_URL}"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "memory" {
        plugin_data {}
    }

    UpstreamAuthority "disk" {
        plugin_data {
            cert_file_path = "/run/spire-ca/upstream.crt"
            key_file_path  = "/run/spire-ca/upstream.key"
        }
    }
}

# HTTP probes, because none of the managed runtimes can run an exec probe against a
# distroless binary (ACA and Cloud Run have no exec probe at all). Not published.
health_checks {
    listener_enabled = true
    bind_address     = "0.0.0.0"
    bind_port        = "8088"
    live_path        = "/live"
    ready_path       = "/ready"
}
