# SPIRE server for the dashboard's own trust domain. Mounted by docker-compose.spire.yml.
#
# Started with `-expandEnv`, so ${SPIRE_TRUST_DOMAIN} below comes from the compose
# environment. Everything else deliberately matches the SPIRE lab's server config
# (examples/playbooks/spire/spire-docker-server.yml): same port, CA lifetime, SVID
# lifetimes, datastore and key manager. tests/test_spire_overlay.py fails if they drift.
#
# Design and the reasoning behind every choice here: docs/design/agent-and-human-identity.md

server {
    bind_address = "0.0.0.0"
    bind_port    = "8081"
    trust_domain = "${SPIRE_TRUST_DOMAIN}"
    data_dir     = "/opt/spire/data"
    log_level    = "INFO"
    ca_ttl       = "168h"
    default_x509_svid_ttl = "1h"
    # Short on purpose: an agent presents one JWT-SVID per start, at /api/agent/attest,
    # and the dashboard refuses a second presentation of the same token anyway.
    default_jwt_svid_ttl  = "5m"
    # The `iss` claim on every JWT-SVID. Blank (the default) leaves it unset, which is all
    # agent attestation needs. Set it to give the dashboard its own federated identity
    # (docs/design/dashboard-workload-identity.md): it must equal, character for
    # character, the issuer the dashboard publishes discovery under.
    jwt_issuer = "${SPIRE_JWT_ISSUER}"

    # SPIFFE federation: this server's trust bundle, served to another SPIRE server
    # (a Workload Lab's) over https_spiffe — TLS with this server's own SVID, which is why
    # docker-compose.spire.yml publishes the port directly rather than through Caddy.
    # Public keys only. Nothing fetches it until a federation relationship names it
    # (docs/workload-lab/spiffe.md, "Federating with the dashboard").
    federation {
        bundle_endpoint {
            address = "0.0.0.0"
            port    = 8082
        }
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/opt/spire/data/datastore.sqlite3"
        }
    }

    # Bare Docker hosts with no platform identity. One-use token, minted per agent by the
    # dashboard. The agent keeps its own (hourly-rotated) SVID key on disk afterwards.
    NodeAttestor "join_token" { plugin_data {} }

    # Re-attestable attestors: an agent on one of these runs its KeyManager in memory and
    # stores no key at all. Uncomment the ones your agents run on, then restart the server.
    # The plugin_data shapes below are starting points — check them against SPIRE 1.15's
    # plugin docs (server_nodeattestor_*.md) before relying on them.
    #
    # NodeAttestor "aws_iid"    { plugin_data {} }
    # NodeAttestor "azure_imds" { plugin_data { tenants = [ { domain = "<tenant>.onmicrosoft.com" } ] } }
    # NodeAttestor "gcp_iit"    { plugin_data { projectid_allow_list = ["<project-id>"] } }

    # Community default: the CA and JWT signing keys in a file in the data volume. This
    # key now signs agent attestation, service-account SVIDs and, with the dashboard's own
    # identity on, the tokens the clouds accept in place of a stored key. On a host with a
    # cloud identity of its own, keep it in that cloud's KMS instead: comment this line
    # out and uncomment ONE block below. Switching creates a NEW CA — every attested agent
    # re-attests — so read "Protect the SPIRE server's CA key" in
    # docs/remote-agents/dashboard-identity.md first. Shapes as for the attestors above:
    # check them against SPIRE 1.15's server_keymanager_*.md before relying on them.
    KeyManager "disk" { plugin_data { keys_path = "/opt/spire/data/keys.json" } }

    # KeyManager "aws_kms" {
    #     plugin_data {
    #         region              = "<region>"
    #         key_identifier_file = "/opt/spire/data/kms-key-ids"
    #     }
    # }
    # KeyManager "azure_key_vault" {
    #     plugin_data {
    #         key_vault_uri       = "https://<vault>.vault.azure.net/"
    #         key_identifier_file = "/opt/spire/data/kms-key-ids"
    #     }
    # }
    # KeyManager "gcp_kms" {
    #     plugin_data {
    #         key_ring            = "projects/<project>/locations/<location>/keyRings/<ring>"
    #         key_identifier_file = "/opt/spire/data/kms-key-ids"
    #     }
    # }
}
