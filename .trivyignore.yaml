# Image findings scripts/ci/trivy_image.sh accepts. Each entry is scoped by `paths` to the
# one place it was reviewed, and its `statement` says why it does not apply. Prefer fixing
# (a base-image bump, a package upgrade) to adding an entry.
vulnerabilities:
  # The promote runner carries a private copy of setuptools that it injects into Azure VM
  # images, only so WALinuxAgent's `setup.py install` can run inside the target image
  # (runners/promote/Dockerfile, WALINUXAGENT block). setuptools vendors its own wheel and
  # jaraco.context; the flagged versions are setuptools-internal and the same in every
  # release WALinuxAgent can use (pinned <80; 79.0.1 and 80.9.0 vendor identical copies).
  # Nothing in the runner imports them, and inside the VM they only serve that one install.
  - id: CVE-2026-23949
    paths:
      - "opt/walinuxagent-src/_vendor/setuptools/_vendor/jaraco.context-5.3.0.dist-info/METADATA"
    statement: setuptools-internal vendored copy, used only for WALinuxAgent's setup.py inside the target VM image; no allowed setuptools ships a fixed one
  - id: CVE-2026-24049
    paths:
      - "opt/walinuxagent-src/_vendor/setuptools/_vendor/wheel-0.45.1.dist-info/METADATA"
    statement: setuptools-internal vendored copy, used only for WALinuxAgent's setup.py inside the target VM image; no allowed setuptools ships a fixed one

  # The UI robot's pip records what it vendored in pip/_vendor/vendor.txt, and the scanner
  # reads that file as a package list. pip vendors `pkg_resources`, which ships in the
  # setuptools distribution, so the manifest names setuptools even though neither setuptools
  # nor the PackageIndex module this advisory is about is present: `import setuptools` in the
  # image raises ModuleNotFoundError, and pip/_vendor has a pkg_resources directory and no
  # setuptools one. Only pip's next release changes the pin. The rest of that manifest is kept
  # current by the pip floor in runners/ui-robot/Dockerfile.
  - id: CVE-2025-47273
    paths:
      - "usr/local/lib/python3.12/dist-packages/pip/_vendor/vendor.txt"
    statement: pip vendors pkg_resources from the setuptools distribution and records it as setuptools; no setuptools module, and no PackageIndex, exists in this image
